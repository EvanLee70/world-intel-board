  {t:"Self-hosted Claude Managed Agents 프라이빗 베타 — 자체 인프라에서 관리형 에이전트 운영", vendor:"Claude", type:"기타", ci:"🤖", s:76, d:"관리형 에이전트를 앤트로픽 클라우드가 아니라 자사 인프라에 올리는 배포 형태가 프라이빗 베타로 열렸다. 데이터 경계 요건 때문에 에이전트 도입을 미뤘던 조직의 선결 조건이 사라지는 변화다.", content:"앤트로픽이 Self-hosted Claude Managed Agents를 프라이빗 베타로 제공하기 시작했다. 무엇이 달라지는가 — 지금까지 관리형 에이전트는 앤트로픽이 운영하는 환경에서 돌았고, 데이터가 조직 경계를 넘는다는 점이 금융·의료·공공 쪽 도입의 1차 장벽이었다. 자체 호스팅 형태가 열리면 에이전트 실행과 로그, 중간 산출물이 조직 네트워크 안에 남게 된다. 왜 지금 중요한가 — 같은 주에 캘리포니아주가 오픈AI의 에이전트 통제 상실을 이유로 제소했고, 구글은 패치를 익스플로잇으로 바꾸는 자율 해킹 프레임워크를 식별했다. '에이전트가 어디에서 실행되고 누가 그 실행을 감사할 수 있는가'가 규제·보안 질문으로 올라온 구간이라, 자체 호스팅은 기능이 아니라 도입 가능 여부를 가르는 조건이 된다. 프라이빗 베타이므로 영업 채널을 통한 신청이 필요하고, 적용 전에는 GPU·추론 용량 요건과 모델 업데이트 주기를 확인해야 한다. 같은 날 Claude Manufacturing 플러그인 시연 웨비나(11월 17일 11:00)도 함께 안내됐다.", fresh:"Releasebot(Anthropic 11월 업데이트)", date:"2026-11-17", url:"https://releasebot.io/updates/anthropic/claude"},
  {t:"Gemini Decisions API — 'Gemini Decision 1' 모델로 의사결정 과제를 별도 API로 분리", vendor:"Gemini", type:"모델업데이트", ci:"🤖", s:76, d:"텍스트 생성이 아니라 선택·판정을 담당하는 전용 모델·엔드포인트. 구글 딥마인드가 2026년 11월 11일 공개했다.", content:"구글 딥마인드가 2026년 11월 11일 Gemini Decisions API를 공개했고, 그 뒤에서 Gemini Decision 1이라는 신규 모델이 돈다. 설계 의도는 작업 종류의 분리다 — 자유 형식 텍스트 생성과 '여러 선택지 중 하나를 고르고 근거를 남기는' 판정 작업은 평가 방식도, 필요한 지연·단가도 다르다. 판정 작업에서 중요한 것은 문장 품질이 아니라 일관성(같은 입력에 같은 답), 캘리브레이션(확신도가 실제 정확도와 맞는가), 그리고 감사 가능성이다. 에이전트를 만드는 입장에서 이 분리가 실용적인 이유는, 라우팅·승인·분류 같은 내부 판정 단계를 범용 생성 모델로 처리하면 비용과 변동성이 모두 커진다는 데 있다. 지금 해볼 만한 실습은 자기 파이프라인에서 '생성'과 '판정'을 분리해 목록화하고, 판정 단계만 이 API로 바꿔 일관성과 단가를 측정해 보는 것이다. 다만 공개 직후라 벤더 종속과 평가 지표 공개 범위는 확인이 필요하고, 같은 역할을 기존 모델의 구조화 출력(structured output)으로 처리하던 방식과의 비교 측정 없이 전환할 단계는 아니다.", fresh:"Google DeepMind", date:"2026-11-17", url:"https://developer.gemini.com/changelog/revision-history"},
  {t:"The Complete Guide to Codex (Flavio Copes) — Codex CLI 설정부터 워크플로까지 한 편 정리", vendor:"Codex", type:"튜토리얼", ci:"🤖", s:76, d:"Codex를 처음부터 끝까지 다루는 단일 가이드. 11월 CLI 신기능(모델 프로바이더 선택, 사이드채팅 탭, 에이전트 커맨드 센터)과 함께 읽으면 설정 시간이 줄어든다.", content:"Codex를 쓰려는 사람이 공식 문서를 조각조각 따라가지 않고 한 편으로 훑을 수 있게 정리한 가이드다. 설치·설정, 승인 모드, 작업 루프, 프로젝트별 설정 파일, 흔한 실패 패턴을 순서대로 다룬다. 같이 확인하면 좋은 것이 2026년 11월 CLI 변경사항이다 — 0.168.0에서 Sessions → Model providers 메뉴로 모델 프로바이더를 둘러보고 새 채팅의 기본값을 고를 수 있게 됐고, 0.169.0에서는 옵트인 터미널 워크스페이스에 사이드 채팅 탭을 여러 개 띄워 키보드·마우스로 전환하고 재시작 후에도 다시 열 수 있게 됐다. 에이전트 커맨드 센터에서는 과거 작업을 이름·프롬프트 미리보기·작업 디렉터리로 검색할 수 있고(0.167.0부터 `codex agents --no-daemon`으로 열 수 있다), 전체화면 트랜스크립트의 'Collapse turn details'는 완료된 활동을 프롬프트 아래로 접으면서 답변은 보이게 유지하고 도구 출력은 검색 가능하게 남긴다. 이미지 쪽도 바뀌었다 — 11월 4일 GPT-Image-2.6이 Codex에 들어와 Image-2.6 Flare와 Sunburst 두 모델로 기존보다 50% 빠르게 생성하고, 이미지 편집은 사이드 패널이 아니라 오버레이에서 바로 처리된다. 12개 과제 레시피가 담긴 프롬프트 쿡북도 함께 제공된다. Claude Code를 주로 쓰더라도 이 가이드는 비교 기준으로 쓸만하다 — 승인 모델과 세션 관리 설계가 서로 달라서, 어느 쪽 습관을 옮겨올지 판단하는 데 도움이 된다.", fresh:"flaviocopes.com / OpenAI Codex changelog", date:"2026-11-16", url:"https://flaviocopes.com/codex/"},
  {t:"Harness Engineering 101 — 파이썬 300줄로 AI 에이전트 하네스를 처음부터 만들어 보는 실습 저장소", vendor:"기타", type:"튜토리얼", ci:"🤖", s:76, d:"프레임워크 없이 순수 파이썬 약 300줄로 도구 호출 루프를 직접 구현해 보는 교재.", content:"IsuruMaduranga/harness-engineering-101은 LangChain 같은 프레임워크를 쓰지 않고 순수 파이썬 약 300줄로 에이전트 하네스를 처음부터 만들어 보게 하는 실습 저장소다(GeekNews 인기글, 102포인트). 다루는 것은 에이전트의 본질적 구성요소 — 모델 호출, 도구 스키마 정의와 디스패치, 관찰 결과를 다시 프롬프트로 되돌리는 루프, 종료 조건, 오류 처리다. 프레임워크를 먼저 배우면 '왜 이 추상화가 있는지'를 모른 채 설정값만 만지게 되는데, 이 교재는 반대 방향으로 간다. 실제 효용은 Claude Agent SDK나 Codex·Gemini CLI 같은 기성 하네스를 쓸 때 나온다 — 컨텍스트가 왜 터지는지, 도구 설명문이 왜 호출 정확도를 좌우하는지, 서브에이전트 분리가 어디서 이득인지를 자기 코드로 한 번 겪어 보면 기성 도구의 옵션 이름이 전부 읽힌다. 300줄이라 한 번에 읽히는 분량이고, 읽은 뒤 자신의 반복 작업 하나를 이 루프에 얹어 보는 것까지가 한 세트다.", fresh:"GeekNews (#35651)", date:"2026-10-19", url:"https://github.com/IsuruMaduranga/harness-engineering-101"},
  {t:"GitHub MCP Server 2.1.0 — 에이전트가 리포지토리 룰셋·커스텀 프로퍼티를 읽고 관리하는 거버넌스 도구", vendor:"기타", type:"MCP", ci:"🤖", s:76, d:"리포지토리·조직·엔터프라이즈 레벨의 룰셋과 커스텀 프로퍼티를 에이전트가 조회·관리할 수 있는 도구가 추가됐다(2026년 11월 3일 릴리스).", content:"GitHub 공식 MCP 서버 2.1.0 릴리스(2026년 11월 3일)의 추가분은 거버넌스 도구다. 에이전트가 리포지토리·조직·엔터프라이즈 세 레벨에서 룰셋(ruleset)과 커스텀 프로퍼티를 읽고 관리할 수 있게 됐다. 지금까지 GitHub MCP 서버의 쓸모가 주로 '이슈·PR·코드 읽고 쓰기'에 몰려 있었던 것과 달리, 이 변경은 브랜치 보호 규칙·필수 리뷰·상태 체크 같은 정책 자체를 에이전트가 점검 대상으로 삼을 수 있게 한다. 실무 활용 예: 조직 내 리포지토리 수십 개의 보호 규칙이 서로 어긋나 있을 때 에이전트에게 '전부 조회해서 main 브랜치 강제 푸시 허용된 곳을 찾아라'를 맡기는 식의 감사 작업, 또는 새 리포지토리 생성 시 표준 룰셋이 적용됐는지 확인하는 체크. 주의할 점은 룰셋 관리가 쓰기 권한을 요구하므로, 에이전트에 넘기는 토큰 범위를 읽기 전용으로 둘지 관리 권한까지 줄지를 명확히 구분해야 한다는 것이다 — 같은 서버의 v2.3.0(2026년 11월 4일)에서는 더 세분화된 운영 제어와 Git 도구가 추가됐다. 참고로 npm의 @modelcontextprotocol/server-filesystem은 2.2.0, PyPI의 mcp-server-fetch·mcp-server-git은 2026.11.4 버전이다.", fresh:"GitHub github/github-mcp-server 릴리스", date:"2026-11-03", url:"https://github.com/github/github-mcp-server/releases"},
  {t:"skills-mcp/skills-mcp — 클로드 Skills 패턴을 MCP 호환 에이전트 아무 곳에나 이식하는 서버", vendor:"Claude", type:"MCP", ci:"🤖", s:76, d:"Claude의 Agent Skills(폴더+SKILL.md) 구조를 MCP 서버로 감싸서 MCP 클라이언트가 있는 모든 에이전트에서 같은 스킬을 쓰게 해주는 오픈소스.", content:"Anthropic의 Agent Skills는 폴더 하나에 SKILL.md와 보조 파일을 두면 에이전트가 필요할 때만 읽어 쓰는 구조인데, 기본적으로는 Claude 계열 클라이언트 전용이다. skills-mcp는 그 스킬 디렉터리를 MCP 서버로 노출해 Cursor·Windsurf·Cline처럼 MCP 클라이언트를 가진 다른 에이전트에서도 동일한 스킬을 호출하게 만든다. 설치해볼 값이 있는 이유는 중복 유지보수를 없애기 때문이다 — 사내 규칙·배포 절차·리뷰 체크리스트를 스킬 한 벌로 작성해 두면 어떤 에디터를 쓰는 팀원이든 같은 지침을 받는다. 비슷한 저장소로 portertech/skills-mcp-server(이미 등재)가 있으나 그쪽은 스킬을 도구로 평탄화하는 접근이고, 이 저장소는 'Skills 패턴 자체를 가져간다'는 쪽에 무게를 둔다. 공식 MCP TypeScript SDK 2.4.0의 Skills over MCP(SEP-2640) 지원과 방향이 같으므로, 표준이 굳어지기 전에 어느 구현이 자기 환경에 맞는지 비교해볼 시점이다.", fresh:"GitHub", date:"2026-11-16", url:"https://github.com/skills-mcp/skills-mcp"},
  {t:"hesreallyhim/awesome-claude-code — 스타 5만 8,000개, Claude Code 워크플로·슬래시커맨드·CLAUDE.md 사례 모음의 사실상 표준 목록", vendor:"Claude", type:"기타", ci:"🤖", s:75, d:"Claude Code 관련 커뮤니티 자료 가운데 가장 많이 참조되는 큐레이션 목록(11월 14일 기준 5만 8,000스타)", content:"Claude Code 생태계에서 어디서부터 보면 되느냐는 질문의 기본 답에 해당하는 저장소다. 11월 14일 기준 스타 5만 8,000개로, 개별 플러그인 저장소들(수백~수천 스타)과 자릿수가 다른 참조 규모를 갖는다. 내용은 도구 하나가 아니라 사용 패턴의 집합이다 — 실제로 쓰이는 슬래시 커맨드 정의, CLAUDE.md 작성 사례, 훅(hook) 구성, 워크플로 레시피, 보조 CLI와 통합 도구가 분류돼 있다. 플러그인 마켓플레이스가 '무엇을 설치할 수 있는가'를 알려주는 반면 이 목록은 '남들이 어떻게 설정해 쓰는가'를 보여주기 때문에, 설치보다 설정에서 막혔을 때 실효가 크다. 특히 CLAUDE.md와 커맨드 섹션은 자기 저장소 규칙을 짤 때 그대로 베껴 시작할 수 있는 수준이다. 단점은 규모가 커지면서 항목 간 품질 편차가 생겼다는 점으로, 상위 섹션부터 보고 필요한 범주만 파고드는 쪽이 효율적이다.", fresh:"GitHub hesreallyhim/awesome-claude-code", date:"2026-11-14", url:"https://github.com/hesreallyhim/awesome-claude-code"},
  {t:"라즈베리 파이 5(16GB)에서 Qwen3-30B 실시간 구동 — 엣지 로컬 추론의 하드웨어 하한선 실측", vendor:"기타", type:"튜토리얼", ci:"🤖", s:75, d:"300억 파라미터급 MoE 모델을 10만원대 SBC에서 실사용 속도로 돌린 사례다. 로컬 추론 실험의 진입 비용이 크게 내려간다.", content:"GeekNews에 올라온 실측 사례다. 라즈베리 파이 5의 16GB 모델에서 Qwen3-30B를 실시간에 가까운 속도로 구동했다는 보고다. 가능한 이유는 모델이 MoE(전문가 혼합) 구조라 전체 파라미터가 300억이어도 요청당 활성 파라미터가 훨씬 적기 때문이고, 양자화를 거치면 16GB 메모리 안에 가중치가 들어온다. 무엇을 배울 수 있나 — (1) '파라미터 수'가 아니라 '활성 파라미터 수 + 양자화 후 메모리 풋프린트'가 로컬 구동 가능성의 실제 기준이라는 점. (2) 엣지 추론 실험을 위해 GPU 서버를 빌릴 필요가 없다는 점 — 10만원대 보드로 아키텍처 선택의 영향을 직접 체감할 수 있다. 지금 해볼 수 있는 것 — llama.cpp 계열 런타임으로 같은 구성을 재현해 토큰/초와 첫 토큰 지연을 측정하고, 밀집(dense) 7B 모델과 비교해 보면 MoE의 이점이 어느 작업에서 유지되는지 알 수 있다. 주의할 점은 이런 사례의 '실시간'이 보통 짧은 컨텍스트 기준이라는 것이다 — 컨텍스트가 길어지면 KV 캐시 메모리가 빠르게 늘어 16GB 한계에 먼저 부딪힌다. llama.cpp가 최근 ggml v1 안정 API를 공개한 흐름과 함께 보면 로컬 추론 스택의 재현성도 좋아지고 있다.", fresh:"GeekNews(news.hada.io)", date:"2026-11-17", url:"https://news.hada.io/articles"},
  {t:"anthropics/knowledge-work-plugins — Claude Cowork/Code용 역할별 플러그인 11종(sales/data/design/engineering/legal/hr/finance/marketing/operations/product-management/customer-support 등)", vendor:"Claude", type:"Plugin", ci:"🤖", s:75, d:"직무별로 Claude를 전문가처럼 쓰게 하는 공식 플러그인 마켓플레이스. claude plugin marketplace add anthropics/knowledge-work-plugins 로 등록.", content:"Anthropic이 자체 업무에서 쓰던 방식을 오픈소스로 공개한 지식노동자용 플러그인 모음. Claude Cowork(데스크톱 에이전트 앱) 전용으로 설계됐지만 Claude Code에서도 동작한다. sales(call-prep 등 슬래시 명령), data(SQL/시각화/대시보드 — data-analyst), productivity(TASKS.md 기반 작업관리+2단계 메모리+시각 대시보드), design/engineering/legal/human-resources/finance/marketing/operations/product-management/customer-support/enterprise-search/bio-research/small-business/partner-built까지 총 11개 이상의 역할별 플러그인이 있다. 설치는 2단계: ①claude plugin marketplace add anthropics/knowledge-work-plugins로 마켓플레이스 등록 ②claude plugin install <이름>@knowledge-work-plugins로 원하는 것만 개별 설치. 모든 구성요소가 markdown+JSON 파일 기반(코드/빌드 없음)이라 가볍다. 이 VM에는 마켓플레이스만 등록해둔 상태, 특정 플러그인 설치는 아직 미결정.", fresh:"GitHub anthropics/knowledge-work-plugins", date:"2026-11-14", url:"https://github.com/anthropics/knowledge-work-plugins"},
  {t:"quemsah/awesome-claude-plugins — Claude Code 플러그인 자동 색인 + 채택 지표 크롤러, 11월 19일 기준 저장소 5만 9,634개 인덱싱", vendor:"Claude", type:"Plugin", ci:"🤖", s:74, d:"사람이 고른 큐레이션이 아니라 크롤러가 GitHub 전체에서 Claude Code 플러그인을 긁어 채택 지표까지 붙이는 색인", content:"대부분의 awesome-* 목록은 관리자가 손으로 추가해 최신성이 떨어지고 기준도 주관적이다. quemsah/awesome-claude-plugins는 Node.js/TypeScript 크롤러가 GitHub 저장소를 훑어 Claude Code 플러그인을 자동 색인하고 채택 지표(스타·활동 등)를 함께 집계하는 방식으로 그 문제를 피한다. 11월 19일 기준 인덱싱된 저장소 수는 5만 9,634개로, 손으로 관리하는 목록(같은 이름의 rdmgator12 저장소는 공식 카탈로그 기준 523개)과는 커버리지 규모가 다르다. 쓸 만한 용도는 두 가지다 — 첫째, 특정 기능의 플러그인이 이미 존재하는지 확인하는 중복 조사(직접 만들기 전 검색). 둘째, 플러그인 생태계의 실제 채택 분포 파악으로, 스타가 몰린 소수와 방치된 다수를 구분해 의존 대상을 고를 때 쓴다. 주의할 점은 자동 색인이라 품질 필터가 없다는 것이다 — 색인에 있다는 사실이 동작한다는 보장은 아니므로, 최종 선택은 커밋 최신성과 이슈 응답을 직접 확인해야 한다.", fresh:"GitHub quemsah/awesome-claude-plugins", date:"2026-11-19", url:"https://github.com/quemsah/awesome-claude-plugins"},
  {t:"Herald MCP — 에이전트가 브라우저 탭의 3D 캐릭터로 사람에게 말을 거는 MCP 서버, Claude Code 플러그인으로 패키징", vendor:"Claude", type:"MCP", ci:"🤖", s:74, d:"에이전트의 알림을 브라우저 3D 캐릭터 음성·동작으로 전달하는 MCP 서버", content:"장시간 돌아가는 에이전트의 문제는 '언제 끝났는지, 언제 사람이 개입해야 하는지'를 알기 어렵다는 점이다. Herald는 그 알림 경로를 사람 쪽 화면으로 옮긴 MCP 서버다. 11월 10일 PR #1로 Claude Code 플러그인 형태로 패키징되고 announce 스킬이 함께 추가됐다. 에이전트가 announce를 호출하면 사용자가 열어둔 브라우저 탭에 3D 캐릭터가 등장해 전할 말을 직접 전달한다. 터미널 알림이나 OS 토스트와 달리 시선을 끌 수밖에 없는 형태라, 승인이 필요한 지점에서 에이전트를 멈춰 세워야 하는 워크플로에 맞는다. 설치는 Claude Code 플러그인 추가로 끝나고 MCP 서버 설정을 따로 손볼 필요가 없다. 실험적 성격이 강하지만 '에이전트 → 사람' 방향의 알림 채널을 어떻게 설계할 수 있는지 보여주는 구현 사례로 읽을 만하다.", fresh:"GitHub nirholas/herald-mcp PR #1", date:"2026-11-10", url:"https://github.com/nirholas/herald-mcp/pull/1"},
  {t:"awslabs/mcp — AWS가 직접 관리하는 AWS용 MCP 서버 모노레포, 11월 17일자 릴리스", vendor:"기타", type:"MCP", ci:"🤖", s:74, d:"AWS 서비스별 MCP 서버를 한 레포에서 묶어 배포한다. 11월 17일자 릴리스로 다수 서버가 함께 갱신됐다.", content:"awslabs/mcp는 AWS가 직접 관리하는 MCP 서버 모노레포로, 2026년 11월 17일자 릴리스(태그 2026.11.20261117195521)가 올라왔다. 이 레포의 구조를 알아 둘 가치가 있다 — 서비스마다 별개 레포를 찾아다니는 대신, AWS 문서 조회, 비용 분석, CDK·테라폼 지원, 각종 매니지드 서비스 조작용 서버가 한 곳에 모여 있고 릴리스도 묶여서 나간다. 즉 버전을 하나 고정하면 여러 서버의 조합이 함께 검증된 상태로 간다는 뜻이다. 쓰는 법은 필요한 서버만 골라 MCP 클라이언트 설정에 등록하는 방식이다. 전부 등록하면 툴 개수가 수백 개로 늘어 컨텍스트를 잡아먹고 모델이 잘못된 툴을 고를 확률도 올라가므로, 실제 쓰는 서비스에 해당하는 서버만 켜는 편이 낫다. 권한 설계가 핵심이다 — 이 서버들은 로컬 AWS 자격증명을 그대로 쓰므로 에이전트가 가진 권한은 그 프로필의 권한과 같다. 읽기 전용 역할을 따로 만들어 붙이고, 비용·리소스 조회부터 시작해 변경 작업은 나중에 별 프로필로 분리하는 순서를 권한다. 모노레포 릴리스는 빈도가 높으므로(거의 매일) 자동 업데이트보다 버전 핀을 두고 주기적으로 올리는 운영이 사고를 줄인다.", fresh:"GitHub awslabs/mcp", date:"2026-11-17", url:"https://github.com/awslabs/mcp/releases/tag/2026.11.20261117195521"},
  {t:"Claude Code ↔ Codex CLI 양방향 MCP 연결 — 두 에이전트를 서로의 도구로 등록하는 설정", vendor:"Claude", type:"MCP", ci:"🤖", s:74, d:"Claude Code와 Codex CLI를 각각 MCP 서버로 노출해 한쪽에서 다른 쪽을 호출하게 만드는 구성 문서다. 11월 18일 갱신됐다.", content:"Claude Code와 Codex CLI를 서로의 MCP 서버로 등록해 양방향으로 호출하는 설정 문서가 2026년 11월 18일 갱신됐다. 하는 일은 단순하다 — Claude Code 세션 안에서 Codex를 도구로 부르고, Codex 세션 안에서 Claude Code를 도구로 부른다. 쓸모가 생기는 상황은 구체적이다. 모델마다 잘하는 작업이 갈리므로(한쪽은 긴 리팩터링, 다른 쪽은 특정 언어 디버깅) 한 저장소 안에서 작업 종류에 따라 에이전트를 바꿔 쓰고 싶을 때, 터미널을 두 개 띄우는 대신 한 세션에서 위임할 수 있다. 또 하나는 교차 검증이다 — 한 에이전트가 쓴 패치를 다른 에이전트에게 리뷰시키면 같은 모델의 같은 맹점을 반복하는 문제를 줄일 수 있다. 주의할 점은 권한과 비용이다. 양쪽 모두 파일 쓰기와 명령 실행 권한을 갖게 되므로 샌드박스·승인 설정이 두 겹으로 필요하고, 위임이 중첩되면 토큰 사용이 눈에 띄게 늘어난다. 처음에는 읽기·리뷰 작업만 위임해 효과를 확인하고, 쓰기 위임은 git worktree로 작업 공간을 분리한 뒤 붙이는 순서가 안전하다. 같은 목적의 도구로 CodeMe처럼 두 에이전트를 한 화면에서 돌리는 방식도 있으니, MCP 연결과 비교해 자기 작업 흐름에 맞는 쪽을 고르면 된다.", fresh:"codex.danielvaughan.com", date:"2026-11-18", url:"https://codex.danielvaughan.com/2026/03/26/claude-code-codex-bidirectional-mcp/"},
  {t:"Microsoft Agent 365 공식 가이드(Ignite 2026) — 에이전트를 '디렉터리에 등록된 신원'으로 관리하는 통제 평면 문서", vendor:"기타", type:"기타", ci:"🤖", s:74, d:"에이전트에 신원·권한·비용·감사 로그를 붙여 운영하는 구조를 벤더 문서로 정리한 것. 사내에 에이전트를 여러 개 돌릴 때 필요한 관리 항목 체크리스트로 쓸 수 있다.", content:"마이크로소프트가 Ignite 2026(2026년 11월 17~20일, 샌프란시스코 모스코니 센터)에 맞춰 공개한 Agent 365 안내 문서다. Agent 365의 출발점은 '에이전트도 직원처럼 신원을 가져야 한다'는 모델이다 — 디렉터리에 등록하고, 권한 범위를 부여하고, 활동을 감사 로그로 남기고, 비용을 귀속시킨다. 이번 Ignite에서 범위가 한 단계 넓어져 에이전트 통제 평면(agentic control plane)에서 모델·어시스턴트까지 포함하는 AI 관측(observability) 플랫폼으로 제시됐다. 함께 보면 좋은 항목은 Microsoft Foundry의 에이전트 평가·개선 도구, Agent 365의 비용·거버넌스 통제, 코파일럿의 사용량 기반 과금(usage-based billing)이다. 자체 인프라 쪽에서는 Foundry Local on Azure Local이 정식 출시돼, 요청 경로에 클라우드 의존이 없고 네트워크 지연과 토큰당 과금이 없는 사내 추론이 가능해졌다. 사내에서 에이전트를 둘 이상 운영하려는 경우 이 문서는 '무엇을 관리 대상으로 놓아야 하는가'(신원, 권한, 비용, 로그, 평가)의 목록으로 쓸 수 있고, 특정 벤더를 쓰지 않더라도 같은 축으로 자체 관리 체계를 설계할 수 있다. 다만 기조연설이 11월 17일 오전 10시(태평양시간) 이후라, 세부 기능의 가용 범위(프리뷰/GA)는 발표 후 변경될 수 있다.", fresh:"Microsoft Tech Community", date:"2026-11-17", url:"https://techcommunity.microsoft.com/blog/agent-365-blog/microsoft-ignite-2026-your-guide-to-agent-365/4571750"},
  {t:"Codex 0.169.0 — 터미널 사이드챗 탭, 작업 검색, 커스텀 모델 공급자 설정, 번들 zsh 폐지", vendor:"Codex", type:"기타", ci:"🤖", s:74, d:"터미널 워크스페이스에서 여러 사이드챗을 탭으로 띄우고 재시작 후에도 복원한다. 패치된 zsh 번들을 걷어내고 표준 셸 실행기로 통일했다.", content:"OpenAI Codex 0.169.0에 들어온 변경 가운데 실제로 작업 방식이 달라지는 항목을 추리면 네 개다. (1) 터미널 사이드챗 탭 — 옵트인 터미널 워크스페이스에서 여러 사이드챗을 탭으로 열고 키보드나 마우스로 전환할 수 있으며, 저장된 로컬 사이드챗은 Codex를 재시작한 뒤 다시 열 수 있다. 메인 작업 흐름을 끊지 않고 '이 함수 뭐였지'를 옆에서 묻는 패턴이 가능해진다. (2) 작업 검색(task search) — 쌓인 작업 목록을 찾아 들어갈 수 있다. 장시간 여러 작업을 돌리는 사용에서 필요한 기능이다. (3) 커스텀 모델 공급자 설정 — 자체 엔드포인트를 붙일 수 있다. 사내 게이트웨이를 경유해야 하는 환경에서 중요하다. (4) 번들 zsh 폐지 — Codex가 패치된 zsh를 함께 배포하던 방식을 걷어내고 표준 셸 실행기를 쓴다. 이건 설정 호환성에 영향을 주는 변경이다: 폐지된 셸 플래그를 쓰던 설정은 마이그레이션 안내를 받게 되므로, 업그레이드 전에 자기 설정 파일에서 셸 관련 플래그를 확인해 두는 편이 낫다. 그 밖에 실행 중인 Codex Cloud 작업을 다시 열 때 로드된 메시지가 유지되고, 확장된 명령 카드가 전체 명령과 더 많은 출력을 보여주며, iPad·iPhone에서 키보드·툴바 동작이 개선됐다. Ghostty·Kitty에서 tmux 안의 전체화면 Codex가 이미지 프리뷰를 표시하려면 allow-passthrough all 설정이 필요하다.", fresh:"OpenAI Codex Changelog", date:"2026-11-17", url:"https://help.openai.com/en/articles/11428266-codex-changelog"},
  {t:"vishalsachdev/canvas-mcp — Canvas LMS를 도구 102개·에이전트 스킬 8개로 노출하는 MCP 서버(Claude·Cursor·Codex 호환)", vendor:"Claude", type:"MCP", ci:"🤖", s:74, d:"강의·과제·채점·공지까지 Canvas LMS 작업을 에이전트에게 넘긴다. 도구 최대 102개에 스킬 8개가 함께 들어 있어 MCP+스킬 결합 구조의 실전 예시다.", content:"Canvas LMS(대학·학교에서 널리 쓰는 학습관리시스템)를 MCP로 감싼 오픈소스 서버다. 규모가 특징인데, 도구가 최대 102개이고 여기에 학생·교직원용 에이전트 스킬 8개가 함께 들어 있다. 호환 대상은 Claude, Cursor, Codex 등 40종 이상 에이전트라고 밝히고 있고, 2026년 11월 1.18.0 버전이 나왔다. 배울 지점은 Canvas 자체가 아니라 설계다 — 도구 100개가 넘어가면 모델이 선택에 실패하기 시작하므로, 이 저장소는 그 위에 스킬을 얹어 '무엇을 할 때 어떤 도구를 어떤 순서로 쓰는가'를 미리 묶어 둔다. MCP 서버를 직접 만들 때 도구 수가 늘어나는 프로젝트라면 이 MCP+스킬 2계층 구성이 참고 패턴이 된다. 교육기관에 있거나 Canvas를 쓰는 환경이면 바로 설치해 과제 조회·채점 보조·공지 작성에 붙일 수 있고, 아니라면 '대형 도구 집합을 스킬로 길들이는 방법'을 읽는 레퍼런스로 쓸만하다. 설치 전 확인할 것은 권한 범위다 — 채점·공지 등 쓰기 작업이 포함된 도구가 있으므로 API 토큰 스코프를 읽기 전용으로 시작해 단계적으로 여는 쪽이 안전하다.", fresh:"GitHub", date:"2026-11-16", url:"https://github.com/vishalsachdev/canvas-mcp"},
  {t:"SGLang-Neuron v0.1.0 — SGLang 코드를 그대로 두고 AWS 트레이니움에서 프런티어 오픈웨이트 모델 서빙하기(Apache 2.0)", vendor:"기타", type:"기타", ci:"🤖", s:74, d:"AWS가 LMSYS·RadixArk와 공개한 트레이니움용 SGLang 플러그인 런타임. 기존 SGLang API를 바꾸지 않고 백엔드만 교체한다.", content:"2026년 11월 12일 AWS가 오픈소스 SGLang 프로젝트(LMSYS·RadixArk 주도)와 협업해 공개 프리뷰로 내놓은 서빙 런타임이다. 배울 가치는 '추론 백엔드를 바꾸는 작업이 얼마나 가벼워졌는가'에 있다. 구조는 TorchNeuron 위에 올린 분리형(out-of-tree) 플러그인이고, torch.compile을 통해 트레이니움 가속기를 네이티브 PyTorch 실행 디바이스로 등록한다. 그래서 모델 서빙 코드와 강화학습 롤아웃 생성 코드를 기존 SGLang 인터페이스 그대로 두고 하드웨어만 바꿀 수 있다. 검증된 즉시 사용 레시피에는 밀집 추론 모델, Llama 파라미터 변형, DeepSeek 계열 MoE, GLM, Kimi, GPT-OSS 120B가 포함된다. 보도된 세부 구성은 지원 모델 17개, Kimi-K3를 3노드에 분리(disaggregated) 배치, GLM-5.2를 100만 토큰 컨텍스트로 구동, trn3·EFA 환경, Apache 2.0 라이선스다. 설치는 AWS Deep Learning Container로 받으면 되고, 직접 해볼 만한 실험은 같은 모델·같은 프롬프트를 GPU 백엔드와 트레이니움 백엔드에서 각각 돌려 토큰당 단가와 p95 지연을 비교하는 것이다. 단 v0.1.0 프리뷰라 성능·안정성 수치는 아직 독립 벤치마크로 확인되지 않았으니 프로덕션 전환 판단은 자기 측정값으로 해야 한다.", fresh:"AICoder / AWS ML Blog", date:"2026-11-13", url:"https://aicoder.com/news/news-20261113-sglang-neuron-v0-1-0-open-source-public-preview-aws-trainium-trn3-kimi-k3-glm-5-2-pd-efa"},
  {t:"agweb — 포커스를 훔치지 않는 '에이전트용 브라우저', Claude Code·Codex용 에이전트 스킬을 함께 설치", vendor:"기타", type:"Skill", ci:"🤖", s:74, d:"에이전트가 셸에서 playwright-cli 스타일 명령으로 조작하는 macOS 전용 브라우저. Claude Code와 Codex용 스킬을 설치해 쓴다.", content:"paul-nameless/agweb은 에이전트가 쓰도록 만든 macOS 브라우저다. 일반 브라우저로 자동화를 돌리면 창이 포커스를 가져가 사람이 동시에 작업을 못 하는데, agweb은 창 하나를 띄워 두고 절대 포커스를 가져가지 않으면서 모든 탭을 한 화면에 보여준다. 조작은 셸에서 `agweb` 명령으로 하며, playwright-cli와 비슷한 명령 구조라 기존 브라우저 자동화 지식을 그대로 쓸 수 있다. 사용자는 에이전트가 무엇을 클릭하고 어디로 이동하는지 실시간으로 지켜볼 수 있어, 헤드리스 자동화에서 생기는 '무슨 일이 일어났는지 모르는' 문제가 줄어든다. 저장소는 Claude Code와 Codex용 에이전트 스킬 설치를 안내하므로, 두 CLI 중 무엇을 쓰든 브라우저 조작 능력을 붙일 수 있다. 전제 조건은 macOS 26 이상이라 그 아래 버전에서는 쓸 수 없고, 리눅스·윈도우 사용자는 Vercel의 agent-browser 같은 크로스플랫폼 대안을 봐야 한다. 2026년 11월 15일 GitHub 트렌딩에 올라 하루 400개 이상 스타가 붙은 것으로 집계됐다.", fresh:"GitHub", date:"2026-11-15", url:"https://github.com/paul-nameless/agweb"},
  {t:"Qwen4-Max-Preview — Anthropic Messages 규격 호환으로 Claude Code·Cursor에 엔드포인트만 바꿔 붙이는 플래그십 프리뷰", vendor:"기타", type:"모델업데이트", ci:"🤖", s:74, d:"OpenAI·Anthropic 양쪽 API 규격을 지원해 기존 코딩 에이전트에 그대로 연결 가능한 알리바바 플래그십 프리뷰.", content:"알리바바가 Qwen4 계열 플래그십 Qwen4-Max를 토큰 플랜에서 프리뷰로 공개했다. 실무에서 바로 시도할 수 있는 이유는 호환성이다 — OpenAI Chat Completions·Responses와 Anthropic Messages 양쪽 규격을 지원하므로 Claude Code나 Cursor의 모델 엔드포인트만 교체해 같은 워크플로로 쓸 수 있다. 접근 경로는 알리바바 토큰 플랜 외에 QwenWork, Qoder, Qwen APP, QwenStudio가 있고 프리뷰 기간은 베이징시간 11월 11일 10:00부터 11월 25일 24:00까지다. 알리바바가 내세운 개선점은 더 깊은 지식, 풍부한 세계 이해, 강화된 코딩·에이전트 능력이며 스크린샷 분석·문서 이해·영상 분석 같은 멀티모달 시나리오를 전면에 뒀다. 주의할 점은 평가 근거가 없다는 것 — 출시 시점에 공개 벤치마크, 모델카드, 파라미터 수, 가중치가 전부 비공개라 성능 주장은 모두 자체 발표다. 따라서 '우리 과제에서 직접 돌려 비교'하는 용도로만 쓰고, 비용 비교는 프리뷰가 끝난 뒤 정식 과금표가 나올 때까지 보류하는 것이 맞다.", fresh:"Qwen / neurohive", date:"2026-11-11", url:"https://neurohive.io/en/news/qwen4-max/"},
  {t:"Claude Code 2.1.321 — MCP 태스크가 터미널에서 백그라운드로 내려가고, 답을 기다리는 태스크를 /tasks로 안내", vendor:"Claude", type:"모델업데이트", ci:"🤖", s:74, d:"오래 걸리는 MCP 작업이 터미널을 붙잡지 않는다. 입력을 기다리는 태스크는 클로드가 먼저 알려준다.", content:"11월 9일 릴리스된 Claude Code 2.1.321의 변경점 두 가지가 실사용에 바로 걸린다. 첫째, MCP 태스크가 터미널에서 백그라운드로 내려간다 — 빌드·크롤링·배포처럼 수 분 걸리는 MCP 도구 호출이 세션을 점유하지 않으므로, 그 사이 다른 지시를 계속 내릴 수 있다. 둘째, 어떤 태스크가 사용자 답변을 기다리는 상태가 되면 클로드가 그 사실을 전달받아 /tasks로 안내한다 — 백그라운드로 내려간 작업이 조용히 멈춰 있는 상태를 놓치지 않게 하는 장치다. 함께 보면 좋은 것은 같은 계열의 후속 릴리스다: 2.1.323은 Code Mode(클로드가 JavaScript로 자기 도구를 호출)와 플러그인 버전 게이팅을, 2.1.325는 예정 작업·/loop이 allowed-tools·hooks를 선언한 스킬을 실행하기 전 확인을 받도록 하는 변경을 담았다. 장시간 MCP 작업을 쓰는 워크플로라면 2.1.321 이상으로 올리는 것이 체감 차이가 가장 크다.", fresh:"releases.sh / Claude Code", date:"2026-11-09", url:"https://releases.sh/anthropic/claude-code#2.1.321"},
  {t:"NAC — 장기 작업용 오픈소스 에이전트 하네스, MCP로 기존 클라이언트에 연결하고 Podman·worktree로 격리", vendor:"기타", type:"기타", ci:"🤖", s:74, d:"실험·학습·인프라 구축처럼 몇 시간 이상 걸리는 작업에서 원래 목표가 흐려지는 문제를 겨냥한 Rust 기반 하네스(Apache-2.0). 오케스트레이터와 실행 Thread를 분리하고 결과를 Episode로 남긴다.", content:"NAC(arcee-ai/nac)는 '오래 걸리는 작업'을 전제로 설계된 에이전트 하네스다. 긴 작업에서 에이전트가 흔히 겪는 실패는 중간 산출물에 끌려가 처음 목표를 잃는 것인데, NAC는 역할 분리로 이를 막는다 — 중앙 오케스트레이터가 전체 작업을 계획하고 목표를 들고 있으며, 실제 명령 실행과 파일 수정은 개별 Thread가 맡는다. 각 작업이 끝나면 핵심 결과를 Episode로 기록하고, 오케스트레이터는 그 Episode만 보고 다음 단계를 결정한다. 즉 컨텍스트에 모든 중간 로그를 쌓지 않고 압축된 결과만 남기는 구조다. 격리도 신경 써서 만들어졌다: 실행은 Podman 샌드박스 안에서 이뤄지고, Git 저장소에서는 세션별 worktree를 만들어 미커밋 변경을 다른 세션과 섞이지 않게 한다. 연결은 MCP로 하므로 지금 쓰는 에이전트 클라이언트를 버리지 않아도 된다. 모델 쪽은 Arcee 계정, ChatGPT OAuth, OpenAI/Anthropic/DeepSeek API 키를 지원하고, 세션 관리와 모델 설정은 nac-web 웹 인터페이스로 한다. 온보딩 스킬과 HTTP API도 제공된다. 바로 할 수 있는 것: 지금 Claude Code 한 세션으로 몇 시간씩 돌리던 작업(대규모 마이그레이션, 데이터 파이프라인 구축 등)을 NAC에 올려 Episode 로그를 비교해 보는 것 — 어느 단계에서 목표가 흐려졌는지 사후 추적이 가능해진다. Rust 구현이라 빌드 환경이 필요하고 1.0 이전 수준의 성숙도라는 점은 감안할 것.", fresh:"GeekNews / Arcee AI", date:"2026-11-13", url:"https://github.com/arcee-ai/nac"},
  {t:"Images 2.6 — ChatGPT·Codex·API 전체 배포, 이미지 생성 50% 가속과 GIF 애니메이션", vendor:"OpenAI", type:"모델업데이트", ci:"🤖", s:74, d:"이미지 생성이 50% 빨라지고 GIF 애니메이션 출력과 더 정밀한 편집이 추가됐다.", content:"OpenAI가 Images 2.6을 ChatGPT, Codex, API 세 곳에 동시 배포했다. 변경점은 세 가지다. 첫째, 이미지 생성 속도가 이전 세대 대비 50% 빨라졌다 — 생성 대기시간이 사용자 이탈로 직결되는 제품이라면 그대로 체감 품질 개선이다. 둘째, GIF 애니메이션 출력이 추가돼 짧은 반복 모션을 별도 비디오 모델 없이 뽑을 수 있다. 셋째, 편집이 더 정밀해져 '이 부분만 바꿔달라'는 지시의 적중률이 올라갔다. API에도 함께 나왔다는 점이 실무상 중요하다 — 기존 이미지 생성 호출을 쓰는 코드는 모델 문자열만 갱신해 속도 개선을 받을 수 있고, GIF는 새 출력 형식이므로 다운스트림 저장·배포 경로가 애니메이션 포맷을 받는지 확인해야 한다. Codex에 함께 들어갔다는 것은 코딩 에이전트 세션 안에서 바로 이미지 자산을 만들고 편집하는 흐름이 가능해졌다는 뜻이다.", fresh:"Releasebot (OpenAI 릴리스 노트)", date:"2026-11-14", url:"https://releasebot.io/updates/openai"},
  {t:"제미나이 4 하이드로젠, 구글 검색 전역 적용 — 일상 코딩과 복잡 추론 사이를 노린 빠른 실행형 모델", vendor:"Gemini", type:"모델업데이트", ci:"🤖", s:74, d:"구글이 '검색 역대 최대 AI 모델 업그레이드'라며 전 세계 검색에 하이드로젠을 적용했다. 바로 써볼 수 있는 모델이고, 대규모 실전 추론 원가의 공개 검증 사례이기도 하다.", content:"제미나이 4 하이드로젠(Gemini 4 Hydrogen)은 빠른 응답과 복잡한 추론을 함께 노린 구글의 최신 모델로, 일상적인 코딩 작업과 추론 과제를 같은 모델로 처리하는 것을 목표로 공개됐다. 구글은 이 모델을 전 세계 검색 서비스에 적용하면서 '검색 역사상 최대 규모의 AI 모델 업그레이드'라고 표현했다. 학습 관점의 쓸모는 두 가지다. ①바로 체험 가능: 별도 가입 없이 구글 검색에서 하이드로젠 기반 응답을 받을 수 있으므로, 같은 질문을 Claude·ChatGPT와 나란히 넣어 추론 품질·속도·인용 방식 차이를 직접 비교하기 좋다. 특히 '빠른 모델이 추론을 어디까지 하는가'의 현재 상한을 감각적으로 잡을 수 있다. ②비용 구조 학습: 검색 트래픽 전체에 프런티어급 모델을 붙인다는 것은 토큰당 원가가 이미 광고 수익 모델을 견딜 수준까지 내려왔다는 뜻이다. API 가격표만 보는 것보다 실제 추론 원가 추세를 읽는 데 유용한 지표다. 모델 자체의 벤치마크·가격·컨텍스트 상세는 이 수집 시점에 국내 보도만으로는 확인되지 않아, 구글 공식 모델 카드를 따로 확인할 필요가 있다.", fresh:"AI타임스", date:"2026-11-14", url:"https://www.aitimes.com/news/articleView.html?idxno=217360"},
  {t:"patchy631/ai-engineering-hub — OCR·RAG·에이전틱 워크플로·MCP 연동·음성 에이전트까지 프로덕션용 튜토리얼 93개 이상, 4만 스타", vendor:"기타", type:"튜토리얼", ci:"🤖", s:73, d:"깃허브 최대 규모의 실전 AI 엔지니어링 튜토리얼 모음. 주제별로 동작하는 프로젝트를 제공한다.", content:"AI 엔지니어링 튜토리얼을 93개 이상 모아 둔 저장소로, 11월 트렌딩 집계에서 4만 466스타로 '프로덕션 레디 튜토리얼의 최대 단일 컬렉션'으로 소개됐다. 다루는 범위는 OCR, RAG, 에이전틱 워크플로, MCP 연동, 음성 에이전트이며 각 항목이 설명글이 아니라 돌려 볼 수 있는 프로젝트 형태다. 가치는 두 곳에 있다 — 첫째, 특정 구성요소(예: 하이브리드 검색, 리랭커, 평가 루프)를 처음 붙일 때 '남들은 어떻게 배선했는지'를 10분 안에 확인할 수 있다. 둘째, 같은 문제를 여러 스택으로 구현한 예제가 섞여 있어 프레임워크 선택 전 비교 재료가 된다. 한계는 큐레이션 규모가 큰 저장소의 공통 문제로, 예제별 최신성이 고르지 않아 의존성 버전이 어긋나는 경우가 있다는 것 — 각 프로젝트의 최근 커밋 날짜를 먼저 보고 고르는 것이 낫다. 자기 서비스에 넣을 코드를 그대로 베끼는 용도보다, 아키텍처 선택지를 빠르게 훑는 지도로 쓰는 편이 효율적이다.", fresh:"GitHub Trending", date:"2026-11-15", url:"https://github.com/patchy631/ai-engineering-hub"},
  {t:"OpenDocKit — HWP·PDF·엑셀을 구조 보존 마크다운으로 바꿔 RAG에 넣는 오픈소스 변환기", vendor:"기타", type:"기타", ci:"🤖", s:72, d:"국내 문서(특히 HWP) 자산을 LLM 파이프라인에 넣을 때 전처리 단계를 줄여주는 변환 도구", content:"RAG를 붙일 때 가장 지루하고 가장 품질을 많이 깎는 단계가 문서 전처리다. OpenDocKit은 HWP·PDF·엑셀을 표와 문단 구조를 보존한 마크다운으로 변환해 그 단계를 줄이는 오픈소스 도구로, 11월 20일 긱뉴스에 올라왔다. 왜 쓸만한가 — 첫째, 한글 문서를 텍스트로만 긁으면 표가 줄바꿈 뭉치로 무너져 청크 경계가 엉키는데, 구조 보존 변환은 표를 마크다운 표로 남겨 청킹 품질을 올린다. 둘째, 마크다운은 그대로 프롬프트에 넣을 수 있어 중간 포맷을 하나 줄인다. 셋째, 공공·금융 문서처럼 HWP 비중이 높은 도메인에서는 상용 파서 비용을 들이기 전 먼저 시도할 선택지가 된다. 지금 해볼 일은 자기 문서 중 가장 표가 복잡한 샘플 5~10건으로 변환 결과를 먼저 비교하는 것이다 — 중첩 표, 병합 셀, 머리글 반복이 있는 문서에서 파서 간 차이가 가장 크게 벌어진다. 주의점은 OCR이 필요한 스캔 PDF는 별도 단계를 붙여야 한다는 것, 그리고 변환 결과를 그대로 신뢰하지 말고 표 행 수·숫자 합계 같은 기계적 검증을 한 번 끼워야 한다는 것이다.", fresh:"GeekNews 2026-11-20", date:"2026-11-20", url:"https://news.hada.io/"},
  {t:"HotCodePush skills — 스킬 4종 + 호스팅 MCP 서버를 Claude Code·Devin 플러그인 하나로 묶은 패키징 사례", vendor:"Claude", type:"Plugin", ci:"🤖", s:72, d:"스킬 4개와 호스팅 MCP 서버를 한 플러그인으로 배포한 구조 참고용", content:"PR #8에서 HotCodePush의 스킬 저장소가 Claude Code와 Devin 양쪽에서 쓰이는 플러그인이 됐다. 눈여겨볼 점은 내용물보다 패키징 구조다 — 스킬 4개와 회사가 운영하는 호스팅 MCP 서버를 하나의 플러그인에 함께 넣어, 사용자가 플러그인 하나만 추가하면 스킬과 서버 연결이 같이 붙는다. 보통은 'MCP 서버는 설정 파일에 따로, 스킬은 디렉터리에 따로' 두 단계로 나뉘는데 이를 한 번으로 줄인 형태다. 자사 제품을 에이전트에 붙이려는 SaaS 입장에서는 이 구조가 온보딩 마찰을 가장 많이 줄이는 배포 방식이다. 또 Claude Code 전용이 아니라 Devin에서도 동작하도록 맞췄다는 점에서, 스킬·플러그인 규격이 특정 클라이언트를 넘어 이식 가능한지를 확인할 수 있는 사례이기도 하다. 직접 플러그인을 배포할 계획이라면 디렉터리 구성과 매니페스트를 그대로 참고할 만하다.", fresh:"GitHub hotcodepush-team/skills PR #8", date:"2026-11-19", url:"https://github.com/hotcodepush-team/skills/pull/8"},
  {t:"sub2api — 구독 쿼터를 API로 재분배하는 AI 게이트웨이(Claude·OpenAI·Gemini·Grok 라우팅)", vendor:"기타", type:"기타", ci:"🤖", s:72, d:"여러 공급자 요청을 한 엔드포인트로 받아 라우팅하고, 구독 플랜 쿼터를 사용자별로 나눠 쓰게 한다. 결제 연동도 포함.", content:"sub2api는 Claude·OpenAI·Gemini·Grok 요청을 하나의 API 엔드포인트로 받아 적절한 공급자로 라우팅하는 게이트웨이다. 특징은 '구독 쿼터 분배'로, 팀이나 커뮤니티가 가진 구독 플랜 용량을 여러 이용자에게 쿼터 단위로 나눠 주는 기능과 결제 연동을 함께 제공한다. 왜 봐둘 만한가 — 같은 날 CISA가 LiteLLM 취약점(CVE-2026-40217)을 LLM재킹 연계로 KEV에 올린 데서 보듯, 이런 게이트웨이 계층은 여러 공급자의 크레딧이 한곳에 모이는 지점이라 공격 가치가 높다. 즉 이 카테고리의 도구를 쓸 때 배워야 할 핵심은 기능이 아니라 운영이다 — 키를 어디에 저장하는지, 쿼터 초과·비정상 사용량을 어떻게 탐지하는지, 관리 콘솔이 인터넷에 노출되지 않는지. 직접 세워 본다면 내부망 또는 인증 프록시 뒤에 두고, 공급자 키는 환경변수가 아니라 비밀관리 서비스에 두는 구성부터 시험해보는 편이 안전하다.", fresh:"GitHub Trending", date:"2026-11-19", url:"https://github.com/Wei-Shaw/sub2api"},
  {t:"Astra Security MCP — 자율 침투테스트를 Claude Code·GitHub Copilot에 붙이는 서버", vendor:"Claude", type:"MCP", ci:"🤖", s:72, d:"보안 스캐닝·침투테스트 결과를 에이전트가 직접 조회하고 조치까지 이어가게 한다. 11월 19일 공개됐다.", content:"Astra Security가 2026년 11월 19일 자사 자율 침투테스트(autonomous pentesting) 기능을 MCP 서버로 공개해 Claude Code와 GitHub Copilot에서 쓸 수 있게 했다. 하는 일은 취약점 스캔 실행과 결과 조회를 에이전트 쪽 도구로 노출하는 것이다. 지금까지 보안 스캐너는 별도 대시보드에서 리포트를 받아 사람이 읽고 티켓을 만드는 흐름이었다. MCP로 붙으면 코드를 고치는 에이전트가 같은 세션에서 \"이 엔드포인트 스캔 결과 가져와\" → \"지적된 입력 검증 누락 수정\" → \"다시 스캔\"을 한 번에 돌릴 수 있다. 발견에서 수정까지의 왕복이 짧아지는 것이 실질 이득이다. 판단할 때 볼 것은 세 가지다. 첫째, 스캔 대상 범위 — 프로덕션 엔드포인트를 에이전트가 임의로 스캔하면 트래픽·알람 측면에서 사고가 되므로 스테이징으로 제한하고 대상 목록을 서버 설정에 고정해 둔다. 둘째, 결과의 신뢰도 — 자동 침투테스트는 오탐이 섞이므로 에이전트가 오탐을 근거로 코드를 고치지 않게 \"수정 전 재현 증거를 제시하라\"를 지시문에 넣는다. 셋째, 비용 구조 — 스캔 단위 과금이면 에이전트 루프에서 호출이 늘어난다. 보안 스캐너를 이미 쓰고 있다면 그 공급자에 MCP 서버가 있는지 먼저 확인하는 순서가 맞다.", fresh:"Astra Security / Manila Times", date:"2026-11-19", url:"https://manilatimes.net/2026/11/19/tmt-newswire/globenewswire/astra-security-connects-autonomous-pentesting-to-claude-code-and-github-copilot-through-new-mcp-server/2473464"},
  {t:"ChatGPT for Sales — 오픈AI가 영업 전용 플러그인 출시, 파트너 연동 30종 이상", vendor:"OpenAI", type:"Plugin", ci:"🤖", s:72, d:"CRM·영업 도구 30여 종과 연결해 ChatGPT 안에서 파이프라인 조회·메일 작성·미팅 준비를 처리하는 구성이다.", content:"오픈AI가 2026년 11월 18일 영업 업무 전용 플러그인 'ChatGPT for Sales'를 내놨다. 30종 이상의 파트너 연동을 함께 공개한 것이 핵심이다 — 플러그인 하나를 켜면 CRM, 메일, 미팅 기록, 통화 녹취 같은 영업 도구들이 ChatGPT 세션 안으로 들어온다. 실제로 쓸 때의 그림은 '파이프라인에서 이번 주 막힌 거래를 찾아 각 거래의 최근 접점을 요약하고 후속 메일 초안을 쓰는' 식의 한 번에 끝나는 작업이다. 배워 둘 점은 패키징 방식이다. 앤트로픽의 Claude for Manufacturing이 스킬 17개 + 커넥터 4개 묶음이었던 것과 같은 구조로, 벤더들이 '업무 영역 단위 플러그인 = 지시문 묶음 + 사내 시스템 커넥터'로 수렴하고 있다. 자기 업무에 같은 구조를 만들려면 반복 업무를 영역별로 쪼개 지시문으로 적고 필요한 시스템 커넥터만 붙이면 된다. 주의할 점도 분명하다 — 영업 데이터는 고객 개인정보와 거래 조건을 함께 담고 있어 어떤 커넥터에 어느 범위까지 읽기 권한을 주는지가 곧 유출 위험의 크기다. 같은 주에 Optimizely 공급망 공격(178개 조직)과 익스피디아 유출이 겹친 만큼, 커넥터 권한은 필요한 객체만 좁게 여는 쪽으로 시작하는 편이 안전하다.", fresh:"The Neuron AI Digest / OpenAI", date:"2026-11-18", url:"https://www.theneuron.ai/digest/everything-that-happened-in-ai-today-wednesday-november-18-2026/"},
  {t:"Google Antigravity 1주년 — 전체 사용자 무료 쿼터 리셋(11월 18일)", vendor:"Gemini", type:"모델업데이트", ci:"🤖", s:72, d:"구글 딥마인드 디렉터가 Antigravity 출시 1주년을 맞아 모든 사용자의 무료 사용량을 초기화했다고 알렸다.", content:"구글의 에이전트 개발 환경 Antigravity가 2026년 11월 18일 출시 1주년을 맞아 전체 사용자의 무료 쿼터를 리셋했다. 쿼터를 다 써서 밀어두었던 작업을 다시 돌려볼 수 있다는 실용적 의미가 있다. Antigravity는 최근 두 가지 기능을 더했다 — Orchestrator(한 세션에서 Gemini 4 Carbon과 Hydrogen을 작업 성격에 따라 번갈아 쓰는 모델 핸드오프)와 /teamwork(생성 에이전트와 독립 검증기를 짝지어 돌리는 오케스트레이션 패턴)다. 이 두 기능과 함께 쿼터가 초기화됐으니, 지금이 '검증기를 따로 두는 멀티 에이전트 구성'을 비용 부담 없이 시험해 볼 시점이다. 비교 대상으로는 Claude Code의 서브에이전트 구성과 Codex의 세션 모델 선택이 있는데, 같은 과제를 세 환경에서 돌려 보면 모델 핸드오프가 실제로 품질을 올리는지 자기 데이터로 판단할 수 있다. 무료 쿼터는 다시 소진되면 끝이므로 시험 과제를 미리 정해 두고 쓰는 편이 낫다.", fresh:"Google DeepMind(디렉터 공지)", date:"2026-11-18", url:"https://pasqualepillitteri.it/en/news/34583/google-gives-all-antigravity-users-a-free-quota-reset"},
  {t:"제미나이 앱, 지역 음성 66종 추가 — 안드로이드·iOS에 순차 배포", vendor:"Gemini", type:"모델업데이트", ci:"🤖", s:72, d:"영어권·비영어권 지역 억양 음성 66종이 제미나이 앱 음성 대화에 들어간다. 음성 UX를 쓰는 앱이라면 지역별 억양 선택지를 바로 시험해 볼 수 있다.", content:"구글이 2026년 11월 제미나이 앱에 지역 음성(regional voices) 66종을 안드로이드와 iOS에 순차 배포했다. 기존 음성이 소수의 표준 억양에 몰려 있던 것과 달리, 같은 언어 안에서도 지역별 억양·어조를 고를 수 있게 하는 변경이다. 실제로 뭘 할 수 있나 — 제미나이 앱의 음성 대화 설정에서 목록을 열어 대상 사용자층의 억양에 맞는 음성을 고르고, 같은 문장을 여러 음성으로 읽혀 어느 쪽이 더 자연스럽게 들리는지 비교할 수 있다. 음성 비서나 음성 기반 학습 도구를 만드는 쪽에는 '어느 억양까지 상용 품질이 나오는가'를 무료로 가늠하는 참조점이 된다. 주의할 점은 이 66종이 앱 레벨 기능이라는 것 — 같은 음성 세트가 Gemini API의 TTS 엔드포인트에 그대로 열리는지는 별도 확인이 필요하고, 배포가 순차적이라 계정·지역에 따라 아직 안 보일 수 있다. 같은 주에 나온 제미나이 4 하이드로젠(에이전트형 작업용 고속 모델)과는 별개 업데이트다.", fresh:"DEV Community AI 주간 정리·Google 릴리스 노트", date:"2026-11-17", url:"https://dev.to/cuelark/ai-updates-for-developers-nov-9-16-2026-fable-52-gemini-4-carbon-decision-models-and-what-14j1"},
  {t:"Microsoft Entra, 적시(JIT) 특권 접근을 AI 에이전트까지 확대 — PIM 프리뷰와 조건부 액세스 '정책 플랜'", vendor:"기타", type:"기타", ci:"🤖", s:72, d:"에이전트를 사람과 같은 신원으로 보고 권한을 시간 제한으로 주는 접근 통제", content:"에이전트에 상시 권한을 붙여두면 사고 한 번에 피해 범위가 그 권한 전체가 된다. Entra의 Privileged Identity Management(PIM) 프리뷰는 기존에 사람 관리자에게 쓰던 적시(just-in-time) 권한 상승을 더 많은 사용자·리소스와 AI 에이전트에까지 확장한다. 필요할 때 승인 흐름을 거쳐 일정 시간만 권한을 받고 자동으로 회수되는 모델이다. 함께 나온 조건부 액세스 '정책 플랜'(프리뷰)은 정책 의도를 한 번 설계해 공유 할당·리소스·조건 단위로 정의하면 해당 조건에 맞는 모든 신원에 일괄 적용되게 한다 — 에이전트가 늘어날 때마다 정책을 복제하는 운영 부담을 줄이는 구조다. 셀프서비스 자격증명 관리 API도 프리뷰로 추가돼, 저권한 위임 권한만으로 고객용 앱에 패스키 등록과 비밀번호 변경을 붙일 수 있다(이메일·전화 관리 API는 예정). 사내에 에이전트를 여러 개 돌리기 시작한 단계라면 지금 권한 모델을 JIT로 바꿔볼 근거가 된다.", fresh:"Microsoft Entra 블로그", date:"2026-11-18", url:"https://techcommunity.microsoft.com/blog/microsoft-entra-blog/ai-is-changing-access-see-how-entra-helps-you-stay-ahead-/4556456"},
];

function lunarSuffix(dateStr){
  try {
    const parts = (dateStr || "").split(" ")[0].split("-").map(Number);
    if (parts.length < 3 || typeof Solar === "undefined") return "";
    const lunar = Solar.fromYmd(parts[0], parts[1], parts[2]).getLunar();
    const lm = lunar.getMonth();
    const leap = lm < 0 ? "윤" : "";
    return ` (음력 ${lunar.getYear()}년 ${leap}${Math.abs(lm)}월 ${lunar.getDay()}일)`;
  } catch(e) { return ""; }
}

fetch("./data.json?_=" + Date.now())
  .then(r => r.json())
  .then(data => {
    ITEMS = data.items || [];
    PREDICTIONS = data.predictions || [];
    document.getElementById("dateval").textContent = (data.generated_at || "-") + lunarSuffix(data.generated_at);
    const avg = ITEMS.length ? (ITEMS.reduce((a,b)=>a+b.s,0)/ITEMS.length).toFixed(1) : "0";
    document.getElementById("statline").textContent = `${ITEMS.length}건 수집 · 평균 ${avg}점 · 예측 ${PREDICTIONS.length}건`;
    renderNav();
    renderBoard();
  })
  .catch(e => {
    document.getElementById("listview").innerHTML = '<div class="empty">데이터 로드 실패: ' + e + '</div>';
  });
</script>
