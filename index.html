  {t:"MCP 공식 서버 v2.3.0 — 선택형 파일시스템 필터, 호스트 허용목록·타임아웃 제어, Git 도구 2개 추가", vendor:"기타", type:"MCP", ci:"🤖", s:82, d:"MCP 공식 서버 저장소가 v2.3.0 태그로 운용 제어 옵션과 Git 도구를 추가했다.", content:"modelcontextprotocol 공식 서버 모음이 11월 4일 v2.3.0으로 올라갔다. 핵심은 세 가지 운용 제어다. 첫째, 선택(opt-in) 방식의 파일시스템 필터가 들어가 에이전트가 접근할 수 있는 경로를 좁힐 수 있다. 둘째, fetch 계열에 호스트 허용목록(allowlist)과 타임아웃 제어가 붙어 외부 네트워크 호출 범위를 한정할 수 있다. 셋째, Git 도구 두 개가 추가됐다. 패키지 버전으로는 npm @modelcontextprotocol/server-filesystem 2.2.0, PyPI mcp-server-fetch·mcp-server-git가 2026.11.4다. Claude Code·Codex 등 MCP 클라이언트에서 설정 파일만 고쳐 바로 적용할 수 있어, 샌드박스 없이 로컬 파일·네트워크를 노출하던 구성을 좁히는 데 쓸 만하다.", fresh:"GitHub modelcontextprotocol/servers", date:"2026-11-04", url:"https://github.com/modelcontextprotocol/servers"},
  {t:"Pandex — MCP로 AI 에이전트에 공식 유럽 법률 원문 280만 건 제공(과거 버전·시행일·인용정보 포함), 베타 기간 하루 1,000요청 무료", vendor:"기타", type:"MCP", ci:"🤖", s:82, d:"EU와 유럽 7개국·유럽인권재판소의 법령·판례를 공식 출처에서 모아 단일 API와 MCP 서버로 주는 서비스다. 모델이 옛 조항을 인용하거나 조문을 지어내는 문제를 원문 제공으로 막는 쪽이다.", content:"Pandex는 2026년 11월 21일 Hacker News에 공개된 유럽 법률 데이터 서비스다. 다루는 범위가 구체적이다 — EU, 독일, 프랑스, 네덜란드, 영국, 오스트리아, 스위스, 룩셈부르크, 그리고 유럽인권재판소(ECHR) 판례를 공식 출처에서 수집하고, 11월 17일 기준 약 280만 건의 문서를 보유한다. 중요한 설계는 '모든 과거 버전'을 함께 보관한다는 점이다. 각 법령의 이전 버전, 시행일(effective date), 인용 정보가 들어있어서 '그 시점에 유효했던 조문'을 특정할 수 있다. 이것이 쓸모 있는 이유는 LLM의 전형적 실패 유형과 정확히 맞물리기 때문이다 — 모델은 유럽 법을 다룰 때 폐지된 구 조항을 그대로 인용하거나 존재하지 않는 조문을 생성하는 경향이 있는데, Pandex는 그 자리에 공식 원문을 넣는다. 붙이는 방법은 한 줄이다: `claude mcp add --transport http pandex https://api.pandex.io/mcp`. 베타 기간에는 하루 1,000요청까지 무료다. 겨냥하는 사용자는 리걸 AI, 컴플라이언스 모니터링, 법률 검색 제품 개발자이고, 과거 버전과 시행일이 있으므로 '법이 언제 어떻게 바뀌었는지 추적'하는 변경 감시 용도로도 쓸 수 있다. 한국에서 바로 쓸 상황은 GDPR·EU AI법·DMA 같은 EU 규제를 다루는 작업이다 — 규제 조문을 모델 기억에 맡기지 않고 MCP로 원문을 끌어오는 구성으로 바꾸면, 조문 인용 오류를 구조적으로 줄일 수 있다. 한계는 범위가 유럽에 한정되고 아직 베타라는 점이다.", fresh:"GeekNews / Hacker News", date:"2026-11-22", url:"https://news.hada.io/topic?id=37640"},
  {t:"Claude for Manufacturing — 제조 현업용 스킬 17종 + 커넥터 4종", vendor:"Claude", type:"Skill", ci:"🤖", s:82, d:"견적 작성·품질 이슈 조사·설비 고장 진단·공급사 관리를 스킬 17종과 커넥터 4종으로 묶은 앤트로픽의 제조 특화 패키지", content:"앤트로픽이 11월 22일 Claude for Manufacturing을 공개했다. 핵심은 모델이 아니라 '스킬 묶음'이라는 점이다 — 영업·품질관리·운영·공급망·엔지니어링 설계·설비 셋업 영역을 커버하는 AI 스킬 17종과 소프트웨어 커넥터 4종으로 구성된다. 공개된 예시 스킬 하나를 보면 적용 방식이 분명하다. 견적 담당자가 \"고객 요청서를 읽고, 빠진 항목을 목록으로 뽑고, 유사 작업의 원가와 비교해서 견적 초안을 써라\"고 지시하면 Claude가 그 네 단계를 수행한다. 즉 사람이 기존에 PLM·ERP·품질 시스템을 번갈아 열며 하던 조회·비교·초안 작성을 하나의 스킬 호출로 접는 구조다. 설계상 중요한 제약이 하나 명시돼 있다 — 제조 설비를 직접 제어하지 않는다. 기능은 기존 제조·업무 소프트웨어에서 정보를 가져오는 것(retrieval)과 문서·판단 초안을 만드는 것에 한정된다. 그래서 OT 보안 심사 없이 IT 계층에서만 도입 검토가 가능하다는 점이 실무상 장점이다. 배우는 쪽에서 볼 지점은 스킬 패키징 방식이다. 앤트로픽은 조직이 기존 스킬을 자기 공정에 맞게 수정해 쓸 수 있게 하고 스킬 목록을 계속 늘릴 계획이라고 밝혔다 — 범용 모델에 프롬프트를 직접 쓰는 대신, 도메인 절차를 스킬 파일로 고정하고 커넥터로 데이터 경로를 묶는 패턴을 그대로 참고할 수 있다. 제조업이 아니어도 '절차가 반복되고 데이터 소스가 3~4개로 고정된 업무'라면 같은 구조를 복제할 수 있다.", fresh:"Anthropic / Robotics & Automation News", date:"2026-11-22", url:"https://roboticsandautomationnews.com/2026/11/22/anthropic-launches-claude-for-manufacturing-to-automate-administrative-and-engineering-workflows/107487/"},
  {t:"Firecrawl Local — 웹사이트를 마크다운으로 바꾸는 단일 바이너리, MCP 서버 겸 로컬 Firecrawl API", vendor:"기타", type:"MCP", ci:"🤖", s:82, d:"바이너리 하나로 MCP 서버와 Firecrawl API를 로컬호스트에 띄워 웹페이지를 마크다운으로 변환하는 도구다(AGPL-3.0).", content:"Firecrawl Local은 웹사이트를 마크다운으로 변환하는 기능을 단일 바이너리로 묶은 도구다. 실행하면 두 가지를 동시에 제공한다 — MCP 서버로 붙을 수 있고, Firecrawl API를 로컬호스트에서 서빙한다. 라이선스는 AGPL-3.0이다. 쓸모가 분명한 지점은 '에이전트에게 웹 문서를 읽히는' 작업이다. 지금까지 이 작업은 대개 외부 SaaS 크롤링 API를 호출해 처리했고, 그러면 ① 읽히려는 URL과 조회 패턴이 외부로 나가고 ② 사용량 과금이 붙고 ③ 사내망·VPN 안쪽 문서는 애초에 접근이 안 된다. 로컬 바이너리로 돌리면 세 문제가 같이 사라진다. 특히 사내 위키나 인트라넷 문서를 에이전트 컨텍스트에 넣어야 하는 구성에서는 사실상 이 방식이 유일한 선택지에 가깝다. 적용은 단순하다 — 바이너리를 띄우고 MCP 설정에 로컬 엔드포인트를 등록하면 Claude Code 같은 클라이언트에서 바로 도구로 보인다. 기존에 Firecrawl 클라우드 API를 호출하던 코드가 있으면 베이스 URL만 로컬호스트로 바꿔 끼울 수 있게 설계돼 있어, 이전 비용이 거의 들지 않는다. AGPL-3.0이라는 점은 이 바이너리를 제품에 내장해 배포할 계획이라면 반드시 먼저 확인해야 하는 조건이다.", fresh:"munderdiffl 에이전트 툴 일간 / Firecrawl", date:"2026-11-20", url:"https://github.com/firecrawl/firecrawl"},
  {t:"agent-skills 20261120 릴리스 — agent-workdir·run-validation·create-verification-skill·git-guardrails 등 검증 중심 스킬 묶음", vendor:"Claude", type:"Skill", ci:"🤖", s:82, d:"에이전트 산출물을 체크아웃 밖으로 빼는 agent-workdir와 '가장 가벼운 환경으로 주장을 증명하는' run-validation을 포함한 스킬 릴리스", content:"2026년 11월 20일 공개된 agent-skills 릴리스(태그 20261120)다. 설치는 `npx skills add mmgordon82/agent-skills#20261120 -g --skill '*'`(Node.js 22.20 이상)이거나 agent-skills-20261120.tar.gz를 스킬 디렉터리에 풀면 된다. 바로 쓸만한 것부터 보면 agent-workdir가 있다 — 에이전트가 만드는 리포트·계획·로그 같은 산출물을 체크아웃 안에 흘리지 않고 기본값으로 ~/agent-work/<project>/<date>-<topic>/ 아래에 모은다. 저장소가 에이전트 부산물로 더러워지는 문제를 설정 하나로 없애는 종류의 스킬이다. run-validation은 '테스트·빌드·브라우저·배포 주장을 증명할 수 있는 가장 가벼운 환경을 선택'한다 — 전체 CI를 돌리는 대신 그 주장에 필요한 최소 실행을 고르는 판단을 스킬로 박아 넣은 것이다. create-verification-skill과 create-formal-verification-skill은 메타 스킬이다: 프로젝트마다 실제 사용자 동작을 구동하는 검증 스킬이나 고위험 불변식을 형식 검증하는 스킬을 생성해준다. 저장소별로 검증 방법이 다른 현실에 맞는 접근이다. git-guardrails-claude-code는 Claude Code 훅을 설치해 위험한 git 명령(push, reset --hard, clean, branch -D 등)을 실행 전에 차단한다. skill-critique는 설치된 스킬 목록을 조사해 세션당 로드량을 추정하고 충돌·중복을 찾아낸다 — 스킬을 많이 깔아둔 상태에서 컨텍스트 예산이 새는 지점을 찾는 데 쓴다. 적용 순서를 추천하면 ① git-guardrails로 사고 방지 ② agent-workdir로 저장소 청결 ③ skill-critique로 기존 스킬 정리 ④ run-validation·create-verification-skill로 검증 루프 구축이다.", fresh:"GitHub mmgordon82/agent-skills", date:"2026-11-20", url:"https://github.com/mmgordon82/agent-skills/releases/tag/20261120"},
  {t:"Perplexity Orchestrator API — 45개+ 프런티어·오픈웨이트 모델을 한 엔드포인트로, 실패 시 '같은 모델의 다른 배포'로 재시도", vendor:"기타", type:"기타", ci:"🤖", s:82, d:"OpenAI·Anthropic SDK를 그대로 쓰면서 API 키만 바꿔 45개 이상 모델에 붙이고, 장애 시 모델을 바꾸지 않은 채 다른 제공자로 재시도하는 게이트웨이다.", content:"Perplexity가 11월 17일 Orchestrator API를 사모 프리뷰로 공개했다. 프런티어 모델과 오픈웨이트 모델을 하나의 API로 묶고 과금도 통합한다. 프리뷰 카탈로그에는 OpenAI·Anthropic·Google·xAI의 모델과 Perplexity가 자체 호스팅하는 모델을 합쳐 45개 이상이 들어 있다. 실제로 쓸 때 중요한 점은 기존 코드를 거의 안 고친다는 것이다 — Orchestrator는 OpenAI Chat Completions, OpenAI Responses, Anthropic Messages 세 가지 요청 형식을 모두 받으므로, 쓰던 OpenAI나 Anthropic SDK를 그대로 두고 base URL과 API 키만 Perplexity 쪽으로 바꾸면 된다. 다른 라우터와 갈리는 지점은 폴백 방식이다. 보통의 라우터는 요청이 실패하면 다른 모델로 넘기는데, 그러면 출력 품질과 토크나이저가 같이 바뀌어 프롬프트가 깨진다. Orchestrator는 '같은 모델의 다른 배포(deployment)'로 재시도한다 — Claude 요청이 실패하면 모델을 바꾸지 않고 제공자만 옮긴다. 각 제공자의 헬스·용량·레이턴시를 추적해 성능 좋은 쪽으로 트래픽을 분배한다. Perplexity는 30일 구간에서 Orchestrator를 거친 Claude·GPT 요청이 자기가 추적한 어떤 단일 제공자보다 성공률이 높았다고 밝혔다. 쓸만한 지점: 에이전트를 운영하는데 특정 벤더 장애가 그대로 서비스 장애가 되는 구조라면, 모델을 고정한 채 가용성만 올릴 수 있는 수단이다. 한계도 분명하다 — 사모 프리뷰여서 api@perplexity.ai로 메일을 보내 접근 권한을 받아야 하고, 요청 경로에 중개 계층이 하나 더 끼므로 레이턴시와 데이터 처리 경로를 따로 확인해야 한다.", fresh:"Perplexity 공식 블로그", date:"2026-11-17", url:"https://www.perplexity.ai/hub/blog/introducing-orchestrator"},
  {t:"VAMP MCP — 내 하드웨어의 VM 안에서 컴퓨터 사용 에이전트를 돌리고, 녹화한 작업을 토큰 0으로 재실행", vendor:"기타", type:"MCP", ci:"🤖", s:82, d:"VirtualBox·KVM 게스트에서 GUI 작업을 녹화해 Python RPA로 저장하고, 이후에는 멀티모달 토큰 비용 없이 결정론적으로 재생한다. 로컬 OCR·YOLO로 상태를 검증한다.", content:"VAMP는 컴퓨터 사용(computer-use) 에이전트를 클라우드가 아니라 내 하드웨어의 가상머신 안에서 돌리기 위한 MCP 서버다. 구성은 세 덩어리다. ①VM 수명주기 자동화 — VM 생성·목록 조회, VMConnect 실행, 지원되는 윈도우 게스트와 파일 교환을 MCP 도구로 호출한다. 호스트 데스크톱을 계속 쓰면서 게스트 안에서만 GUI 자동화가 돌아간다는 점이 실무상 가장 큰 차이다. ②녹화 기반 RPA — 게스트에서 작업을 녹화하면 PyAutoGUI 기반 파이썬 스크립트로 저장되고, 저장 전에 캡처된 동작을 검토해 비밀번호 같은 민감 입력을 제거할 수 있다. VS Code 확장이 VirtualBox MCP 도구와 RPA 라이브러리를 제공한다. ③결정론적 재생 — 두 번째 실행부터는 저장된 RPA를 MCP로 호출하므로 멀티모달 토큰 비용이 0이고, 상태 검증은 로컬 OCR과 YOLO 어서션으로 처리한다. 이 지점이 핵심 가치다. 매번 스크린샷을 모델에 넣어 판단하게 하는 컴퓨터 사용 에이전트는 반복 작업에서 비용이 선형으로 늘지만, '한 번 녹화 후 결정론적 재생'은 반복 비용이 거의 0으로 떨어진다. 제약은 분명하다 — 녹화 재생은 VirtualBox와 KVM, 지원되는 PyAutoGUI 녹화 동작에 한정되고 게스트 해상도가 정확히 일치해야 한다. 해상도가 달라지면 좌표 기반 재생이 깨진다. 지금 해볼 것 — 매주 손으로 반복하는 윈도우 전용 업무(레거시 ERP 입력, 내부 툴 리포트 내려받기)를 하나 골라 녹화해 두고, 민감 입력만 제거한 뒤 재생 성공률을 2주 측정해 보면 도입 가치가 금방 판가름난다.", fresh:"GitHub wayfarer6/vamp-mcp / GeekNews Show GN", date:"2026-11-21", url:"https://github.com/wayfarer6/vamp-mcp"},
  {t:"codemap-search — 코딩 에이전트용 단일 바이너리 Rust 코드 탐색 MCP 서버", vendor:"Claude", type:"MCP", ci:"🤖", s:82, d:"저장소 코드 탐색을 에이전트에게 도구로 제공하는 MCP 서버. 단일 바이너리라 설치가 가볍다.", content:"buYoung이 공개한 오픈소스 MCP 서버다. 목적은 코딩 에이전트가 로컬 저장소를 빠르게 탐색하는 것으로, grep을 여러 번 돌리거나 파일을 통째로 읽어 컨텍스트를 태우는 패턴을 줄이는 쪽이다. Rust 단일 바이너리로 배포돼 런타임 의존성이 없고, MCP 서버로 붙이면 Claude Code나 다른 MCP 클라이언트에서 바로 도구로 노출된다. 큰 저장소에서 에이전트의 탐색 비용이 문제라면 가장 먼저 시도할 축이다. 효과를 재는 방법은 간단하다 — 같은 질문을 붙이기 전후로 입력 토큰 수를 비교하면 된다. 주의할 점은 인덱싱 범위와 .gitignore 처리 방식이고, 모노레포에서는 서브디렉터리 단위로 제한하는 설정이 필요할 수 있다.", fresh:"GeekNews", date:"2026-11-21", url:"https://news.hada.io/topic?id=37568"},
  {t:"Codex CLI 0.171.0 — 모델 카탈로그에 GPT-6.2 Sol·Astra 추가(기본값 Sol), codex exec --remote로 원격 앱서버 세션 시작·재개", vendor:"Codex", type:"모델업데이트", ci:"🤖", s:82, d:"Codex CLI가 GPT-6.2 두 모델을 카탈로그에 넣고 기본값을 저가 모델 Sol로 잡았다. 원격 앱서버에 비대화형 세션을 붙이는 옵션도 추가됐다.", content:"11월 20일 Codex CLI 0.171.0이 나왔다. 실무 영향이 큰 변경은 두 가지다. 첫째, 모델 카탈로그에 GPT-6.2 Sol과 Astra가 추가되고 기본 선택이 Sol이다 — 입력·출력 단가가 Astra의 4분의 1이므로, 아무 설정 없이 쓰던 사람은 이 릴리스부터 비용 구조가 바뀐다. 품질이 필요한 작업만 명시적으로 Astra로 올리는 방식이 기본 전제가 된 셈이다. 둘째, codex exec --remote ADDR 옵션으로 이미 떠 있는 앱서버에서 비대화형 세션을 시작하거나 재개할 수 있다. CI 러너나 상시 서버에 세션을 유지해 두고 거기에 작업만 던지는 구성이 가능해진다. 내부적으로 exec가 공유 앱서버 클라이언트를 쓰도록 리팩터링됐고, 실시간 호출의 외부 헤더 인증, 독립 설치기의 Node 런처 탐지, 터미널의 alternate-scroll 모드 복원 같은 수정이 함께 들어갔다. 바로 해볼 일 — 기존 파이프라인에서 모델을 지정하지 않은 호출이 있으면 Sol로 내려간 결과 품질을 한 번 비교하고, 장시간 실행 작업은 --remote로 옮겨 세션 재개가 되는지 확인하면 된다.", fresh:"OpenAI Codex 체인지로그", date:"2026-11-20", url:"https://developers.openai.com/codex/changelog"},
  {t:"Claude Meetings 베타 — Claude가 구글 미트에 참가자로 들어가 통화 중에 문서·화이트보드·액션아이템을 실시간으로 만든다(Team·Enterprise)", vendor:"Claude", type:"기타", ci:"🤖", s:82, d:"자체 아바타로 회의에 보이는 참가자로 입장해 질문에 답하고, 대화가 진행되는 동안 문서와 화이트보드를 만든다. 베타 기간 노트·트랜스크립트 추가 과금 없음, 생성물은 2027년 2월 10일까지 무료.", content:"앤트로픽이 Claude Meetings 베타를 열었다. 요지는 '회의 후 요약'이 아니라 '회의 중 작업'이다. Claude가 자체 아바타를 달고 보이는 참가자로 통화에 들어가 대화를 따라가고, 질문에 답하고, 회의가 진행되는 동안 문서·화이트보드·노트·액션아이템을 실시간으로 만든다. 기본 동작은 음성이 아니라 텍스트 응답이어서, 사람들이 계속 말하는 중에 Claude가 옆에서 산출물을 쌓는 형태가 된다. 현재 지원 플랫폼은 구글 미트 하나이고 다른 화상회의 플랫폼은 추후 지원 예정이다. 접근 조건이 분명하다 — Team 플랜(사용자당 월 25달러)과 Enterprise 플랜(최소 월 400달러) 구독자만 베타에 들어갈 수 있고, 제로 데이터 보존·HIPAA 구성·고객 관리 암호화 키를 쓰는 조직은 베타에서 제외된다. 과금은 베타 기간 혜택이 붙어 있다 — 노트와 트랜스크립트는 Team·Enterprise에서 추가 비용 없이 포함되고, 통화 중 Claude가 만든 문서·화이트보드 등 산출물은 2027년 2월 10일까지 무료다. 권한 모델도 확인해둘 값이 있다 — 참가자 각자가 자기 연결 도구(커넥터) 사용 권한을 Claude에 부여해야 하며, 최초 1회 승인 후에는 지속 적용된다. 지금 해볼 수 있는 것 — Team 플랜을 쓰고 있다면 반복되는 주간 회의 한 건에만 붙여, 회의가 끝난 시점에 사람이 손으로 정리하던 분량이 실제로 줄어드는지 2주만 비교해 보면 된다. 2027년 2월 10일 이후 산출물 과금 정책이 바뀔 수 있다는 점은 도입 판단에 반드시 넣어야 한다.", fresh:"claude.com 공식 안내 · ITBrief · India TV", date:"2026-11-16", url:"https://claude.com/resources/articles/claude-meetings"},
  {t:"Claude Code v2.1.329 — 헤드리스 세션의 플러그인 MCP 서버 동작 수정, 태스크 처리 개선", vendor:"Claude", type:"모델업데이트", ci:"🤖", s:82, d:"헤드리스 환경에서 플러그인 MCP 서버가 제대로 붙지 않던 문제를 고친 릴리스", content:"11월 19일 올라온 Claude Code 2.1.329는 눈에 띄는 신기능보다 운영 안정성 쪽 수정이 핵심이다. 가장 영향이 큰 항목은 헤드리스 세션(터미널 UI 없이 스크립트·CI에서 돌리는 모드)에서 플러그인에 포함된 MCP 서버의 동작이 어긋나던 문제를 고친 것이다. 플러그인으로 MCP 서버를 묶어 배포하는 방식이 늘어난 상황에서, 로컬 대화형 세션에서는 되는데 CI에서만 서버가 안 붙는 유형의 디버깅은 원인 추적이 특히 어렵다 — 이 릴리스로 올라가는 것만으로 해결되는 케이스가 있다. 그 밖에 태스크 처리, 세션 간 신뢰성, 로그인, MCP, 플러그인, 터미널 사용성 전반의 개선이 함께 들어갔다. 에이전트를 자동화 파이프라인에 넣어 돌리는 구성이면 먼저 올려볼 가치가 있다.", fresh:"claude-code-plugins Issue #17555", date:"2026-11-19", url:"https://github.com/melodic-software/claude-code-plugins/issues/17555"},
  {t:"Stitch Loop — 코드베이스와 라이브 지표에 붙어 개선안을 깃허브 PR로 올리는 구글 랩스 제품 에이전트(대기명단)", vendor:"Gemini", type:"기타", ci:"🤖", s:82, d:"보안·지연·접근성 3개 기본 루프가 제안→설계안→샌드박스 코드작성·PR→지표 추적을 반복한다. 180개 이상 통합, 대기명단 전 세계 개방.", content:"구글 랩스가 공개한 Stitch Loop는 '이미 출시한 제품을 계속 개선하는 장기 실행 에이전트'다. 한 번 질문에 답하는 코딩 도구가 아니라, 코드베이스와 운영 지표에 상시 연결돼 목표가 달성될 때까지 돌아가는 쪽을 노린다. 기본으로 제공되는 루프는 사이버보안, 지연(latency), 접근성 세 가지다. 각 루프는 네 단계를 반복한다 — (1) 개선 후보를 제안하고, (2) 트레이드오프와 설계 선택지를 붙인 해결안을 제시하고, (3) 격리된 클라우드 샌드박스에서 코드를 작성해 깃허브 풀리퀘스트를 열고, (4) 반영 후 해당 라이브 지표를 추적하는 reflect 단계를 거친다. 사람이 PR을 리뷰하기 전까지 아무것도 병합되지 않으므로, 자율 에이전트를 운영 코드에 붙일 때 가장 걸리는 '무단 배포' 리스크는 구조적으로 차단된다. 연결 가능한 통합은 180개 이상이고, 접근은 대기명단 방식이다 — 전 세계 모든 사용자에게 열려 있고 Google AI Ultra 구독자가 우선권을 받는다(stitch.google.com/loop/waitlist). 운영 중인 서비스의 지연·접근성 백로그가 쌓여 있는 팀이라면, 사람이 리뷰하는 PR 흐름을 유지한 채 개선 후보 발굴만 자동화하는 실험 대상으로 바로 써볼 수 있다.", fresh:"Google Labs", date:"2026-11-19", url:"https://blog.google/innovation-and-ai/models-and-research/google-labs/stitch-loop/"},
  {t:"Claude Code 2.1.327 — claude mcp add-json이 stdin으로 MCP 서버 JSON을 받고, /install-github-app은 저장소 변경 전 확인", vendor:"Claude", type:"MCP", ci:"🤖", s:82, d:"MCP 서버 설정을 파이프로 넣을 수 있게 돼 스크립트화가 쉬워졌다.", content:"11월 17일자 Claude Code 2.1.327은 세 가지가 핵심이다. 첫째, claude mcp add-json이 표준입력(stdin)으로 서버 JSON을 받는다. 지금까지 긴 JSON을 셸 인자로 넣다가 따옴표 이스케이프가 깨지던 문제를 피할 수 있고, 템플릿 파일을 cat으로 흘려넣거나 jq로 생성한 설정을 그대로 파이프하는 설치 스크립트를 쓸 수 있다. 둘째, /install-github-app이 저장소를 변경하기 전에 확인을 받는다. 남의 저장소에 앱을 잘못 붙이는 사고를 막는 안전장치다. 셋째, 재개한 세션에서 과거 메시지를 불러올 수 없을 때 그 사실을 한 줄로 알려준다. 예전에는 조용히 잘린 컨텍스트로 작업이 이어져 엉뚱한 답이 나오곤 했다. 직전 버전 2.1.326은 에이전트 팀(agent teams)에서 Code Mode를 켤 수 있게 하고, 세션 중간에 managed-mcp.json이 추가되면 MCP 서버 로딩이 멈추는 이유를 설명하는 메시지를 넣었다. MCP 설정을 여러 저장소에 배포하는 팀이라면 add-json의 stdin 지원만으로도 올릴 값이 있다.", fresh:"Claude Code CHANGELOG", date:"2026-11-18", url:"https://github.com/anthropics/claude-code/blob/main/CHANGELOG.md"},
  {t:"코딩 에이전트 삭제 사고 10건 분석 — 2026년 9~11월 실제 데이터 유실 사례와 공통 원인", vendor:"기타", type:"튜토리얼", ci:"🤖", s:82, d:"에이전트가 파일·브랜치·DB를 지운 사고 10건을 모아 어디서 안전장치가 무너졌는지 정리한 글이다.", content:"2026년 9월부터 11월까지 공개된 코딩 에이전트 관련 삭제 사고 10건을 모아 분석한 글이다. 사고 유형은 작업 디렉터리 밖 파일 삭제, git reset·clean으로 커밋되지 않은 작업 소실, 마이그레이션을 실행해 테이블을 떨어뜨린 경우, 정리(cleanup) 스크립트를 자동 생성해 돌린 경우 등으로 갈린다. 공통 원인으로 지적되는 것은 세 가지다. 첫째, 에이전트에게 준 권한이 작업 범위보다 넓었다(쓰기 권한이 리포지토리 전체 또는 홈 디렉터리까지). 둘째, 되돌릴 수 없는 명령에 사람 확인 단계가 없었다. 셋째, 에이전트가 실패를 복구하려고 더 파괴적인 명령을 선택하는 패턴이 반복됐다. 실무에 바로 적용할 교훈은 명확하다 — Claude Code·Codex·Gemini CLI 중 무엇을 쓰든 ① 삭제·reset·drop 계열 명령을 훅이나 권한 설정으로 사전 차단하고, ② 에이전트를 git 워크트리나 컨테이너처럼 격리된 복사본에서 돌리고, ③ 작업 시작 전 커밋을 강제해 되돌릴 지점을 만들어 두는 것이다. 이 저장소의 git-guardrails 류 훅 설정이 정확히 첫 번째 항목에 해당한다. 사고 사례를 하나씩 읽어 두면 '내 설정에서 같은 일이 가능한가'를 점검하는 체크리스트로 쓸 수 있다.", fresh:"GeekNews(news.hada.io)", date:"2026-11-18", url:"https://news.hada.io/topic?id=37349"},
  {t:"OpenCode Browse — 쓰던 크롬을 MCP로 코딩 에이전트에 붙여서 로그인·확장 그대로 둔 채 조작하게 하는 익스텐션", vendor:"기타", type:"Plugin", ci:"🤖", s:82, d:"Claude Code·Codex·Cursor·Zed·OpenCode 지원, 로그인·2FA·결제는 사람이 처리하고 Continue로 에이전트에 돌려줌", content:"크로미움 익스텐션을 MCP(Model Context Protocol)로 코딩 에이전트에 연결해, 에이전트가 새 헤드리스 브라우저를 띄우는 대신 사용자가 평소 쓰는 브라우저를 그대로 조작하게 하는 도구다. 핵심 이점은 기존 로그인 세션과 설치된 확장이 유지된다는 점이다 — 테스트용 계정을 따로 만들거나 쿠키를 주입할 필요가 없다. 에이전트는 페이지를 읽고, 클릭하고, 입력하고, 스크린샷을 찍고, 탭을 녹화할 수 있다. 민감한 단계는 사람이 가져간다. 로그인·2FA·결제가 필요한 순간에 사용자가 조작권을 받아 처리하고 `Continue`를 누르면 에이전트가 이어서 작업한다. 에이전트가 쓰는 탭은 백그라운드에 그룹으로 묶이고 툴바 버튼으로 탭을 넘길 수 있어, 사람 작업과 에이전트 작업이 같은 창에서 섞이지 않는다. 지원 브라우저는 Chrome·Edge·Brave·Arc·Helium·Vivaldi·Opera·Chromium이고, MCP 클라이언트는 OpenCode·Claude Code·Cursor·Codex·Zed다. 설치는 크롬 웹스토어에서 익스텐션을 넣으면 나머지 설정을 안내한다(CLI 설치도 되지만 보통 필요 없다). 저장소는 github.com/anomalyco/browse다. 로그인 장벽 때문에 에이전트 브라우저 자동화를 포기했던 작업에 바로 적용할 수 있다.", fresh:"opencode.ai·GeekNews", date:"2026-11-18", url:"https://github.com/anomalyco/browse"},
  {t:"AKS Agent Sandbox + Agent Grid — 에이전트가 쓴 코드를 VM 경계로 격리 실행하고, 에이전트·모델·도구 간 호출을 중앙 정책으로 통제하는 쿠버네티스 확장", vendor:"기타", type:"Plugin", ci:"🤖", s:82, d:"이그나이트 2026에서 공개된 에이전트 격리·통제 프리뷰 2종", content:"에이전트에게 코드 실행을 맡길 때 가장 큰 문제는 \"그 코드가 무엇을 건드릴지 미리 모른다\"는 점이다. Agent Sandbox 확장은 AKS 클러스터 안에서 에이전트가 생성한 코드를 가상머신 수준으로 격리된 샌드박스에서 돌린다. 컨테이너 경계보다 강한 경계라 커널 공유로 인한 탈출 경로를 줄인다. Agent Grid는 그 위에서 에이전트·모델·도구·Azure 서비스 사이의 호출을 중앙 정책으로 집행한다 — 어떤 에이전트가 어떤 도구와 어떤 데이터에 접근할 수 있는지를 코드가 아니라 플랫폼 정책으로 정한다. 같이 공개된 Flex nodes는 다른 Azure 리전·엣지 거점·온프레미스 서버 용량을 노드풀로 등록해 기존 AKS 클러스터에 붙이는 기능으로, 당일부터 퍼블릭 프리뷰이며 Microsoft Learn에 설정 가이드가 있다. 자체 에이전트를 사내에서 돌리려는 쪽에서는 '샌드박스를 직접 구현'하는 작업을 플랫폼으로 넘길 수 있는 선택지가 생긴 셈이다. 단 Cobalt 200을 제외하면 전부 프리뷰라 SLA 없이 검증용으로만 써야 한다.", fresh:"Microsoft Ignite 2026 Book of News", date:"2026-11-18", url:"https://news.microsoft.com/events/ignite/2026/book-of-news/"},
  {t:"GitHub Copilot Fusion — 코딩 작업을 개발자 PC의 로컬 모델로 라우팅(프리뷰), Copilot+ PC에는 로컬 컨텍스트·액션도 예정", vendor:"기타", type:"모델업데이트", ci:"🤖", s:82, d:"클라우드 호출 없이 로컬 모델로 처리할 작업을 가르는 기능이다. 사내 코드를 외부로 보내지 못하는 조직에 바로 의미가 있다.", content:"마이크로소프트가 2026년 11월 17일 이그나이트에서 공개한 프리뷰 기능이다. 핵심은 '같은 Copilot 인터페이스 안에서 작업 단위로 실행 위치를 가른다'는 것이다 — 간단한 완성·리팩터링은 개발자 PC의 로컬 모델이 처리하고, 복잡한 추론만 클라우드로 올린다. 왜 쓸만한가 — 지금까지 코드 어시스턴트 도입을 막던 가장 흔한 사유가 '소스가 외부로 나간다'는 보안 검토였다. 로컬 라우팅이 되면 그 검토를 작업 종류별로 나눠 통과시킬 수 있고, 네트워크가 끊긴 환경(공장, 격리망)에서도 일부 기능이 동작한다. 추가로 Copilot+ PC에는 로컬 컨텍스트·액션·모델이 곧 들어온다고 예고됐고, 윈도우 쪽에서는 코파일럿이 파일을 찾고 이동·이름변경하며 PC 문제를 평문 요청으로 진단하는 기능이 Copilot+ PC에서 시작된다. 지금 해볼 수 있는 것 — 프리뷰를 켜고 '어떤 작업이 로컬로 라우팅됐는지' 로그를 하루 모아 보면, 사내 보안 정책에서 허용 가능한 작업 비율이 숫자로 나온다. 주의할 점 두 가지 — 로컬 모델 품질은 PC 사양에 종속되므로 팀 내 개발 장비가 균일하지 않으면 결과가 사람마다 달라진다. 그리고 '로컬 처리'가 텔레메트리까지 로컬이라는 뜻은 아니므로, 전송되는 메타데이터 항목을 따로 확인해야 한다.", fresh:"Microsoft Ignite 2026·Windows Experience Blog", date:"2026-11-17", url:"https://blogs.windows.com/windowsexperience/2026/11/17/microsoft-ignite-2026-building-windows-for-the-next-era-of-work/"},
  {t:"제미나이 4 하이드로젠 — 에이전트·코딩용 중간 티어 모델, Terminal-Bench 4.1 57%·100만 토큰당 1.50달러", vendor:"Gemini", type:"모델업데이트", ci:"🤖", s:82, d:"카본·아르곤 아래의 실무 티어로, 빠른 에이전트 루프를 싼 값에 돌리려는 용도다. 벤치마크와 가격이 공개돼 기존 모델과 직접 비교해 바꿔 끼울 수 있다.", content:"구글이 2026년 11월 12일부터 전 세계에 순차 적용한 제미나이 4 하이드로젠(Gemini 4 Hydrogen)이다. 라인업에서의 위치가 먼저 중요하다 — 깊고 긴 추론용인 제미나이 4 카본·아르곤 아래에 놓인 실무(workhorse) 티어이고, 카본에서 파생됐다. 적용 범위는 구글 검색, 제미나이 앱, Google AI Studio, 제미나이 API, 안드로이드 스튜디오, 제미나이 포 비즈니스다. 숫자로 보면 3.8 Flash 대비 작업 완료가 2.5배 빠르고, Terminal-Bench 4.1에서 57%(3.8 Flash는 18.2%)를 기록했으며, 허위 주장은 5배 이상 줄었다고 구글은 밝혔다. 입력은 텍스트·이미지·오디오·비디오를 받고 지식 컷오프는 2026년 3월, 가격은 100만 토큰당 1.50달러다. 실제로 뭘 할 수 있나 — 코딩 에이전트의 기본 모델을 이걸로 바꿔 같은 과제를 돌려보고 지연·비용·성공률을 비교하는 것이 가장 빠른 활용이다. Terminal-Bench는 터미널에서 다단계 작업을 끝내는 능력을 보는 벤치마크라, 셸 작업이 많은 에이전트일수록 체감 차이가 클 가능성이 있다. 주의할 점은 이 숫자들이 모두 구글 자체 발표라는 것과, 중간 티어라 긴 호흡의 설계·리팩터링 작업은 여전히 상위 모델이 필요할 수 있다는 점이다.", fresh:"unite.ai", date:"2026-11-17", url:"https://www.unite.ai/google-launches-gemini-4-hydrogen-for-everyday-agentic-workflows/"},
  {t:"Modern Web Guidance 1.0 — 코딩 에이전트에 '현대 웹' 지식을 주입하는 크로스브라우저 가이드(크롬·파이어폭스·엣지)", vendor:"기타", type:"Skill", ci:"🤖", s:82, d:"에이전트가 낡은 웹 패턴을 뱉는 문제를 Baseline 호환성 데이터와 전문가 검수 가이드로 교정한다. 기존 코드 현대화 워크플로와 Chrome DevTools 연동 포함.", content:"크롬 개발팀이 시작한 Modern Web Guidance가 1.0으로 안정화됐고, 파이어폭스와 엣지가 프로젝트에 합류해 크로스브라우저 프로젝트가 됐다. 무엇을 하는 것인가 — AI 코딩 에이전트에게 현대 웹 개발 전문성을 공급하는 자료 묶음이다. 성능·접근성·보안 베스트 프랙티스 가이드, Baseline 표준에 기반한 브라우저 호환성 데이터, 그리고 각 분야 전문가가 검수한 지침으로 구성된다. 왜 필요한가. 모델의 학습 데이터에는 수년 전 웹 관행이 대량으로 섞여 있어서, 에이전트는 지금 쓰면 안 되는 폴리필이나 이미 Baseline에 들어온 기능을 모른 채 우회 코드를 작성하는 경향이 있다. '이 기능을 지금 전 브라우저에서 써도 되는가'는 모델이 추측할 문제가 아니라 데이터로 답할 문제이고, Baseline이 바로 그 데이터다. 실제로 써볼 지점은 두 가지다. (1) 현대화 워크플로 — 기존 HTML·CSS·JavaScript와 package.json을 분석해 낡은 패턴을 찾아내는 절차가 들어 있다. 레거시 프런트엔드를 들고 있다면 에이전트에 이 워크플로를 물려 1차 진단을 받는 쪽이 사람이 훑는 것보다 빠르다. (2) Chrome DevTools 연동 — 에이전트가 브라우저를 직접 열어 성능·접근성 측정값을 확인하는 경로가 생긴다. 추측으로 '최적화했다'고 말하는 대신 측정값으로 검증하게 만드는 장치다. 벤더 중립이라는 점도 중요하다 — 크롬 단독 권고였다면 '크롬에서만 되는 코드'를 양산할 위험이 있었는데, 파이어폭스·엣지 참여로 그 편향이 줄었다. Claude Code나 Codex에서 쓰려면 이 가이드를 스킬·규칙 파일로 붙여 프로젝트 컨텍스트에 상주시키는 방식이 맞다.", fresh:"developer.chrome.com / GeekNews 37324", date:"2026-11-17", url:"https://developer.chrome.com/blog/modern-web-guidance-v1"},
  {t:"ChatGPT 월렛 공식 문서 — 에이전트가 생체인증 승인으로 직접 결제하는 구조(아멕스·마스터카드·비자)", vendor:"OpenAI", type:"모델업데이트", ci:"🤖", s:82, d:"에이전트 커머스의 결제 레이어가 어떻게 생겼는지 1차 자료로 읽을 수 있다. 카드번호는 가맹점·에이전트 양쪽에 비노출.", content:"오픈AI가 ChatGPT 월렛을 공개했다. 핵심은 AI 에이전트가 사용자를 대신해 구매를 완료할 수 있게 하는 결제 레이어이고, 승인은 생체인증으로 받는다. 카드 파트너는 아멕스·마스터카드·비자이며 초기 제공 범위는 미국 ChatGPT Pro 구독자다. 설계상 중요한 대목은 카드 정보가 가맹점과 에이전트 양쪽 모두에게 비노출로 유지된다는 점이다 — 토큰화된 결제 수단을 에이전트가 '쓸 수는 있지만 볼 수는 없는' 구조이고, 에이전트 결제의 신뢰 모델을 설계할 때 그대로 참고할 패턴이다. 공식 문서를 직접 읽을 가치가 있는 이유는 세 가지다. (1) 승인 경계가 어디에 그려지는지 — 어떤 금액·어떤 가맹점까지 사용자 재확인 없이 통과되는지가 에이전트 권한 설계의 기준선이 된다. (2) 가맹점 쪽 통합 요구사항 — 자기 서비스를 에이전트 구매 가능 상태로 만들려면 무엇을 노출해야 하는지. (3) 경쟁 프로토콜과의 관계 — 같은 주 시에라의 포피 프로토콜 1.0이 쇼피파이 175개국 전 가맹점에 자동 활성화됐고, 아마존은 상품정보 통합으로 데이터 주도권 방어에 들어갔다. 에이전트 커머스를 붙일 계획이 있으면 이 세 규격을 같이 놓고 비교하는 편이 낫다.", fresh:"OpenAI", date:"2026-11-16", url:"https://openai.com/index/introducing-chatgpt-wallet/"},
  {t:"Google Antigravity /teamwork — 생성 에이전트와 독립 검증기를 짝지어 돌리는 오케스트레이션, 외부 공개", vendor:"Gemini", type:"기타", ci:"🤖", s:82, d:"멀티에이전트를 '생성 + 독립 검증' 쌍으로 구성하는 설계를 외부에서 쓸 수 있게 공개했다.", content:"구글이 11월 13일 안티그래비티의 /teamwork 멀티에이전트 오케스트레이션을 외부 공개했다. 핵심 설계는 전문화된 생성(generator) 에이전트와, 그 산출물을 독립적으로 검증하는 장치를 짝지어 돌리는 것 — 에이전트를 여러 개 띄워 나눠 일하게 하는 /swarm(11월 10일 프리뷰)과 달리 검증 경로를 생성 경로와 분리한다. 붙는 모델은 제미나이 4 아르곤·카본·하이드로젠 세 종이고, 적용 영역으로 수학, 화학, 시스템 소프트웨어, 머신러닝 엔지니어링을 든다. 공개된 성과 중 재현 가능성이 가장 높은 것은 적응적 데이터 분석의 2014년 미해결 문제(앞선 응답에 따라 적응적으로 선택되는 통계 쿼리의 준최적 샘플 바운드)를 증명하고 Lean으로 형식 검증한 건이다. 그 밖에 분자 구조 규명, 인프라 커널 최적화, 소프트웨어 재작성 사례를 제시했다. 직접 써볼 포인트는 자신의 워크플로에서 '검증을 생성과 같은 에이전트에게 맡기고 있지 않은지' 점검하고, 테스트·린트·형식검증처럼 기계적으로 판정 가능한 게이트를 별도 에이전트로 떼어내는 것 — Claude Code나 다른 하네스에서도 같은 패턴을 서브에이전트로 재현할 수 있다. 다만 발표 수치는 벤더 자체 공표이며 제3자 재현은 아직 없다.", fresh:"TLDR / Google", date:"2026-11-13", url:"https://tldr.tech/story/b76b5f86-9a3d-484e-8f41-be1841d3baa3"},
  {t:"Gemini 4 Carbon 정식 공개 — 도입가 입력 $2·출력 $10(11월 30일까지), CursorBench 4.0 1위", vendor:"Gemini", type:"모델업데이트", ci:"🤖", s:82, d:"심층 추론용 프런티어 모델. AI Studio·Gemini for Business로 API 제공, 11월 30일까지 도입가가 정가의 절반이다.", content:"구글이 2026년 11월 10일 Gemini 4 Carbon을 정식 공개했다. 복잡한 다단계 추론이 필요한 작업 — 사이버보안 분석, 과학 연구, 다단계 코딩, 법률·금융 지식노동 — 을 겨냥한 프런티어 모델이다. 가격이 가장 실무적인 정보다: 도입가로 100만 토큰당 입력 2달러·출력 10달러이며 2026년 11월 30일까지 적용되고, 이후 정가는 입력 4달러·출력 20달러다. 즉 11월 안에 평가를 돌리면 절반 비용으로 벤치마킹할 수 있다. 접근 경로는 개발자는 Google AI Studio·Android Studio·Google Antigravity, 기업은 Gemini for Business, 소비자는 Google AI Ultra 구독자의 Gemini 앱과 검색 AI 모드다. 과학자에게는 Antigravity를 통한 6개월 무료 프로그램(순차 온보딩), 사이버보안 종사자에게는 Fairwind 프로그램이 별도로 열려 있다. 구글이 제시한 성적은 CursorBench 4.0, Perplexity의 WANDR, Zapier의 AutomationBench에서 1위이며 '차순위 외부 모델 대비 과제당 비용 2배 이상 낮음'이라고 밝혔다. 같은 계열 구분을 알아두면 모델 선택이 쉬워진다 — Hydrogen은 빠른 실행형, Carbon과 Argon은 깊은 추론형이고, Antigravity의 Orchestrator가 둘 사이를 자동으로 전환한다. 바로 할 수 있는 것: 지금 Claude·GPT로 돌리는 긴 추론 과제 하나를 골라 11월 안에 Carbon 도입가로 같은 프롬프트를 돌려 품질·비용을 비교해 두는 것. 마이그레이션 베스트 프랙티스 문서가 함께 제공된다.", fresh:"Google 공식 블로그", date:"2026-11-10", url:"https://blog.google/innovation-and-ai/models-and-research/gemini-models/gemini-4-carbon-now-available/"},
  {t:"Google Antigravity Orchestrator — 한 세션에서 Gemini 4 Carbon↔Hydrogen 자동 핸드오프", vendor:"Gemini", type:"모델업데이트", ci:"🤖", s:82, d:"카본이 계획·리뷰, 하이드로젠이 코딩·테스트를 맡고 전환 시점을 시스템이 판단한다. 터미널벤치 4.1에서 카본 근접 성공률에 쿼터 24%↓·완료 19%↑.", content:"2026년 11월 12일 구글이 Antigravity에 Orchestrator를 모델 드롭다운 옵션으로 추가했다(Google AI Ultra 구독자부터 순차 적용). 동작 방식은 역할 분담이다 — Gemini 4 Carbon이 아키텍처 설계와 리뷰를 담당하고, 코딩과 테스트 실행은 Gemini 4 Hydrogen에 넘긴 뒤 검토가 필요한 지점에서 다시 카본으로 끌어올린다. 개발자가 '지금은 추론이 필요한 구간, 지금은 함수를 쏟아내는 구간'을 판단해 모델을 손으로 바꿔 끼우던 작업이 사라진다. 구글이 제시한 수치는 Terminal-Bench 4.1에서 카본 단독에 근접한 과제 성공률을 유지하면서 쿼터 사용량 평균 24% 감소, 완료 시간 19% 단축이다. Hydrogen 자체는 유료 AI Pro·Ultra 구독자에게 별도로 배포되고 기업은 Gemini for business로 두 모델을 쓸 수 있으며, 구글은 Orchestrator가 지원하는 모델·플랜을 앞으로 늘린다고 밝혔다. 모델 계열 구분: Hydrogen은 빠른 실행형, Carbon과 Argon은 더 깊고 장기적인 추론 쪽이다. 배울 점은 제품 기능 자체보다 패턴이다 — '계획은 큰 모델, 실행은 빠른 모델, 검토는 다시 큰 모델'이라는 라우팅은 Claude Agent SDK나 자체 하네스에서도 그대로 구현할 수 있고, 비용이 가장 많이 새는 구간(긴 실행 루프)을 싼 모델로 덮는 가장 단순한 방법이다.", fresh:"unite.ai / winbuzzer", date:"2026-11-12", url:"https://www.unite.ai/google-antigravity-rolls-out-orchestrator-for-dynamic-model-handoffs/"},
  {t:"구글 제미나이 Decisions API 개발자 공개 — AI 스튜디오에서 바로 쓰는 '판정 전용' 저비용 경로", vendor:"Gemini", type:"모델업데이트", ci:"🤖", s:82, d:"텍스트 생성 없이 정해진 선택지 중 답과 확률만 돌려주는 결정 모델 API가 Google AI Studio로 개방됐다(비캐시 입력 100만 토큰당 0.10달러, 출력 무료).", content:"결정 모델(decision model)은 자유 서술을 생성하지 않고 미리 정한 선택지·점수·yes 확률 같은 타입이 고정된 값만 신뢰도와 함께 돌려주는 모델 계열이다. 구글은 제미나이 Decisions API를 11월 11일 발표하고 Google AI Studio를 통해 개발자에게 열었으며, 가격은 비캐시 입력 100만 토큰당 0.10달러에 출력 과금이 없다 — OpenAI Decisions API(GPT-6 Luna 기반, 10월 6일 퍼블릭 베타)와 같은 단가이고, 원조인 TypeSafe AI의 Jev는 0.042달러로 더 싸다. 지금 바로 시도할 수 있는 용도는 분명하다: 문서 분류·스팸 판정·룰 위반 체크처럼 '생성이 필요 없는' 다수 판정을 LLM 본체 대신 이 경로로 빼면 비용과 지연이 크게 줄고, 테크타임스 측정으로는 체크 20개를 묶어 돌릴 때 비용이 16배 내려갔다. 다만 같은 측정에서 최상위 결정 모델도 문서 통과율이 63%에 그쳐, 정확도가 중요한 판정에는 본체 모델 폴백을 함께 설계해야 한다. 에이전트 파이프라인을 짤 때 '판정은 싸게, 생성은 비싸게' 두 경로로 쪼개는 패턴을 먼저 실험해볼 가치가 있다.", fresh:"TechTimes / Google AI Studio", date:"2026-11-13", url:"https://www.techtimes.com/articles/330611/20261113/google-gemini-decisions-api-cuts-20-check-cost-16x-top-decision-model-passes-63-documents.htm"},
  {t:"Reticle — AI 코딩 에이전트가 웹·데스크톱 앱을 직접 눌러 보고 결과로 검증하는 도구", vendor:"기타", type:"MCP", ci:"🤖", s:81, d:"에이전트가 코드를 고친 뒤 실제로 버튼을 누르고 값을 넣어 로그인·결제가 되는지 확인한다. 기록한 흐름은 모델 없이 CI에서 재생된다.", content:"Reticle(github.com/reticlehq/reticle)은 AI 코딩 에이전트가 웹·데스크톱 앱을 직접 조작해 변경이 실제로 동작하는지 검증하게 하는 도구다. 동작 방식이 구체적이다 — 에이전트가 코드를 수정하면 Reticle이 \"실제로 버튼을 누르고 값을 입력해\" 로그인·결제 같은 기능이 의도대로 되는지 확인한다. 수집하는 증거는 API 요청·응답, 콘솔 오류, UI 변화이고, 이걸로 결제 중복 제출 같은 문제를 잡아낸다. 결과는 pass/fail/indeterminate 세 가지 상태로 근거와 함께 반환된다 — indeterminate를 별도 상태로 둔 것이 설계상 정직한 부분이다. 판정 불가를 통과로 뭉개지 않는다. 운영상 가장 쓸만한 특성은 기록한 워크플로를 AI 모델 없이 CI에서 재생할 수 있다는 점이다. 즉 에이전트로 한 번 만든 검증 시나리오가 그 뒤로는 모델 호출 비용 없이 회귀 테스트로 굳는다 — 에이전트를 테스트 작성 도구로 쓰고 실행은 결정론적으로 돌리는 구조다. 지원 환경은 MCP를 통한 다중 IDE 연결, React/Vite, Next.js, Electron, Tauri다. 적용 순서는 로그인·결제처럼 수동 테스트 비용이 가장 큰 플로우 하나를 먼저 기록해 CI에 넣고, 거기서 flaky 여부를 확인한 뒤 범위를 넓히는 쪽이 낫다. 앞서 나온 Claude Code 팀의 \"실행 결과로 입증하라\"는 원칙을 도구로 구현한 사례로 읽으면 맞물린다.", fresh:"GeekNews / GitHub reticlehq", date:"2026-11-19", url:"https://news.hada.io/topic?id=37440"},
  {t:"Anthropic Model Hardware Standard(MHS) 리서치 프리뷰, 연구실·첨단 제조사에 개방 — 에이전트가 실물 장비를 안전하게 조작하는 공통 규격", vendor:"Claude", type:"MCP", ci:"🤖", s:81, d:"MCP 위에 얹히는 게이트형 규격으로, 장비가 자기 측정값·조정 항목·안전 한계를 스스로 기술하게 만든다. 11월 17일 제조 분야 웨비나와 함께 1차 그룹에 열렸다.", content:"앤트로픽이 Model Hardware Standard(MHS) 리서치 프리뷰를 과학 연구실과 첨단 제조사 1차 그룹에 개방했다. MHS는 2026년 8월 27일 리서치 프리뷰로 처음 공개된 규격으로, AI 에이전트가 실험·제조 장비를 발견하고 이해하고 안전하게 조작할 수 있게 하는 공통 명세다. 무엇을 하는가 — MHS 드라이버를 붙이면 장비의 일반 특성(무엇을 측정할 수 있는지, 무엇을 조정할 수 있는지, 어떤 안전 한계가 강제되는지)을 담은 참조 파일이 자동 생성된다. 드라이버에는 태그가 있어 사용자가 이 정보를 자연어로 직접 쓸 수도 있고, 하드웨어 구성을 인터뷰하는 에이전트와 대화하면서 채울 수도 있다. 구체적으로 다루는 것은 세 묶음이다. (1) 텔레메트리와 측정 출력 — 센서·카메라·광학 엔코더에서 오는 데이터 스트림을 일정한 형식으로 제공한다. (2) 물리 치수와 적재 한계 — 작동 범위, 최대 토크, 팔 길이 같은 제약을 명시한다. (3) 강제 안전 한계 — 과신장·충돌·열폭주를 막는 경계를 드라이버 참조 설정 안에 격리해 두고, 로컬 런타임 검사가 범위를 벗어난 파라미터를 하드웨어 컨트롤러에 도달하기 전에 거부한다. 왜 쓸만한가 — 프로그래밍 가능한 인터페이스가 있는 장비라면 무엇이든 붙고, 모델에 종속되지 않으며, MCP 같은 표준 프로토콜로 어떤 에이전트 하네스에서도 접근할 수 있다. 초기 실험실 테스트에서 통합 시간이 줄고 실험 자동화가 가능했다는 보고가 있다. 다만 접근이 게이트로 막힌 프리뷰라 지금 당장 누구나 쓸 수는 없다 — 규격과 설계 패턴을 먼저 읽어두는 쪽이 현실적이다. 앤트로픽은 11월 17일 오전 8시(PT) 'Claude for Manufacturing' 웨비나와 오전 11시(ET) 기술 웨비나에서 이 프리뷰를 다뤘다.", fresh:"Anthropic News", date:"2026-11-17", url:"https://www.anthropic.com/news/model-hardware-standard-research-preview"},
  {t:"GPT-6.2 Sol, ChatGPT 유료 등급 전체(Plus·Pro·Business·Enterprise)로 롤아웃 — 복잡한 지시 따르기와 이미지 세부 판독 개선", vendor:"OpenAI", type:"모델업데이트", ci:"🤖", s:80, d:"API에 먼저 나왔던 Sol이 ChatGPT 구독 등급으로 내려왔다. Astra는 '느리게 깊이', Sol은 '빠르게 일상 워크플로'로 역할을 나누는 구성이다.", content:"오픈AI가 GPT-6.2 Sol을 ChatGPT의 Plus·Pro·Business·Enterprise 구독자에게 롤아웃하고 있다. 개선점으로 제시된 것은 세 가지다 — 복잡한 지시를 끝까지 따라가는 능력, 이미지 안의 작은 디테일을 읽는 능력, 온라인 상품 추천 품질이다. 설계 의도는 'think-fast, think-slow parity'로, Astra를 느리게 깊이 파는 모델로 두고 Sol이 일상 워크플로를 더 빠르고 저렴하게 처리하게 나눈다. 실무로 옮기면 선택 기준은 단순하다 — 결과를 바로 검증할 수 있는 작업(코드 변경, 문서 정리, 반복 분류)은 Sol로 내리고, 실패 비용이 큰 1회성 판단만 Astra에 남긴다. API 단가가 Astra 8/40달러 대 Sol 2/10달러로 4배 차이라는 점을 감안하면, ChatGPT UI에서 체감 품질을 먼저 비교해 보고 API 라우팅 규칙을 정하는 순서가 비용 면에서 안전하다. 주의할 것은 등급별 롤아웃이 순차적이라 당장 모델 선택기에 안 보일 수 있다는 점이다.", fresh:"TechTarget / The Neuron", date:"2026-11-24", url:"https://www.techtarget.com/news/model-release-gemini-4-neon-gpt-62-astra-sol-target-business-productivit/875440/"},
  {t:"Antigravity v2.34.0 — MCP App 지원과 Gemini 4 Neon을 유료 소비자 플랜까지 확대(개선 15건·수정 24건)", vendor:"Gemini", type:"MCP", ci:"🤖", s:80, d:"MCP App을 지원하고 Gemini 4 Neon을 자격 있는 유료 소비자 플랜에 개방했다.", content:"Antigravity 데스크톱 v2.34.0이 MCP App 지원을 추가했다. 기존 MCP가 도구 묶음을 연결하는 데 그쳤던 것과 달리 MCP App은 서버가 UI를 포함한 앱 단위로 노출되는 형식이어서, 에이전트 안에서 외부 서비스를 '도구 호출'이 아니라 '앱 사용'에 가깝게 쓸 수 있다. 같은 릴리스에서 Gemini 4 Neon이 자격 있는 유료 소비자 플랜에 열렸고, 개선 15건·수정 24건이 함께 들어갔다. 11월 업데이트 흐름에서는 원격 에이전트, 보이스 모드, 네이티브 주피터 뷰어가 이미 추가된 상태다 — 주피터 뷰어는 데이터 작업을 에이전트에게 맡기고 결과 노트북을 바로 보는 구성이 가능해진다는 뜻이다. 지금 할 수 있는 것 — 쓰고 있는 MCP 서버가 App 형식을 지원하는지 확인하고, 지원하면 도구 목록이 아니라 앱으로 붙여 보는 쪽이 토큰 소비와 호출 횟수에서 유리한지 비교한다. 유료 플랜이면 `/model`에서 Gemini 4 Neon이 선택 가능한지 먼저 확인한다.", fresh:"Releasebot", date:"2026-11-24", url:"https://releasebot.io/updates/google/antigravity"},
  {t:"Unsloth Desktop으로 로컬 AI 시작하기 — VRAM별 모델·컨텍스트 조합표(Qwen3.8-27B·Inkling 2 Mini·Gemma 4)", vendor:"기타", type:"튜토리얼", ci:"🤖", s:80, d:"구독 없이 윈도우·맥·리눅스에서 로컬 모델을 돌리는 절차와, 8GB부터 32GB 이상까지 VRAM 구간별로 어떤 모델에 어떤 컨텍스트 길이를 주면 되는지 정리한 표가 핵심이다.", content:"오픈소스 앱 Unsloth Desktop을 써서 로컬 AI를 세팅하는 입문 가이드다(GeekNews 8포인트). 절차는 네 단계로 짧다 — ① Unsloth Desktop 설치, ② 자기 GPU 메모리에 맞는 양자화 모델 다운로드, ③ 컨텍스트 창 크기 설정, ④ LAN 공유를 켜서 집 안 다른 기기에서 접속. 쓸모 있는 부분은 VRAM 구간별 권장 조합이다. 8~12GB는 9B~12B 모델에 8K~16K 컨텍스트, 16GB는 14B~35B에 16K~32K, 24GB는 27B~31B에 16K~32K, 32GB 이상이면 풀 스케일 모델에 64K~128K를 준다. 다루는 모델은 Qwen3.8-27B(270억 파라미터), Inkling 2 Mini(264억 MoE·활성 54억), Gemma 4 계열(12B·26B·31B), VRAM이 적을 때의 Qwen3.5-9B다. 가이드가 반복해서 강조하는 판단 기준이 하나 있다 — 모델 크기를 최대로 키우는 것이 아니라 VRAM 용량과 컨텍스트 길이의 균형을 맞추라는 것이다. 실제로 로컬에서 코딩 에이전트를 돌릴 때 병목은 파라미터 수보다 컨텍스트가 먼저 터지는 쪽이므로, 같은 VRAM이면 한 단계 작은 모델에 긴 컨텍스트를 주는 조합이 체감이 낫다. 클라우드 모델을 쓸 수 없는 환경(사내 데이터, 오프라인)에서 바로 적용할 수 있는 수준의 문서다.", fresh:"GeekNews", date:"2026-11-24", url:"https://news.hada.io/topic?id=37670"},
  {t:"skills-mcp-server — Claude 호환 Skill을 MCP 툴로 노출해 MCP 클라이언트가 붙은 모든 에이전트가 쓰게 하는 서버", vendor:"Claude", type:"MCP", ci:"🤖", s:80, d:"Skill 디렉터리를 그대로 MCP 툴 목록으로 변환해, Claude Code가 아닌 에이전트에서도 같은 Skill을 재사용하게 한다.", content:"Claude의 Agent Skills는 원래 Claude Code·claude.ai 안에서만 로드되는 포맷이다. 이 서버는 Skill 디렉터리(SKILL.md + 리소스)를 읽어 각 Skill을 MCP 툴 하나로 노출하기 때문에, MCP 클라이언트를 붙일 수 있는 에이전트라면 벤더와 무관하게 같은 Skill을 호출할 수 있다. 사내에서 Skill로 축적한 업무 절차를 Cursor·VS Code·자체 에이전트에 그대로 옮길 때 재작성 비용이 사라진다. 스스로 no-nonsense를 내세울 만큼 구성이 얇아서, 설치 후 Skill 경로만 지정하면 동작한다. 반대로 Skill 쪽의 점진적 공개(progressive disclosure) 이점은 일부 사라지므로, 툴 수가 많아지면 클라이언트 쪽 툴 목록 비대를 감수해야 한다. Skill을 여러 에이전트에서 공유할 계획이 있다면 지금 바로 시험해볼 가치가 있다.", fresh:"GitHub", date:"2026-11-23", url:"https://github.com/portertech/skills-mcp-server"},
  {t:"Unity 공식 플러그인 — Claude Code 29개·Codex 31개 스킬 + Unity CLI 1.0.0 + 라이브 에디터 제어 MCP 서버", vendor:"Claude", type:"Plugin", ci:"🤖", s:80, d:"Unity가 직접 내놓은 1st-party 플러그인. 스킬 묶음과 빌드·테스트용 CLI, 에디터를 실제로 조작하는 MCP 서버가 함께 들어온다.", content:"게임이나 3D 쪽을 만지는 사람에게는 지금 당장 설치할 가치가 있는 플러그인이다. Unity가 직접 배포하는 1st-party 플러그인으로, Claude Code용은 2026년 9월 초 출시에 스킬 29개, Codex용은 9월 16일 출시에 스킬 31개가 들어 있다. 둘 다 Unity 6.0 이상이 필요하다. 설치는 Claude Code는 Anthropic 플러그인 디렉터리 또는 npm, Codex는 OpenAI 플러그인 디렉터리에서 한 번 클릭하면 된다. 구성이 세 겹이라는 점이 중요하다. ① 스킬 — UI Toolkit, URP 렌더 파이프라인, 멀티플레이어, 모네타이제이션을 다루고 Codex 쪽은 프로젝트 셋업과 Built-in에서 URP로의 마이그레이션 스킬이 더 있다. ② Unity CLI — Claude Code 플러그인에 포함되며 2026년 11월 12일 1.0.0에 도달했다. 빌드 트리거, 테스트 실행, 프로젝트 상태 조회를 명령줄로 할 수 있어서 에이전트가 자기 변경을 스스로 검증할 수 있게 된다. ③ MCP 서버 — Claude Code의 경우 Unity 에디터에 라이브 에디터 제어를 붙여, 에이전트가 장면을 열고 컴포넌트를 추가하고 컴파일이 되는지 직접 확인한다. 세 겹이 함께 있어야 의미가 있다는 게 이 플러그인의 교훈이다. 스킬만 있으면 모델이 Unity 관례를 아는 상태로 코드를 쓰지만 그게 실제로 컴파일되는지 모른다. CLI와 MCP가 붙으면 쓰고-돌리고-고치는 루프가 닫힌다. 자기 도메인용 플러그인을 설계할 때 그대로 따라 쓸 만한 구조다.", fresh:"shattered.io / Unity", date:"2026-11-12", url:"https://shattered.io/unity-claude-code-codex-plugin-skills-2026/"},
  {t:"Vercel UI SDK + Agent Bridge — 에이전트가 UI를 조립·검사·조작할 수 있게 50개 이상 헤드리스 동작으로 쪼갠 오픈소스", vendor:"기타", type:"기타", ci:"🤖", s:80, d:"완성된 비주얼 컴포넌트가 아니라 키보드 내비게이션·포커스·선택·팝업·드래그앤드롭·해제 같은 '동작' 단위를 제공해, 코딩 에이전트가 커스텀 UI를 안전하게 쌓게 한다.", content:"버셀 랩스가 2026년 11월 13일 Apache 2.0으로 공개했다(github.com/vercel-labs/ui). 설계 결정이 핵심이다 — UI 컴포넌트를 통째로 주는 대신 접근성·상호작용 동작 50여 개로 분해해 헤드리스로 제공한다. 포함되는 것은 키보드 내비게이션과 포커스 관리, 선택, 팝업, 드래그앤드롭, 해제(dismissal) 동작과 ARIA 접근성 지원이며, React·Vue·Svelte·Solid·웹 컴포넌트에서 모두 쓸 수 있다. 기예르모 라우치 CEO는 이를 '에이전트를 위한 x86 명령어 집합'이라고 표현했다 — 에이전트가 의존할 수 있는 낮은 수준의 안정적 계약을 깔아두면 그 위에 커스텀 컴포넌트를 자동으로 조립해도 깨지지 않는다는 발상이다. 함께 공개된 Agent Bridge는 에이전트가 실행 중인 인터페이스를 프로그램적으로 조립·검사·조작하게 하는 통로다. Claude Code나 Codex로 프런트엔드를 만들게 할 때 체감되는 문제 — 생성된 컴포넌트의 접근성과 키보드 동작이 매번 다르게 깨지는 것 — 를 라이브러리 층에서 고정하는 접근이라, 에이전트 주도 프런트엔드 작업을 하는 쪽이면 지금 시도해볼 가치가 있다. 파생 프로젝트로 kind-ui/agent-ui(프레임워크 비의존·에이전트 조작 가능 컴포넌트)가 이미 나와 있다.", fresh:"Vercel Labs / ProductHunt", date:"2026-11-13", url:"https://github.com/vercel-labs/ui"},
  {t:"Gemini CLI v0.69~0.70 — `/stats heatmap`으로 일별 토큰 사용량 시각화, 독립 `theme.json`, `model.requestTimeoutMs`", vendor:"Gemini", type:"모델업데이트", ci:"🤖", s:80, d:"토큰 사용량 히트맵과 타임아웃 조정이 들어가 장시간 에이전트 작업의 비용·중단을 직접 관리할 수 있다.", content:"Gemini CLI v0.69.0과 v0.70.0에서 실무에 바로 쓰이는 것이 세 개다. ① `/stats heatmap`은 일별 토큰 사용량을 히트맵으로 보여준다 — 어느 날 어떤 작업이 토큰을 태웠는지 사후에 찾을 수 있어, 비용이 튀는 워크플로를 식별하는 데 쓴다. 매일 쓰는 CLI에서 사용량이 집계되지 않으면 과금 원인을 추적할 방법이 없기 때문에 이 한 줄짜리 명령이 생각보다 쓸모 있다. ② `theme.json`을 독립 파일로 둘 수 있게 돼 설정 본체와 테마를 분리해 공유·버전관리할 수 있다. ③ `model.requestTimeoutMs`로 요청 타임아웃을 덮어쓸 수 있다 — 긴 추론이나 대용량 컨텍스트 작업이 기본 타임아웃에서 끊기던 경우를 직접 늘려서 해결한다. 이 밖에 셸 명령 승인과 정책 매칭 관련 수정이 여러 건 들어갔다. 승인 정책 버그는 '허용했는데 다시 묻는다' 또는 반대로 '물어야 하는데 통과한다' 양쪽으로 나타나므로, 승인 규칙을 세밀하게 쓰는 환경이라면 올리는 편이 안전하다.", fresh:"Gemini CLI 릴리스 노트 / dev.to 주간 정리", date:"2026-11-21", url:"https://dev.to/aicoding-guide/this-week-in-claude-code-codex-and-gemini-cli-week-of-november-22-2026-1ofi"},
  {t:"Anthropic Project Glasswing — Mythos Preview를 기반 소프트웨어 취약점 점검에 쓰는 파트너 프로그램", vendor:"Claude", type:"기타", ci:"🤖", s:80, d:"공개 배포를 제한한 Claude Mythos Preview를 AWS·애플·구글·마이크로소프트 같은 파트너에게 열어 핵심 인프라의 취약점을 찾아 고치게 하는 프로그램이다.", content:"앤트로픽이 Claude Mythos Preview의 공개 배포를 제한하면서 대신 만든 통로가 Project Glasswing이다. 배경은 모델 능력 자체다 — Mythos Preview는 주요 운영체제와 웹 브라우저에서 알려지지 않은 취약점을 스스로 찾아 익스플로잇까지 만들어내고, 앤트로픽 집계로 오픈소스 프로젝트 약 1,000개에서 잠재 취약점 2만 3,000건 이상을 탐지했다. 주요 암호 라이브러리의 TLS·AES-GCM·SSH 구현에서 인증서 위조나 암호통신 복호화로 이어질 수 있는 결함도 포함됐다. 그래서 앤트로픽은 모델을 일반 공개하지 않고, AWS·애플·구글·마이크로소프트 등 Glasswing 파트너에게 접근을 주어 자기 기반 시스템의 결함을 찾아 고치게 하는 쪽을 택했다. 여기서 배울 점은 모델 접근 정책을 능력 등급에 맞춰 설계하는 방식이다 — 공격 능력이 방어 속도를 앞지르는 모델은 일반 API가 아니라 사전 심사된 방어 측에만 열고, 발견된 취약점은 패치 완료 전까지 공개하지 않는 순서로 묶는다. 자기 조직에 바로 적용할 수 있는 것은 두 가지다. ① 핵심 서비스의 암호·네트워크 파싱 경로를 정리해 기계적 스캔 대상 목록을 미리 만들어 두기, ② 제로데이 제보 접수와 패치 배포의 소요 시간을 지금 측정해 두기 — 이미 공개 시점 기준 발견된 고위험 제로데이의 99% 이상이 미패치였다는 수치가 나와 있어, 패치 파이프라인 속도가 방어력의 상한이 된다.", fresh:"Anthropic Glasswing / SecurityWeek", date:"2026-11-20", url:"https://www.anthropic.com/glasswing"},
  {t:"MIRIX-2.0 — 멀티에이전트가 공유 메모리로 조정하는 아키텍처 논문(HF 주간 1위, 업보트 3,510)", vendor:"기타", type:"논문", ci:"🤖", s:80, d:"에이전트 여러 개가 공유 메모리를 통해 협업하는 구조를 정리한 논문.", content:"허깅페이스 데일리 페이퍼스 2026년 W47(11월 15~21일) 주간 1위 논문이며 업보트 3,510으로 2위(1,150)와 격차가 크다. 여러 에이전트가 공유 메모리 구조를 매개로 조정·소통하는 멀티에이전트 시스템 아키텍처를 제시한다. 실무에서 서브에이전트를 여러 개 띄우면 각자 다시 파일을 읽고 같은 결론을 중복 도출하는 낭비가 생기는데, 이 논문은 '무엇을 메모리에 남기고 누가 어떤 조건에서 읽는가'를 시스템 수준에서 규정하는 쪽으로 접근한다. 클로드 코드의 서브에이전트나 Codex의 원격 세션처럼 여러 에이전트를 병렬로 돌리는 구성에 설계 참고가 된다. 앤트로픽이 공개한 '에이전트 메모리의 구성요소' 글과 묶어 읽으면 공유 메모리와 개별 컨텍스트의 경계를 어디에 둘지 판단하는 데 도움이 된다. 구현 코드가 공개돼 있다면 소규모로 재현해 보는 것부터 권할 만하다.", fresh:"Hugging Face Daily Papers W47", date:"2026-11-21", url:"https://huggingface.co/papers/week/2026-W47"},
  {t:"항상 작동하는 에이전트(always-on agent) 구축하기 — 긴 컨텍스트 코딩 벤치마크에서 Opus 5.5의 과제당 해결 비용이 Opus 5보다 78% 낮아진 지점", vendor:"Claude", type:"튜토리얼", ci:"🤖", s:80, d:"상시 가동 에이전트가 실무로 넘어온 이유를 모델 추론 개선과 장기 과제 비용 하락으로 설명한 글.", content:"GeekNews에 2026년 11월 21일 올라온 글이다. 핵심 주장은 '항상 켜져 있는 에이전트'를 돌리는 설계가 이제 실현 가능해졌다는 것이고, 근거로 두 가지를 든다 — 모델 추론 품질 개선, 그리고 장기 실행 과제의 비용 하락이다. 제시된 수치는 긴 컨텍스트 코딩 벤치마크에서 해결된 과제당 비용(cost per resolved task)이 Opus 5.5가 Opus 5 대비 78% 낮다는 것이다. 여기서 중요한 건 분모가 '호출 수'나 '토큰 수'가 아니라 '해결된 과제'라는 점이다 — 토큰 단가만 비교하면 같은 결론이 나오지 않는다. 자기 파이프라인에 적용할 때의 순서는: (1) 과제 단위 성공률을 먼저 측정하고, (2) 성공한 과제당 총비용으로 모델을 비교하고, (3) 그 값이 상시 가동(폴링·워치 루프)을 감당할 수준인지 본다. 이 저장소의 1시간 주기 파이프라인처럼 반복 실행되는 구조는 과제당 비용이 전체 운영비를 그대로 결정하므로 측정 단위를 바꾸는 것만으로 모델 선택이 뒤집힐 수 있다.", fresh:"GeekNews", date:"2026-11-21", url:"https://news.hada.io/topic?id=37550"},
  {t:"Claude 클라이언트 SDK 메이저 업그레이드 — API 버전 2026-10-21이 기본값(Python 2.0.0, TS 1.0.0, Go 2.0.0 등)", vendor:"Claude", type:"기타", ci:"🤖", s:80, d:"7개 언어 SDK와 ant CLI가 새 API 버전을 기본 전송하도록 메이저 버전 상승", content:"Python SDK 2.0.0, TypeScript 1.0.0, C# 13.0.0, Go 2.0.0, Java 3.0.0, PHP 1.0.0, Ruby 2.0.0, 그리고 ant CLI 2.0.0이 모두 API 버전 2026-10-21을 기본으로 보낸다. 전부 메이저 버전 상승이라는 점이 신호다 — 올리면 요청에 실려 가는 API 버전이 자동으로 바뀌므로, 응답 스키마에 의존하는 코드가 있으면 업그레이드 전에 변경 항목을 확인해야 한다. 거꾸로 말하면 새 API 버전에서만 열리는 기능을 쓰려면 SDK를 올리는 것이 가장 짧은 길이다. 여러 언어로 서비스를 쪼개 운영하는 팀은 언어별로 메이저 번호가 들쭉날쭉하니(C#은 13, PHP는 1) 버전 숫자가 아니라 '기본 API 버전이 2026-10-21인가'를 기준으로 맞추는 편이 안전하다.", fresh:"Claude Developer Platform Updates 2026-11", date:"2026-11-19", url:"https://releasebot.io/updates/anthropic/claude-developer-platform"},
  {t:"mcp-proof — \"내 MCP 서버가 뜨긴 하나?\"를 검증하는 Claude Code 플러그인·스킬", vendor:"Claude", type:"Plugin", ci:"🤖", s:80, d:"MCP 서버 기동 여부를 자동 점검하는 Claude Code 플러그인과 스킬", content:"MCP 서버를 직접 만들다 보면 '설정은 맞게 넣은 것 같은데 서버가 정말 뜨는지' 확인하는 단계가 매번 수작업이 된다. mcp-proof는 그 검증을 자동화한 도구이고, 11월 11일 PR #30으로 Claude Code 플러그인과 스킬이 추가됐다. 저장소에 .claude-plugin/ 디렉터리와 플러그인 파일이 들어 있어 설치하면 바로 쓸 수 있다. 함께 들어간 스킬은 에이전트에게 검증 시 지켜야 할 규칙을 알려주는 역할을 한다 — 예컨대 npx로 실행되는 서버는 먼저 워밍업을 해야 첫 호출 타임아웃으로 오판하지 않는다는 점, 그리고 비밀값(토큰·API 키)을 커맨드라인 인자에 올리지 말아야 한다는 점이다. 후자는 프로세스 목록에 그대로 노출되는 실수라 MCP 서버 개발에서 특히 자주 일어난다. MCP 서버를 쓰기만 하는 쪽보다 직접 작성·배포하는 쪽에 유용하고, CI에 붙여 '서버가 기동하는지'를 회귀 테스트로 돌리는 용도로도 맞는다.", fresh:"GitHub voyageurworks/mcp-proof PR #30", date:"2026-11-11", url:"https://github.com/voyageurworks/mcp-proof/pull/30"},
  {t:"Dodaios — Claude Code와 Codex 에이전트를 음성·채팅으로 지휘하는 '참모장'", vendor:"Claude", type:"기타", ci:"🤖", s:80, d:"여러 코딩 에이전트 세션을 하나의 음성/채팅 인터페이스로 묶어 지시·상태확인·전환을 처리한다. 데스크톱과 헤드리스 모드를 함께 제공.", content:"Dodaios는 코딩 에이전트를 여러 개 동시에 돌릴 때 생기는 '창 전환 지옥'을 겨냥한 오케스트레이터다. 핵심은 Claude Code와 Codex 세션을 각각 터미널로 열어두는 대신, 음성 또는 채팅 한 곳에서 \"이 작업은 A 세션에, 저건 B 세션에\"처럼 지시하고 진행 상황을 받아보는 구조다. 데스크톱 앱 모드와 헤드리스 모드를 모두 제공해, 로컬에서 쓰다가 서버에 올려 장시간 작업을 맡기는 전환이 가능하다. 왜 쓸만한가 — 에이전트를 2~3개 이상 병렬로 돌리면 실제 병목은 모델 성능이 아니라 사람이 어느 세션이 무엇을 하고 있는지 추적하는 비용이다. 음성 인터페이스는 이 추적 비용을 낮추는 방향이고, 특히 긴 빌드·테스트를 기다리는 동안 다른 세션에 지시를 넣는 패턴에 맞는다. 설치해볼 때 확인할 점은 세션 상태를 어디에 저장하는지(로컬 파일 vs 외부 서비스)와, 에이전트의 승인 요청이 음성 채널로 올라올 때 위험한 명령을 실수로 승인하지 않게 하는 확인 단계가 있는지다. GitHub 트렌딩에 올라온 신규 저장소라 API 안정성은 아직 기대하지 않는 편이 낫다.", fresh:"GitHub Trending", date:"2026-11-19", url:"https://github.com/Dodaios/Dodaios"},
  {t:"ffmpeg-skill — 코딩 에이전트에 FFmpeg 도구 42개를 떠먹여 주는 스킬, GitHub 트렌딩", vendor:"기타", type:"Skill", ci:"🤖", s:80, d:"FFmpeg 명령을 42개 도구로 쪼개 에이전트가 영상·오디오 작업을 로컬에서 수행하게 하는 스킬이다.", content:"ffmpeg-skill은 FFmpeg의 방대한 CLI 표면을 코딩 에이전트가 쓸 수 있는 42개 도구로 정리한 스킬 묶음이다. FFmpeg는 기능은 다 되지만 플래그 조합을 사람이 외우기 어렵고, 에이전트가 직접 명령을 조립하면 인자 하나 틀려 무음 영상이나 깨진 컨테이너가 나오는 일이 흔하다. 이 스킬은 자주 쓰는 작업(트랜스코딩, 자르기, 합치기, 자막 번인, 오디오 추출, 프레임 샘플링, 썸네일 생성, 포맷 변환 등)을 개별 도구로 쪼개 놓고 각 도구가 받아야 하는 입력과 내보내는 산출물을 명시한다. 그래서 에이전트는 '무엇을 할지'만 고르고 플래그 조립은 스킬에 맡긴다. 로컬 실행이라 영상 파일을 외부로 업로드하지 않는 것이 실무상 큰 장점이다 — 미편집 소재나 내부 녹화를 클라우드 API에 올리지 않고 처리할 수 있다. 영상 파이프라인을 자동화하거나, 회의 녹화에서 오디오만 떼어 전사에 넘기는 식의 작업을 에이전트에 맡기려는 쪽이라면 바로 설치해 볼 가치가 있다. GitHub 트렌딩에 올라 있어 유지보수 활동도 확인하기 쉽다.", fresh:"explainX", date:"2026-11-19", url:"https://explainx.ai/blog/ffmpeg-skill-local-video-mcp-coding-agents-github-trending-2026"},
  {t:"제미나이 4 Tasks 에이전트 — 6개국 무료 개방, 지시해 두면 알아서 작업을 끝내 두는 비동기 에이전트", vendor:"Gemini", type:"모델업데이트", ci:"🤖", s:80, d:"제미나이 4 기반 Tasks 에이전트가 6개국에서 무료로 열렸다. 대화형 질의가 아니라 '맡겨 두는' 비동기 작업 방식이다.", content:"구글이 제미나이 4 기반 Tasks 에이전트를 6개국에서 무료로 개방했다(2026년 11월). Tasks의 작동 방식은 평소 쓰는 챗 인터페이스와 다르다 — 질문을 던지고 답을 기다리는 대신, 해야 할 일을 등록해 두면 에이전트가 백그라운드에서 수행하고 끝난 뒤 결과를 돌려준다. 즉 세션을 붙잡고 있을 필요가 없는 비동기 실행 모델이다. 배워 둘 점은 '무엇을 비동기로 넘길 수 있는가'의 경계다. 리서치 수집, 여러 소스 비교, 반복 점검처럼 중간 판단이 적고 결과물이 문서 형태로 떨어지는 작업은 Tasks에 맞는다. 반대로 매 단계 사람 결정이 필요한 작업(설계 선택, 톤 조정)은 비동기로 넘기면 왕복이 더 늘어난다. 무료 개방이라 실험 비용이 사실상 0이므로, 자기 업무에서 '한 번 지시하면 30분 뒤 결과만 보면 되는' 작업 목록을 먼저 뽑아 하나씩 넘겨 보면 경계를 금방 체감할 수 있다. 운영 측면에서 하나 더 — 무료 티어로 내려온 에이전트 기능은 레이트리밋과 기능 범위가 유료와 다르게 조정되는 경우가 많으니, 업무 흐름에 끼워 넣기 전에 동시 실행 가능한 작업 수와 결과 보관 기간을 확인해 두는 편이 낫다.", fresh:"aiweekly / Google", date:"2026-11-19", url:"https://aiweekly.co/"},
];

function lunarSuffix(dateStr){
  try {
    const parts = (dateStr || "").split(" ")[0].split("-").map(Number);
    if (parts.length < 3 || typeof Solar === "undefined") return "";
    const lunar = Solar.fromYmd(parts[0], parts[1], parts[2]).getLunar();
    const lm = lunar.getMonth();
    const leap = lm < 0 ? "윤" : "";
    return ` (음력 ${lunar.getYear()}년 ${leap}${Math.abs(lm)}월 ${lunar.getDay()}일)`;
  } catch(e) { return ""; }
}

fetch("./data.json?_=" + Date.now())
  .then(r => r.json())
  .then(data => {
    ITEMS = data.items || [];
    PREDICTIONS = data.predictions || [];
    document.getElementById("dateval").textContent = (data.generated_at || "-") + lunarSuffix(data.generated_at);
    const avg = ITEMS.length ? (ITEMS.reduce((a,b)=>a+b.s,0)/ITEMS.length).toFixed(1) : "0";
    document.getElementById("statline").textContent = `${ITEMS.length}건 수집 · 평균 ${avg}점 · 예측 ${PREDICTIONS.length}건`;
    renderNav();
    renderBoard();
  })
  .catch(e => {
    document.getElementById("listview").innerHTML = '<div class="empty">데이터 로드 실패: ' + e + '</div>';
  });
</script>
