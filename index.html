<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>세상의 눈 모아보기</title>
<style>
  :root {
    --foreground:#14151a; --muted-foreground:#70737c; --accent:#2f6fed;
    --border:#e7e8ec; --card:#ffffff; --bg:#f4f5f8;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background: var(--bg); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Pretendard, Roboto, sans-serif;
    color: var(--foreground);
  }
  .app { max-width: 1460px; margin: 0 auto; padding: 20px 16px 40px 16px; }

  .navbar {
    display:flex; align-items:center; justify-content:space-between;
    padding: 12px 18px; border:1px solid var(--border); border-radius: 14px;
    background: var(--card); margin-bottom: 14px;
  }
  .brand { display:flex; align-items:center; gap:10px; font-weight:800; font-size:15px; }
  .brand .logo {
    width:28px; height:28px; border-radius:8px; overflow:hidden; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
  }
  .brand .logo img { width:100%; height:100%; object-fit:cover; display:block; }
  .brand .brand-text { font-size:28px; font-weight:800; line-height:1; }
  .navtabs { display:flex; gap:18px; font-size:12.5px; color: var(--muted-foreground); flex-wrap:wrap; }
  .navtabs span { cursor:pointer; padding-bottom:2px; white-space:nowrap; }
  .navtabs .active { color: var(--foreground); font-weight:700; border-bottom:2px solid var(--accent); }
  .navright { display:flex; align-items:center; gap:10px; }
  .iconbtn {
    width:30px; height:30px; border-radius:8px; border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center; font-size:13px; color:var(--muted-foreground);
  }

  .pagehead { display:flex; justify-content:space-between; align-items:flex-end; margin: 4px 6px 14px 6px; flex-wrap:wrap; gap:10px; }
  .pagehead h1 { font-size:24px; margin:0 0 4px 0; font-weight:800; }
  .pagehead .sub { font-size:12.5px; color: var(--muted-foreground); }
  .pill {
    font-size:12px; padding:7px 14px; border-radius:9px; border:1px solid var(--border);
    background:var(--card); color:var(--foreground); display:flex; align-items:center; gap:6px;
  }

  .toolbar {
    display:flex; justify-content:space-between; align-items:center;
    margin: 0 6px 14px 6px; padding-bottom: 10px; border-bottom:1px solid var(--border);
  }
  .toolright { display:flex; gap:14px; font-size:12px; color: var(--muted-foreground); }

  .board { display:flex; gap:14px; align-items:flex-start; overflow-x:auto; padding-bottom:10px; }
  .col { width: 268px; flex-shrink:0; }
  .colhead { display:flex; align-items:center; gap:7px; padding: 4px 6px 10px 6px; font-size:13px; font-weight:700; }
  .dot { width:9px; height:9px; border-radius:50%; }
  .colcount { color: var(--muted-foreground); font-weight:600; margin-left:2px; }

  .card {
    background: var(--card); border:1px solid var(--border); border-radius:12px;
    padding:12px 13px; margin-bottom:10px; box-shadow: 0 1px 2px rgba(0,0,0,0.03);
  }
  .card-top { display:flex; align-items:center; gap:7px; margin-bottom:7px; }
  .cicon { width:20px; height:20px; border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:11px; }
  .cat-label { font-size:11px; color: var(--muted-foreground); font-weight:600; }
  .score-badge { margin-left:auto; font-size:11px; font-weight:800; padding:2px 8px; border-radius:7px; }
  .card-title { font-size:13px; font-weight:700; line-height:1.35; margin-bottom:6px; }
  .card-desc { font-size:11.5px; color: var(--muted-foreground); line-height:1.5; margin-bottom:9px;
    display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .tagrow { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px; }
  .tag { font-size:9.5px; font-weight:700; padding:3px 7px; border-radius:5px; background: var(--border); color: var(--foreground); opacity:0.85; }
  .card-foot { font-size:10.5px; color: var(--muted-foreground); display:flex; align-items:center; gap:4px; }
  .pred-card .card-desc { -webkit-line-clamp:5; }
  .conf-badge { font-size:10px; font-weight:700; padding:3px 8px; border-radius:7px; }
  .empty { padding:10px 4px; font-size:11px; color: var(--muted-foreground); }
  .footer { text-align:center; font-size:11px; color: var(--muted-foreground); margin-top:18px; }
</style>
</head>
<body>
<div class="app">

  <div class="navbar">
    <div class="brand"><div class="logo"><img src="https://raw.githubusercontent.com/EvanLee70/world-intel-board/main/logo.png" alt="세상의 눈 로고"></div><span class="brand-text">세상의 눈</span></div>
    <div class="navtabs" id="navtabs"></div>
    <div class="navright">
      <div class="iconbtn">🔄</div>
      <div class="iconbtn">☀️</div>
    </div>
  </div>

  <div class="pagehead">
    <div>
      <h1>세상의 눈 모아보기</h1>
      <div class="sub" id="subline">Bot1 수집 → Bot2 배치 → Bot3 예측, 점수 구간별 칸반 보드</div>
    </div>
    <div class="pill">📅 <span id="dateval">-</span></div>
  </div>

  <div class="toolbar">
    <div></div>
    <div class="toolright"><span id="statline"></span></div>
  </div>

  <div class="board" id="board"></div>
  <div class="footer">source: wiki/world/* · _ops/world_intel · 매일 자동 수집·배치·예측</div>
</div>

<script>
const CATEGORY_ICON = {"정치":"🏛️","경제":"📉","기술":"🤖","과학":"🧬","사회":"✊","국제":"🌐","환경":"🌍","문화":"🎬"};
const CATEGORIES = [
  {key:"전체", icon:"🗂️"}, {key:"AI소식", icon:"📰"}, {key:"정치", icon:"🏛️"}, {key:"경제", icon:"📉"},
  {key:"기술", icon:"🤖"}, {key:"과학", icon:"🧬"}, {key:"사회", icon:"✊"},
  {key:"국제", icon:"🌐"}, {key:"환경", icon:"🌍"}, {key:"문화", icon:"🎬"}, {key:"예측", icon:"🔮"},
];
const TIERS = [
  {label:"Top 점수", range:[80,100], color:"#e0565a"},
  {label:"High", range:[70,79], color:"#3f7fe0"},
  {label:"Medium", range:[60,69], color:"#e0a23f"},
  {label:"Low", range:[0,59], color:"#7a7a7a"},
];
let activeCat = "전체";
let ITEMS = [], PREDICTIONS = [];
let aiPage = 0;
const AI_PAGE_SIZE = 10;

function scoreColor(s){ if (s>=80) return "#e0565a"; if (s>=70) return "#3f7fe0"; if (s>=60) return "#e0a23f"; return "#7a7a7a"; }

function card(it){
  const col = scoreColor(it.s);
  const tag = it.url ? "a" : "div";
  const attrs = it.url ? ` href="${it.url}" target="_blank" rel="noopener" style="display:block; text-decoration:none; color:inherit; cursor:pointer;"` : "";
  return `<${tag} class="card"${attrs}>
    <div class="card-top">
      <div class="cicon" style="background:${col}22;">${it.ci || CATEGORY_ICON[it.c] || "🗂️"}</div>
      <div class="cat-label">${it.c}</div>
      <div class="score-badge" style="background:${col}22;color:${col};">${it.s}</div>
    </div>
    <div class="card-title">${it.t}</div>
    <div class="card-desc">${it.d}</div>
    <div class="tagrow"><span class="tag">${it.c}</span><span class="tag">${it.fresh || "volatile"}</span></div>
    <div class="card-foot">${it.url ? "🔗 출처로 이동" : `🕒 ${it.date || "오늘 수집"}`}</div>
  </${tag}>`;
}
function predCard(p){
  const confColor = (p.conf||"").includes("낮") ? "#7a7a7a" : "#e0a23f";
  return `<div class="card pred-card">
    <div class="card-top">
      <div class="cicon" style="background:${confColor}22;">🔮</div>
      <div class="cat-label">예측</div>
      <div class="conf-badge" style="background:${confColor}22;color:${confColor};margin-left:auto;">${p.conf}</div>
    </div>
    <div class="card-title">${p.t}</div>
    <div class="card-desc">${p.d}</div>
    <div class="tagrow"><span class="tag">연관강도 ${p.strength}</span></div>
    <div class="card-foot">🧠 Bot3 상호연관성 분석</div>
  </div>`;
}

const AI_ITEMS = [
  {t:"GPT-6 Astra, 신경망 가중치를 직접 읽고 수정해 Qwen 성능 개선", c:"연구", ci:"🤖", s:75, d:"GPT-6 Astra가 학습 루프나 경사하강법 없이 신경망 가중치를 직접 읽고 수정·작성하는 초기 실험에서, 모델 동작 식별과 가중치 공간 프로그래밍으로 Qwen 성능을 개선해 AI가 다른 AI를 직접 개조하는 사례로 주목받았다.", fresh:"GeekNews", date:"2026-11-03", url:"https://news.hada.io/topic?id=36478"},
  {t:"오픈AI, 12월부터 챗GPT·코덱스 사용량 통합…기존 앱 1월 종료", c:"산업", ci:"🤖", s:80, d:"OpenAI가 ChatGPT와 Codex의 사용량 쿼터를 하나로 통합하고 기존 Codex 앱을 1월 중 종료하기로 해, 개발자·구독자 요금 전반에 큰 영향을 주는 정책 변화다.", fresh:"AI타임스", date:"2026-11-03", url:"https://www.aitimes.com/news/articleView.html?idxno=216934"},
  {t:"르쿤, 다른 AI가 같은 세상 이해하는 조건 증명…학습 샘플 42배 절감", c:"연구", ci:"🤖", s:81, d:"얀 르쿤(Meta)이 서로 다른 AI 모델들이 같은 세상을 이해하고 있다는 조건을 수학적으로 증명하고, 이를 활용해 학습에 필요한 샘플 수를 42배 줄였다고 발표해 학계의 큰 호평을 받았다.", fresh:"AI타임스", date:"2026-11-03", url:"https://www.aitimes.com/news/articleView.html?idxno=216943"},
  {t:"엔비디아, 클라우드 고객에 중국 기업 서비스 비중 49% 이하 요구", c:"산업", ci:"🤖", s:78, d:"엔비디아가 전 세계 데이터센터·클라우드 고객사에 중국 기업 대상 서비스 비중을 49% 이하로 줄이도록 요구해, 반도체 수출통제에 따른 AI 공급망 재편 가능성이 커졌다.", fresh:"AI타임스", date:"2026-11-03", url:"https://www.aitimes.com/news/articleView.html?idxno=216969"},
  {t:"Wave Forcing: Towards Speed-of-Light Streaming Video Generation", c:"논문", ci:"🌍", s:77, d:"SJTU DENG Lab의 실시간 스트리밍 비디오생성 논문이 Hugging Face Daily Papers 최상위에 오르며, 지연시간을 광속 수준으로 줄이는 연구자 생태계에서 많은 관심을 받았다.", fresh:"HuggingFace", date:"2026-11-03", url:"https://huggingface.co/papers/2611.00859"},
  {t:"마벨, 루멘텀 154조원에 인수…AI 데이터센터 광통신 강화", c:"산업", ci:"🤖", s:73, d:"마벨 테크놀로지가 광통신 부품업체 루멘텀을 1150억달러(약 154조원)에 인수해, AI 데이터센터 광통신 인프라 경쟁이 가속될 전망이다.", fresh:"AI타임스", date:"2026-11-03", url:"https://www.aitimes.com/news/articleView.html?idxno=216952"},
  {t:"CUA-Master: Scaling Computer-use Agents through Open-World Recursive Improvements", c:"논문", ci:"🌍", s:68, d:"컴퓨터 사용 에이전트(CUA)를 오픈월드 환경에서 재귀적으로 확장하는 방법을 다룬 논문이 Hugging Face Daily Papers에 올라, 에이전트 연구 커뮤니티에서 주목받는 주제다.", fresh:"HuggingFace", date:"2026-11-03", url:"https://huggingface.co/papers/2611.03126"},
  {t:"오픈AI, 웹사이트의 AI 학습 선호 표현을 쉽게 만듦", c:"정책", ci:"🏢", s:65, d:"OpenAI가 웹사이트 운영자가 자사 콘텐츠의 AI 학습 허용 여부를 표현할 수 있는 도구를 개선해, 저작권·AI 학습 동의 관련 마찰을 줄이려는 정책적 움직임이다.", fresh:"OpenAI", date:"2026-10-30", url:"https://openai.com/index/helping-websites-express-ai-training-preferences/"},
  {t:"국가 슈퍼컴 6호기 '한강' 가동…칩 1.8만개 탑재 세계 10위권 기대", c:"인프라", ci:"🤖", s:70, d:"국가 슈퍼컴퓨터 6호기 '한강'이 GPU 1만8천개를 탑재해 12월 14일 정식 서비스를 시작하며, 전세계 상위 10위권 진입이 기대된다.", fresh:"AI타임스", date:"2026-11-03", url:"https://www.aitimes.com/news/articleView.html?idxno=216948"},
  {t:"Scaling Git at OpenAI", c:"엔지니어링", ci:"🏢", s:58, d:"OpenAI가 대규모 코드베이스를 위한 Git 인프라 확장 경험을 공개 공유해, 엔지니어링 조직에서 참고할 만한 내용이다.", fresh:"OpenAI", date:"2026-11-02", url:"https://openai.com/index/scaling-git-at-openai/"},
  {t:"구글, 1년 만에 AI 성능평가 1위 탈환…'제미나이 4 카본' 출시", c:"산업", ci:"🤖", s:86, d:"구글이 벤치마크 1위를 1년 만에 재탈환한 '제미나이 4 카본'을 공개해, 오픈AI·앤트로픽과의 모델 성능 경쟁이 다시 뜨거워졌다.", fresh:"AI타임스", date:"2026-11-03", url:"https://www.aitimes.com/news/articleView.html?idxno=216768"},
  {t:"중국 AI 거품 붕괴 가속…기술주 시총 640조 증발", c:"경제", ci:"🤖", s:84, d:"중국 AI 관련 기술주의 거품 붕괴가 가속화되며 시가총액 640조원이 증발해, AI 투자 과열에 대한 경고 신호로 해석된다.", fresh:"AI타임스", date:"2026-11-03", url:"https://www.aitimes.com/news/articleView.html?idxno=216748"},
  {t:"앤트로픽, '20배 사용량' 혼선에 요금제 개편…5시간 제한 폐지", c:"산업", ci:"🤖", s:79, d:"앤트로픽이 사용량 안내 혼선에 대응해 요금제를 개편하고 기존 5시간 사용 제한을 폐지해, Claude 구독자 경험에 직접 영향을 준다.", fresh:"AI타임스", date:"2026-11-03", url:"https://www.aitimes.com/news/articleView.html?idxno=216846"},
  {t:"딥시크, 코딩 '슈퍼 에이전트' 공개…6개월 만에 추격 기반 구축", c:"연구", ci:"🤖", s:75, d:"딥시크가 코딩 전용 슈퍼 에이전트를 공개해, 6개월이라는 짧은 기간에 선두 모델 추격 기반을 구축했다는 평가를 받는다.", fresh:"AI타임스", date:"2026-11-03", url:"https://www.aitimes.com/news/articleView.html?idxno=216865"},
  {t:"구글, 음성·실시간 편집 갖춘 월드모델 '지니 4' 공개", c:"연구", ci:"🤖", s:72, d:"구글이 음성 입력과 실시간 편집 기능을 갖춘 월드모델 '지니 4'를 공개해, 멀티모달 생성형 AI 경쟁의 새 축을 열었다.", fresh:"AI타임스", date:"2026-11-03", url:"https://www.aitimes.com/news/articleView.html?idxno=216731"}
];

function renderNav(){
  const nav = document.getElementById("navtabs");
  nav.innerHTML = CATEGORIES.map(c => `<span class="${c.key===activeCat?'active':''}" data-cat="${c.key}">${c.icon} ${c.key}</span>`).join("");
  nav.querySelectorAll("span").forEach(el => el.onclick = () => { activeCat = el.dataset.cat; renderNav(); renderBoard(); });
}

function renderBoard(){
  let html = "";
  if (activeCat === "AI소식") {
    const sorted = [...AI_ITEMS].sort((a,b)=>b.s-a.s);
    const totalPages = Math.max(1, Math.ceil(sorted.length / AI_PAGE_SIZE));
    if (aiPage > totalPages - 1) aiPage = totalPages - 1;
    if (aiPage < 0) aiPage = 0;
    const start = aiPage * AI_PAGE_SIZE;
    const pageItems = sorted.slice(start, start + AI_PAGE_SIZE);
    html = `<div class="col" style="width:100%; max-width:920px;">
      <div class="colhead"><span class="dot" style="background:#3f7fe0"></span>콘텐츠 평가 (사이트 자체는 평가 대상 아님) <span class="colcount">${sorted.length}건 중 ${start+1}-${start+pageItems.length}</span></div>
      <div style="display:grid; grid-template-columns:repeat(2,1fr); gap:10px;">${pageItems.map(card).join("")}</div>
      <div style="display:flex; justify-content:space-between; align-items:center; margin-top:10px; padding:0 2px;">
        <button id="aiPrevBtn" ${aiPage===0?'disabled':''} style="padding:6px 14px; border-radius:8px; border:1px solid var(--border); background:var(--card); color:var(--foreground); cursor:pointer; font-size:12px; opacity:${aiPage===0?'0.4':'1'};">← 이전 페이지</button>
        <span style="font-size:12px; color:var(--muted-foreground);">${aiPage+1} / ${totalPages} 페이지</span>
        <button id="aiNextBtn" ${aiPage>=totalPages-1?'disabled':''} style="padding:6px 14px; border-radius:8px; border:1px solid var(--border); background:var(--card); color:var(--foreground); cursor:pointer; font-size:12px; opacity:${aiPage>=totalPages-1?'0.4':'1'};">다음 페이지 →</button>
      </div>
    </div>`;
    document.getElementById("board").innerHTML = html;
    const prevBtn = document.getElementById("aiPrevBtn");
    const nextBtn = document.getElementById("aiNextBtn");
    if (prevBtn) prevBtn.onclick = () => { if (aiPage > 0) { aiPage--; renderBoard(); } };
    if (nextBtn) nextBtn.onclick = () => { if (aiPage < totalPages - 1) { aiPage++; renderBoard(); } };
    return;
  }
  if (activeCat === "예측") {
    html = `<div class="col" style="width:340px;">
      <div class="colhead"><span class="dot" style="background:#8a5fe0"></span>Predictions <span class="colcount">${PREDICTIONS.length}</span></div>
      ${PREDICTIONS.length ? PREDICTIONS.map(predCard).join("") : '<div class="empty">예측 없음</div>'}
    </div>`;
    document.getElementById("board").innerHTML = html;
    return;
  }
  const base = activeCat === "전체" ? ITEMS : ITEMS.filter(i => i.c === activeCat);
  TIERS.forEach(tier => {
    const items = base.filter(i => i.s >= tier.range[0] && i.s <= tier.range[1]).sort((a,b)=>b.s-a.s);
    html += `<div class="col">
      <div class="colhead"><span class="dot" style="background:${tier.color}"></span>${tier.label} <span class="colcount">${items.length}</span></div>
      ${items.length ? items.map(card).join("") : '<div class="empty">해당 구간 항목 없음</div>'}
    </div>`;
  });
  if (activeCat === "전체") {
    html += `<div class="col">
      <div class="colhead"><span class="dot" style="background:#8a5fe0"></span>Predictions <span class="colcount">${PREDICTIONS.length}</span></div>
      ${PREDICTIONS.length ? PREDICTIONS.map(predCard).join("") : '<div class="empty">예측 없음</div>'}
    </div>`;
  }
  document.getElementById("board").innerHTML = html;
}

fetch("./data.json?_=" + Date.now())
  .then(r => r.json())
  .then(data => {
    ITEMS = data.items || [];
    PREDICTIONS = data.predictions || [];
    document.getElementById("dateval").textContent = data.generated_at || "-";
    const avg = ITEMS.length ? (ITEMS.reduce((a,b)=>a+b.s,0)/ITEMS.length).toFixed(1) : "0";
    document.getElementById("statline").textContent = `${ITEMS.length}건 수집 · 평균 ${avg}점 · 예측 ${PREDICTIONS.length}건`;
    renderNav();
    renderBoard();
  })
  .catch(e => {
    document.getElementById("board").innerHTML = '<div class="empty">데이터 로드 실패: ' + e + '</div>';
  });
</script>
</body>
</html>
