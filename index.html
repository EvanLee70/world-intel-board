<style>
  :root {
    --foreground:#14151a; --muted-foreground:#70737c; --accent:#2f6fed;
    --border:#e7e8ec; --card:#ffffff; --bg:#f4f5f8;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background: var(--bg); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Pretendard, Roboto, sans-serif;
    color: var(--foreground);
  }
  .app { width:100%; margin:0; padding: 10px 8px 24px 8px; }

  .shell { display:flex; gap:10px; align-items:flex-start; }

  /* 화면 고정: 왼쪽 사이드바와 위쪽 제목·탭은 그대로, 기사 목록만 스크롤 */
  @media (min-width: 761px) {
    html, body { height:100%; overflow:hidden; }
    .app { height:100vh; height:100dvh; padding-bottom:10px; display:flex; flex-direction:column; }
    .shell { flex:1; min-height:0; align-items:stretch; }
    .sidebar { min-height:0; overflow-y:auto; scrollbar-width:thin; }
    .main { min-height:0; }
    .scrollarea { flex:1; min-height:0; overflow-y:auto; overscroll-behavior:contain; scrollbar-width:thin; padding-right:2px; }
  }

  /* ---------------- LEFT SIDEBAR ---------------- */
  .sidebar {
    width: 200px; flex-shrink:0; display:flex; flex-direction:column; gap:8px;
  }
  .brandbox {
    display:flex; align-items:center; gap:10px; padding: 14px 12px;
    border:1px solid var(--border); border-radius: 14px; background: var(--card);
  }
  .brandbox .logo {
    width:34px; height:34px; border-radius:9px; overflow:hidden; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
  }
  .brandbox .logo img { width:100%; height:100%; object-fit:cover; display:block; }
  .brandbox .brand-text { font-size:20px; font-weight:800; line-height:1.2; }

  .tiernav { display:flex; flex-direction:column; gap:6px; border:1px solid var(--border); border-radius:14px; background: var(--card); padding:6px; }
  .tierbtn {
    display:flex; align-items:center; gap:9px;
    padding:11px 10px; border-radius:10px; border:1px solid transparent;
    cursor:pointer; font-size:14px; font-weight:700;
    color: var(--muted-foreground);
  }
  .tierbtn .ticon { font-size:17px; line-height:1; }
  .tierbtn .tlabel { flex:1; }
  .tierbtn .tcount { font-size:12px; color: var(--muted-foreground); font-weight:700; }
  .tierbtn.active { color: var(--foreground); }

  .widgetbox {
    border:1px solid var(--border); border-radius:14px; background: var(--card); padding:12px;
  }
  .widgetbox .wtitle { font-size:12px; font-weight:800; color: var(--muted-foreground); margin-bottom:8px; }
  .weatherrow { display:flex; align-items:center; gap:10px; }
  .weatherrow .wicon { font-size:30px; line-height:1; }
  .weatherrow .wtemp { font-size:19px; font-weight:800; }
  .weatherrow .wdesc { font-size:12px; color: var(--muted-foreground); }

  .minical table { width:100%; border-collapse: collapse; font-size:12px; text-align:center; }
  .minical caption { font-size:13px; font-weight:800; margin-bottom:6px; text-align:left; }
  .minical th { color: var(--muted-foreground); font-weight:700; padding:3px 0; font-size:10.5px; }
  .minical td { padding:4px 0; color: var(--foreground); }
  .minical td.today { background: var(--accent); color:#fff; border-radius:7px; font-weight:800; }
  .minical td.blank { color: transparent; }

  /* ---------------- RIGHT MAIN ---------------- */
  .main { flex:1; min-width:0; display:flex; flex-direction:column; gap:8px; }

  .topbar {
    display:flex; align-items:center; justify-content:space-between;
    padding: 10px 14px; border:1px solid var(--border); border-radius: 14px; background: var(--card);
  }
  .topbar h1 { font-size:22px; margin:0; font-weight:800; }
  .topbar .sub { font-size:13px; color: var(--muted-foreground); margin-top:2px; }
  .pill {
    font-size:14px; padding:8px 16px; border-radius:9px; border:1px solid var(--border);
    background: var(--bg); color: var(--foreground); display:flex; align-items:center; gap:6px; font-weight:700;
  }

  .navrow {
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;
    padding: 10px 14px; border:1px solid var(--border); border-radius: 14px; background: var(--card);
  }
  .navtabs { display:flex; gap:16px; font-size:15px; color: var(--muted-foreground); flex-wrap:wrap; }
  .navtabs span { cursor:pointer; padding-bottom:3px; white-space:nowrap; }
  .navtabs .active { color: var(--foreground); font-weight:800; border-bottom:2px solid var(--accent); }
  .toolright { font-size:14px; color: var(--muted-foreground); white-space:nowrap; }

  .listview { display:flex; flex-direction:column; gap:10px; }
  .listhead { font-size:15px; font-weight:700; color: var(--muted-foreground); padding: 2px 4px; }
  .listrow {
    display:block; text-decoration:none; color:inherit; cursor:pointer;
    background: var(--card); border:1px solid var(--border); border-radius:12px;
    padding:16px 18px; box-shadow: 0 1px 2px rgba(0,0,0,0.03);
  }
  .lr-1 { font-size:17px; font-weight:800; line-height:1.4; }
  .lr-top { display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:6px; }
  .lr-top .score-badge { flex-shrink:0; font-size:13px; font-weight:800; padding:3px 11px; border-radius:7px; }
  .lr-2 { display:flex; align-items:center; gap:7px; flex-wrap:wrap; font-size:13px; color: var(--muted-foreground); font-weight:600; margin-bottom:8px; }
  .lr-2 .lr-5 { margin-left:auto; }
  .lr-3 { font-size:15px; color: var(--foreground); opacity:0.85; line-height:1.55;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .tag { font-size:11px; font-weight:700; padding:4px 8px; border-radius:5px; background: var(--border); color: var(--foreground); opacity:0.85; }
  .lr-5 { font-size:13px; color: var(--muted-foreground); white-space:nowrap; }
  .conf-badge { font-size:12px; font-weight:700; padding:4px 10px; border-radius:7px; }

  .pager { display:flex; justify-content:space-between; align-items:center; margin-top:4px; padding:0 2px; }
  .pagerbtn {
    padding:7px 16px; border-radius:8px; border:1px solid var(--border);
    background:var(--card); color:var(--foreground); cursor:pointer; font-size:14px;
  }
  .pagerlabel { font-size:14px; color: var(--muted-foreground); }

  .empty { padding:16px 4px; font-size:14px; color: var(--muted-foreground); }
  .footer { text-align:center; font-size:13px; color: var(--muted-foreground); margin-top:14px; }
</style>
</head>
<body>

<script>
const CATEGORY_ICON = {"정치":"🏛️","경제":"📉","기술":"🤖","과학":"🧬","사회":"✊","국제":"🌐","환경":"🌍","문화":"🎬"};
const CATEGORIES = [
  {key:"전체", icon:"🗂️"}, {key:"AI소식", icon:"📰"}, {key:"정치", icon:"🏛️"}, {key:"경제", icon:"📉"},
  {key:"기술", icon:"🤖"}, {key:"과학", icon:"🧬"}, {key:"사회", icon:"✊"},
  {key:"국제", icon:"🌐"}, {key:"환경", icon:"🌍"}, {key:"문화", icon:"🎬"},
];
const TIERS = [
  {label:"Top점수", range:[80,100], color:"#e0565a", icon:"🔴"},
  {label:"High",    range:[70,79],  color:"#3f7fe0", icon:"🔵"},
  {label:"Medium",  range:[60,69],  color:"#e0a23f", icon:"🟡"},
  {label:"Low",     range:[0,59],   color:"#7a7a7a", icon:"⚪"},
];
const PRED_TIER = {label:"예측", color:"#8a5fe0", icon:"🔮"};

let activeCat = "전체";
let activeTier = "Top점수";
let ITEMS = [], PREDICTIONS = [];
let listPage = 0;
const PAGE_SIZE = 10;

function scoreColor(s){ if (s>=80) return "#e0565a"; if (s>=70) return "#3f7fe0"; if (s>=60) return "#e0a23f"; return "#7a7a7a"; }

function markRead(id){
  try {
    if (!id) return;
    const url = "/api/mark-read?id=" + encodeURIComponent(id);
    if (navigator.sendBeacon) { navigator.sendBeacon(url); }
    else { fetch(url, { keepalive: true }).catch(() => {}); }
  } catch(e) {}
}

function listRowItem(it){
  const col = scoreColor(it.s);
  const tag = it.url ? "a" : "div";
  const clickAttr = it.url && it.id ? ` onclick="markRead('${it.id}')"` : "";
  const attrs = it.url ? ` href="${it.url}" target="_blank" rel="noopener"${clickAttr}` : "";
  return `<${tag} class="listrow"${attrs}>
    <div class="lr-top">
      <div class="lr-1">${it.t}</div>
      <span class="score-badge" style="background:${col}22;color:${col};">${it.s}</span>
    </div>
    <div class="lr-2">
      <span>${it.ci || CATEGORY_ICON[it.c] || "🗂️"}</span><span>${it.c}</span>
      <span class="tag">${it.c}</span><span class="tag">${it.fresh || "volatile"}</span>
      <span class="lr-5">${it.url ? "🔗 출처로 이동" : `🕒 ${it.date || "오늘 수집"}`}</span>
    </div>
    <div class="lr-3">${it.d}</div>
  </${tag}>`;
}

function listRowPrediction(p){
  return `<div class="listrow">
    <div class="lr-1">${p.t}</div>
    <div class="lr-2"><span>🔮</span><span>예측</span></div>
    <div class="lr-3" style="-webkit-line-clamp:unset;">${p.d}</div>
  </div>`;
}

function renderNav(){
  const nav = document.getElementById("navtabs");
  nav.innerHTML = CATEGORIES.map(c => `<span class="${c.key===activeCat?'active':''}" data-cat="${c.key}">${c.icon} ${c.key}</span>`).join("");
  nav.querySelectorAll("span").forEach(el => el.onclick = () => {
    activeCat = el.dataset.cat; listPage = 0; renderNav(); renderBoard();
  });
}

function tierCount(tierKey){
  if (tierKey === "예측") return PREDICTIONS.length;
  const base = activeCat === "AI소식" ? AI_ITEMS : (activeCat === "전체" ? ITEMS : ITEMS.filter(i => i.c === activeCat));
  const t = TIERS.find(x => x.label === tierKey);
  return base.filter(i => i.s >= t.range[0] && i.s <= t.range[1]).length;
}

function renderTierSidebar(){
  const all = [...TIERS, PRED_TIER];
  const bar = document.getElementById("tiersidebar");
  bar.innerHTML = all.map(t => `<div class="tierbtn ${activeTier===t.label?'active':''}" data-tier="${t.label}"
      style="${activeTier===t.label ? `border-color:${t.color}; background:${t.color}1a;` : ''}">
      <div class="ticon">${t.icon}</div>
      <div class="tlabel">${t.label}</div>
      <div class="tcount" style="${activeTier===t.label?`color:${t.color};`:''}">${tierCount(t.label)}</div>
    </div>`).join("");
  bar.querySelectorAll(".tierbtn").forEach(el => el.onclick = () => {
    activeTier = el.dataset.tier; listPage = 0; renderTierSidebar(); renderBoard();
  });
}

function renderPager(total, totalPages, start, shown){
  return `<div class="pager">
    <button class="pagerbtn" id="prevBtn" ${listPage===0?'disabled':''} style="opacity:${listPage===0?'0.4':'1'};">← 이전 페이지</button>
    <span class="pagerlabel">${total}건 중 ${start+1}-${start+shown} · ${listPage+1} / ${totalPages} 페이지</span>
    <button class="pagerbtn" id="nextBtn" ${listPage>=totalPages-1?'disabled':''} style="opacity:${listPage>=totalPages-1?'0.4':'1'};">다음 페이지 →</button>
  </div>`;
}

function wirePager(totalPages){
  const prevBtn = document.getElementById("prevBtn");
  const nextBtn = document.getElementById("nextBtn");
  if (prevBtn) prevBtn.onclick = () => { if (listPage > 0) { listPage--; renderBoard(); } };
  if (nextBtn) nextBtn.onclick = () => { if (listPage < totalPages - 1) { listPage++; renderBoard(); } };
}

function renderBoard(){
  const sa = document.getElementById("scrollarea"); if (sa) sa.scrollTop = 0;
  renderTierSidebar();
  const view = document.getElementById("listview");
  let sorted, rowFn, label;

  if (activeTier === "예측") {
    sorted = [...PREDICTIONS];
    rowFn = listRowPrediction;
    label = "예측 (Bot3 상호연관성 분석)";
  } else {
    const base = activeCat === "AI소식" ? AI_ITEMS : (activeCat === "전체" ? ITEMS : ITEMS.filter(i => i.c === activeCat));
    const t = TIERS.find(x => x.label === activeTier);
    sorted = base.filter(i => i.s >= t.range[0] && i.s <= t.range[1]).sort((a,b) => b.s - a.s);
    rowFn = listRowItem;
    label = activeCat === "AI소식" ? `${activeTier} · 콘텐츠 평가 (사이트 자체는 평가 대상 아님)` : `${activeTier} 점수 구간 · ${activeCat}`;
  }

  const totalPages = Math.max(1, Math.ceil(sorted.length / PAGE_SIZE));
  if (listPage > totalPages - 1) listPage = totalPages - 1;
  if (listPage < 0) listPage = 0;
  const start = listPage * PAGE_SIZE;
  const pageItems = sorted.slice(start, start + PAGE_SIZE);

  view.innerHTML = `
    <div class="listhead">${label}</div>
    ${pageItems.length ? pageItems.map(rowFn).join("") : '<div class="empty">해당 구간에 항목이 없습니다</div>'}
    ${sorted.length ? renderPager(sorted.length, totalPages, start, pageItems.length) : ""}
  `;
  wirePager(totalPages);
}

function renderMiniCalendar(){
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth(), today = now.getDate();
  const first = new Date(y, m, 1);
  const startDow = first.getDay();
  const daysInMonth = new Date(y, m + 1, 0).getDate();
  const monthNames = ["1월","2월","3월","4월","5월","6월","7월","8월","9월","10월","11월","12월"];
  let cells = [];
  for (let i = 0; i < startDow; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);
  while (cells.length % 7 !== 0) cells.push(null);
  let rows = "";
  for (let r = 0; r < cells.length; r += 7) {
    rows += "<tr>" + cells.slice(r, r + 7).map(d => {
      if (d === null) return '<td class="blank">·</td>';
      return `<td class="${d === today ? 'today' : ''}">${d}</td>`;
    }).join("") + "</tr>";
  }
  document.getElementById("minical").innerHTML = `
    <table>
      <caption>${y}년 ${monthNames[m]}</caption>
      <thead><tr><th>일</th><th>월</th><th>화</th><th>수</th><th>목</th><th>금</th><th>토</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}
renderMiniCalendar();

const WMO_MAP = {
  0:{icon:"☀️",desc:"맑음"}, 1:{icon:"🌤️",desc:"대체로 맑음"}, 2:{icon:"⛅",desc:"부분 흐림"}, 3:{icon:"☁️",desc:"흐림"},
  45:{icon:"🌫️",desc:"안개"}, 48:{icon:"🌫️",desc:"서리 안개"},
  51:{icon:"🌦️",desc:"가벼운 이슬비"}, 53:{icon:"🌦️",desc:"이슬비"}, 55:{icon:"🌦️",desc:"강한 이슬비"},
  61:{icon:"🌧️",desc:"가벼운 비"}, 63:{icon:"🌧️",desc:"비"}, 65:{icon:"🌧️",desc:"강한 비"},
  71:{icon:"🌨️",desc:"가벼운 눈"}, 73:{icon:"🌨️",desc:"눈"}, 75:{icon:"🌨️",desc:"강한 눈"},
  80:{icon:"🌦️",desc:"소나기"}, 81:{icon:"🌦️",desc:"강한 소나기"}, 82:{icon:"🌦️",desc:"매우 강한 소나기"},
  95:{icon:"⛈️",desc:"뇌우"}, 96:{icon:"⛈️",desc:"우박 동반 뇌우"}, 99:{icon:"⛈️",desc:"강한 우박 뇌우"},
};
fetch("https://api.open-meteo.com/v1/forecast?latitude=-6.2088&longitude=106.8456&current_weather=true")
  .then(r => r.json())
  .then(d => {
    const cw = d.current_weather;
    const info = WMO_MAP[cw.weathercode] || {icon:"🌍", desc:"정보없음"};
    document.getElementById("jakartaTemp").textContent = Math.round(cw.temperature) + "°C";
    document.getElementById("jakartaIcon").textContent = info.icon;
    document.getElementById("jakartaDesc").textContent = info.desc;
  })
  .catch(() => {
    document.getElementById("jakartaDesc").textContent = "날씨 로드 실패";
  });

const AI_ITEMS = [
  {t:"오픈AI '내셔널 커뮤니티 컴팩트' 발표…자사 소유·운영 데이터센터의 전력·계통 인프라 비용 전액 부담, 공직자 NDA 중단", c:"산업", ci:"🤖", s:91, d:"오픈AI가 11월 5일 데이터센터 개발 관련 자율 규범을 발표했다. ①자사가 소유·운영하는 모든 데이터센터에서 전기요금과 필요 인프라 비용을 전액 부담해 인근 주민의 요금 인상을 막는다 ②피크 수요 시 전력 사용을 줄이고 계통으로 전력을 되돌린다 ③공직자와의 NDA를 중단한다(보안·영업비밀·경쟁상 민감 정보만 예외) ④부지계획·소음 조사·예상 용수 수요를 주민에게 직접 공개한다. CNBC는 10개 주 주민투표 41건 중 40건에서 데이터센터 제한이 가결된 직후 나온 선언이라고 보도했다. 적용 범위는 '향후 소유·운영하는 캠퍼스'로 한정돼, 임차·위탁 구조에는 닿지 않는다.", fresh:"CNBC·FourWeekMBA·AndroidHeadlines", date:"2026-11-05", url:"https://www.androidheadlines.com/2026/11/openai-data-center-policy-community-compact.html"},
  {t:"애플, 직원 AI 사용 예산 최대 3분의 2 삭감 추진…엔지니어 일 300→200달러, 기타 부서는 100→25달러 검토", c:"산업", ci:"🤖", s:90, d:"블룸버그 11월 4일 보도. 애플이 AI 도입을 확대하면서도 직원 1인당 모델 사용 한도를 내리고 있다. 테슬라는 주당 200달러, 우버는 도구별 월 1,500달러, 메타는 토큰 예산을 도입했고 마이크로소프트도 사내 예산을 조정했다. 애플 FY2026 R&D는 32%, 영업비용은 22% 증가해 755억 달러였다 — 총액은 늘리고 좌석당 변동비에는 상한을 거는 구조다.", fresh:"AI타임스", date:"2026-11-05", url:"https://www.aitimes.com/news/articleView.html?idxno=217054"},
  {t:"중국 AI 거품 붕괴 가속…기술주 시총 640조 증발", c:"경제", ci:"🤖", s:89, d:"중국 AI 관련 기술주의 거품 붕괴가 가속화되며 시가총액 640조원이 증발해, AI 투자 과열에 대한 경고 신호로 해석된다.", fresh:"AI타임스", date:"2026-11-03", url:"https://www.aitimes.com/news/articleView.html?idxno=216748"},
  {t:"엔비디아 H200 약 60만 장이 홍콩 창고에 묶였다…바이트댄스·텐센트 각 1만 장만 본토 반입, 베이징이 SMIC·화훙·캄브리콘 시간을 벌고 있다", c:"산업", ci:"🤖", s:88, d:"로이터 11월 5일 보도. H200 약 60만 장이 본토 수입 승인을 기다리며 홍콩에 보관돼 있다. 바이트댄스·텐센트가 최근 각 1만 장씩 받은 것이 첫 유의미한 본토 반입인데, 규제당국이 나머지 대부분은 홍콩에 두라고 지시했다. 베이징은 기업에 중국산 칩을 쓰도록 밀면서 대규모 수입을 승인하지 않고 있고, 보도는 승인 시점 조절이 SMIC·화훙·캄브리콘에 시간을 벌어주는 수단이라고 해석했다. 결정적 사실은 홍콩에 이 칩을 켤 데이터센터 용량이 없다는 것 — 즉 60만 장은 중국의 가용 연산량에 당장 더해지지 않는다. 보유 칩 수와 가동 칩 수를 구분해야 한다.", fresh:"Reuters(Benzinga·TheNextWeb 전재)·AI타임스", date:"2026-11-05", url:"https://www.benzinga.com/markets/tech/26/11/62919241/chinas-nvidia-h200-bottleneck-deepens-600000-chips-reportedly-await-approval-in-hong-kong-as-servers-fetch-nearly-1-million-each"},
  {t:"IREN, 2026년 예정 ARR 40억 달러 이상이 '최소 1월로' 연기…공동CEO가 실적 콜에서 지연 요청 고객을 마이크로소프트로 특정", c:"산업", ci:"🤖", s:87, d:"11월 5일 마감 후 1분기 실적. AI 클라우드 매출은 7,100만 → 2억 달러로 두 배 이상 늘었는데, 같은 공시에 2026년 예정 ARR 40억 달러 이상이 '최소 1월로' 밀렸다는 내용이 들어 있다. 실적 콜에서 공동CEO 대니얼 로버츠가 그 고객을 마이크로소프트로 밝혔다. 마이크로소프트의 네오클라우드 재검토가 익명 보도 수준이 아니라 이미 실현된 매출 인식 지연임이 거래 상대방 쪽에서 확인된 첫 자료다. 시장은 호재로 받아 IREN이 장중 +20% 올랐으나 호재와 악재가 한 문서에 있고 주가는 한쪽만 반영했다. '최소'라는 하한만 있어 이연이 취소로 바뀔 경로는 열려 있고, 1월이 1차 검증 시점이다.", fresh:"CNBC·Yahoo Finance·Seeking Alpha", date:"2026-11-05", url:"https://www.cnbc.com/2026/11/05/iren-earnings-report-q1-2027-.html"},
  {t:"일본, 미국 AI 기업에 미공개 소프트웨어 취약점 정보 공유 요청…이르면 11월 6일 관계장관회의서 긴급 대책 발표", c:"정책", ci:"🤖", s:87, d:"일본 정부가 미 주요 AI·기술기업이 확보한 미공개 취약점 정보를 사전 공유받아 정부기관과 전력·통신 등 핵심 인프라가 대비할 시간을 확보하려 한다. 수집은 국가사이버통괄실(NCO)이 맡는다. 일본 정부와 일부 기업·금융기관은 이미 앤트로픽 고성능 모델 '클로드 미토스' 접근권을 확보했다.", fresh:"AI타임스", date:"2026-11-05", url:"https://www.aitimes.com/news/articleView.html?idxno=217064"},
  {t:"구글, 테라울프의 앤트로픽 190억 달러 임대차에 신용보강…401MW·20년, 기간 중 '구글 승인 TPU' 사용 구속 조항", c:"산업", ci:"🤖", s:86, d:"테라울프(WULF)가 11월 4일 공시했다. 켄터키 호즈빌 캠퍼스 약 401MW를 대상으로 한 약 190억 달러·20년 임대차의 부채조달을 구글이 신용보강 3건으로 뒷받침한다. 앤트로픽 디폴트 시 구글이 임대료를 지급하고 임차인으로 승계하거나 해지수수료를 낸다. 대가로 계약은 기간 중 앤트로픽이 구글 승인 TPU 가속기를 쓰도록 구속한다. 보강은 각 임대차의 마지막 데이터홀 가동 시점에 개시되고, 앤트로픽이 투자등급을 3개월 이상 유지하면 종료된다. 플루어와 EPC 계약 확정, 초기 용량은 2027년 하반기 가동 예정. 신용보강과 가속기 점유율의 교환 구조다.", fresh:"Reuters·GuruFocus·TheTechCapital", date:"2026-11-04", url:"https://www.gurufocus.com/news/9170433/terawulf-wulf-secures-19b-credit-support-from-google-for-anthropic-lease-financing"},
  {t:"캔바, AI에 밀려 10년 만에 성장세 둔화…인력 22%(1,271명) 해고·전환·이전 발표", c:"산업", ci:"🤖", s:86, d:"CEO 멜라니 퍼킨스가 11월 3일 발표. 8월에 이미 2026년 매출 성장 전망을 30%→20%로 내렸고, 자체 AI 모델로 갈아탔어도 급증하는 서빙 비용을 감당하지 못했다. 챗GPT·제미나이의 이미지 생성이 포스터·프레젠테이션 수요를 흡수한 수요 측 압력도 함께 작용했다 — AI 비용과 AI 경쟁이 동시에 SaaS 마진을 때린 첫 대형 수치 사례다.", fresh:"AI타임스", date:"2026-11-05", url:"https://www.aitimes.com/news/articleView.html?idxno=217055"},
  {t:"메타 사장 디나 파월 맥코믹 \"중간선거 뒤 미국 신규 데이터센터 착수는 더 어려워진다\"…5개 주 당선 주지사가 중단 공약, 계획 용량의 41%", c:"정책", ci:"🤖", s:85, d:"WSJ 테크 콘퍼런스 발언. 오하이오·조지아·미시간·뉴멕시코·텍사스 당선 주지사가 주 전역 건설 중단·유예를 공약했고 뉴욕·오리건은 기존 유예 연장을 공약했다. 클린뷰 집계로 이들 주가 미국 파이프라인 계획 용량의 41%를 보유한다(블룸버그는 '약 40%', 별도 집계는 158.6GW 위험 노출). 메타 자신도 루이지애나(하이페리온)·오하이오(프로메테우스)·텍사스(블랙록 공동)에 건설 중 프로젝트가 있고 오하이오·텍사스 신임 주지사가 조건부 중단을 요구해 왔다. 가치는 새 수치가 아니라 하이퍼스케일러 본인이 공개 석상에서 이를 자기 사업 제약으로 인정했다는 점이다. 제약이 '신규 착수'로 한정돼 확정 수주 보유 쪽과 파이프라인 보유 쪽이 갈린다. 주의 — AI타임스는 이를 '메타, 미국 데이터센터 건설 중단'으로 제목을 달았으나 원보도에 메타가 건설을 중단했다는 내용은 없다.", fresh:"TechCrunch·qz·Bloomberg(AI타임스 제목은 과장)", date:"2026-11-05", url:"https://techcrunch.com/2026/11/05/metas-warns-that-election-backlash-against-data-centers-could-make-ai-expansion-harder"},
  {t:"엔비디아, 브라이트스피드 노후 통신국사를 소형 AI 추론 데이터센터로 전환 제안…130곳 이상·최대 20개 주·가용전력 약 1GW", c:"산업", ci:"🤖", s:85, d:"차이롄사 11월 6일 보도. 엔비디아가 미국 광대역 사업자 브라이트스피드에 노후 통신국사 '일부'를 소형 AI 데이터센터로 개조하는 서면 제안을 냈다. 브라이트스피드는 통신장비가 들어 있는 건물을 130곳 이상 운영하고, 엔비디아는 합산 가용 전력을 약 1GW로 추산했다. 용도는 학습이 아니라 추론이며, 분산된 소형 시설이 요청 처리를 분담하는 구조다. 다만 1GW는 가용 전력일 뿐 가동 용량이 아니고, 계약·부지 선정은 없는 제안 단계이며 엔비디아·브라이트스피드 공식 입장도 없다. 중간선거 이후 신축 규제 강화에 대한 대응 성격으로 보도됐다.", fresh:"AI타임스·TokenPost(차이롄사 원보도)", date:"2026-11-06", url:"https://www.tokenpost.kr/news/ai/433984"},
  {t:"인텔 주가 한 달 45% 폭락…AI 투자 수익성 우려에 반도체주 동반 급락", c:"경제", ci:"🤖", s:85, d:"인텔이 PC 시장 둔화와 실적 쇼크로 52년 만의 최대 폭락을 겪으며 하루 시가총액 140조원 이상이 증발했고, 퀄컴·AMD·ARM·브로드컴·마이크론·엔비디아 등 반도체주가 동반 급락해 AI 투자 수익성에 대한 시장 우려가 커졌다.", fresh:"GeekNews", date:"2026-11-03", url:"https://news.hada.io/topic?id=36508"},
  {t:"애질리티 로보틱스, 나스닥 'AGLT' 상장…미국 첫 순수 휴머노이드 상장사, 기업가치 25억 달러·폭스콘 주도 PIPE 2억 100만 달러", c:"산업", ci:"🤖", s:84, d:"11월 5일 처칠캐피탈 코프 XI와 SPAC 합병으로 거래 개시. 기업가치 약 25억 달러, 보유 현금 약 4억 6,500만 달러(폭스콘 주도 PIPE 2억 100만 달러 포함). 주력은 휴머노이드 '디짓'이고 디짓5 다년 수주 3억 달러 이상을 제시했다. 다른 투자자는 엔비디아·아마존·소프트뱅크 비전펀드 2. 의미는 휴머노이드 섹터에 처음 공개시장 가격표가 붙었다는 것 — '상업 배치 + 수주 3억 달러 = 25억 달러'라는 비교 기준이 생겼다. 다만 다년 수주여서 기간 미공개로 연율 환산이 불가능하므로 8배를 매출 배수로 쓰면 틀린다. 투자자 구성이 연산(엔비디아)–제조(폭스콘)–수요(아마존)를 한 줄로 꿰는 점이 병목의 이동을 보여준다. SPAC 경로여서 25억 달러는 기관 수요로 검증된 가격이 아니고 수익성은 미해결이다.", fresh:"Agility Robotics IR·Bloomberg·TechCrunch", date:"2026-11-05", url:"https://investors.agilityrobotics.com/news-releases/news-release-details/agility-becomes-first-us-publicly-listed-pure-play-humanoid"},
  {t:"[11월5일] 주민투표 '39대 1'…미국 유권자들, AI 데이터센터에 압도적 반대", c:"정책", ci:"🤖", s:84, d:"AI타임스 뉴스 브리핑. 미 중간선거와 함께 치러진 지역 주민투표에서 AI 데이터센터 관련 안건이 사실상 전패했다. 같은 집계를 CNBC는 '10개 주 41건 중 40건', AI타임스는 '39대 1'로 적어 총건수 표기가 엇갈린다. 이 결과가 오픈AI의 커뮤니티 컴팩트, 샌더스의 전국 모라토리엄 재추진, 전력·EPC 종목 재가격의 공통 방아쇠다.", fresh:"AI타임스", date:"2026-11-05", url:"https://www.aitimes.com/news/articleView.html?idxno=217042"},
  {t:"앤트로픽 'FlashProve' 공개…zkSNARK로 '이 응답이 사전 지정 모델에서 나왔는가'를 가중치 비공개로 증명, 400B 모델 연산을 19MB 증명으로", c:"산업", ci:"🤖", s:84, d:"모델 제공자가 오프라인에서 가중치를 공개하지 않고 암호학적 지문(커밋먼트)을 만들고, 요청마다 '커밋된 모델을 돌렸다면 이 출력이 나온다'는 증명 파일을 생성한다. 사용자는 커밋먼트·프롬프트·응답만으로 CPU에서 수초 내 검증한다. 4비트 Llama 4 Maverick(400B)에서 H100 1장 기준 약 110토큰/초이며 일반 추론보다 70~95배 느리다. 저가 모델로 몰래 바꿔치기하는 행위 탐지, 출시 전후 평가 동일성 확인, 규제 준수 입증이 용도다.", fresh:"GeekNews", date:"2026-11-05", url:"https://news.hada.io/topic?id=36617"},
  {t:"오픈AI, 일상 업무 벤치마크 '라이프밸(LifeVal)' 공개…개인 비서 성능 1년 새 49%→81%, 다만 최근 개선 둔화 신호", c:"산업", ci:"🤖", s:84, d:"오픈AI가 육아·건강·재무·장보기 등 실생활 과제를 평가하는 LifeVal을 공개했다. 미국·다국가 시간사용조사와 3,995명 인구통계 설문으로 '사람들이 비서에게 가장 맡기고 싶은 영역'을 추출해 설계했고, 최신 모델 점수가 1년 만에 49%→81%로 올랐으나 최근 개선 폭이 둔화하는 신호가 함께 나타났다.", fresh:"AI타임스", date:"2026-11-05", url:"https://www.aitimes.com/news/articleView.html?idxno=216996"},
  {t:"미 민주당 압승에 빅테크 주가 급등…'데이터센터 규제'를 호재로 해석", c:"산업", ci:"🤖", s:84, d:"민주당의 양원 장악으로 AI 데이터센터 규제가 강화되면 자본지출 부담이 줄어 기존 강자에게 유리하다는 해석이 나와 빅테크가 올랐다. 같은 세션에 필라델피아 반도체지수는 3%대 하락해, 'AI 규제'가 섹터를 균일하게 때리지 않고 플랫폼과 인프라 공급 측을 반대로 가른다는 점이 드러났다.", fresh:"AI타임스", date:"2026-11-05", url:"https://www.aitimes.com/news/articleList.html?view_type=sm"},
  {t:"레볼루트, 엔지니어 2,000명을 자체호스팅 GLM 5.3으로 이전…B200 56장으로 100만 토큰당 0.30달러, 프런티어 API 대비 10분의 1 주장", c:"산업", ci:"🤖", s:83, d:"코딩 기본값을 클로드 코드·코덱스에서 자체호스팅 오픈웨이트 모델(약 8,000억 파라미터)로 바꿨고 프런티어 도구는 예외로만 남겼다. 중국산 오픈웨이트 모델이 규제 산업의 대규모 프로덕션에서 프런티어 API를 대체한 첫 공개 사례로 보인다. 단 수치는 전부 회사 임원의 컨퍼런스 발표값이고 B200 감가상각·전력비 포함 여부가 불명확해 배수는 그대로 쓰지 않는 편이 안전하다.", fresh:"RuntimeWire·FourWeekMBA", date:"2026-11-05", url:"https://runtimewire.com/article/revolut-self-hosted-glm-coding-costs"},
  {t:"Kimi K3.1 Pro 가중치 공개…1.56TB·96개 샤드, 터미널벤치 4.0 65.7%로 오푸스 5.5(66.4%) 턱밑", c:"산업", ci:"🤖", s:83, d:"문샷AI가 예정일(11월 4일)대로 킴K3.1 프로 가중치를 허깅페이스에 공개했다. 2.8조 총 파라미터 중 104B 활성·100만 토큰 컨텍스트이며, 1.56TB·96개 safetensors 샤드에 2,000만 달러 라이선스 조항이 붙어 '공개'의 실질 수혜자가 추론 인프라 보유 사업자로 좁혀진다.", fresh:"GeekNews", date:"2026-11-05", url:"https://news.hada.io/"},
  {t:"아이온큐 3분기 매출 1억 7,380만 달러(+336%)·RPO 4억 8,500만→6억 8,900만 달러…엔비디아가 자사 양자연구센터에 수페리온 256을 첫 온프레미스로 배치", c:"산업", ci:"🤖", s:82, d:"11월 6일 발표. 6개 분기 연속 최대 매출이고 컨센서스 1억 4,163만 달러를 크게 상회, 연간 가이던스를 4억 5,000만~4억 6,000만에서 5억 500만~5억 1,500만 달러로 올렸다. 수주잔고 12억 달러. 가장 중요한 항목은 매출 성장률이 아니라 RPO다 — 한 분기에 약 42% 늘어 가이던스 상향의 근거가 전망이 아니라 계약서에 있음을 보여준다. 엔비디아가 가속양자연구센터에 수페리온 256을 첫 온프레미스 양자컴퓨터로 들여놓고 자사 AI 슈퍼컴퓨팅 인프라에 직접 연결한다는 점은 납품 모델이 클라우드 접근에서 설비 설치로 바뀌는 신호다. 다만 엔비디아 건의 계약 금액이 비공개여서 레퍼런스 가치와 매출 기여를 섞어 읽으면 안 된다.", fresh:"IonQ 보도자료·SEC 8-K·Benzinga", date:"2026-11-06", url:"https://www.ionq.com/news/ionq-announces-record-3q26-revenues-and-raises-fy2026-guidance-to-505---515-million-as-backlog-grows-to-1-2-billion"},
  {t:"AMD, 4분기 매출 23조 전망…창사 이후 처음 인텔 추월 가능성, 인텔 가이던스는 150~160억 달러", c:"경제", ci:"🤖", s:82, d:"AMD의 4분기 가이던스(약 170억 달러)가 인텔이 제시한 150~160억 달러를 웃돌아 창사 이후 처음으로 분기 매출에서 인텔을 넘어설 가능성이 제기됐다. 데이터센터 부문 97% 급증이 배경이며, 두 회사의 역전은 x86 진영 내 자본배분 우선순위가 바뀌는 신호로 읽힌다.", fresh:"AI타임스", date:"2026-11-05", url:"https://www.aitimes.com/news/articleView.html?idxno=217047"},
  {t:"엔비디아, 클라우드 고객에 중국 기업 서비스 비중 49% 이하 요구", c:"산업", ci:"🤖", s:82, d:"엔비디아가 전 세계 데이터센터·클라우드 고객사에 중국 기업 대상 서비스 비중을 49% 이하로 줄이도록 요구해, 반도체 수출통제에 따른 AI 공급망 재편 가능성이 커졌다.", fresh:"AI타임스", date:"2026-11-03", url:"https://www.aitimes.com/news/articleView.html?idxno=216969"},
  {t:"구글, 커프 캘리브레이션 없는 스마트워치 고혈압 탐지 네이처 게재…민감도 65.8%·특이도 90.0%·PPV 80.6%, 표본 196명", c:"기술", ci:"🤖", s:81, d:"PPG(광용적맥파)와 가속도계 파형에 AI를 적용해 커프 캘리브레이션 없이 고혈압 징후를 수동적으로 탐지하는 시스템이 11월 5일 네이처에 게재됐다(s41586-026-11336-3). 미국 5개 사이트·참가자 196명 전향적 다기관 연구이고, 24시간 활동혈압측정(ABPM)을 기준으로 민감도 65.8%·특이도 90.0%·양성예측도 80.6%를 기록했다. '양성이면 믿을 만하지만 음성이라고 안심할 수 없는' 비대칭이어서 용도는 진단이 아니라 선별·알림에 가깝다. 규제 승인·기기 탑재 일정은 언급되지 않았다.", fresh:"Nature·Google Research 블로그", date:"2026-11-05", url:"https://www.nature.com/articles/s41586-026-11336-3"},
  {t:"구글, K-12 학생 계정에서 제미나이·검색 기본 차단…석 달 전 기본 활성화 결정을 스스로 뒤집었다", c:"산업", ci:"🤖", s:81, d:"제미나이·제미나이 노트북·클래스룸 내 제미나이·구글 검색이 학교 관리 K-12 계정에서 전면 꺼짐으로 바뀌어 관리자가 개별로 켜야 쓸 수 있다. 8월에 클래스룸 챗봇을 기본 활성화해 비판받은 뒤 나온 역전이며, 모델 성능이 아니라 '기본값'이라는 배포 변수가 외부 압력으로 뒤집힌 사례다.", fresh:"AI타임스", date:"2026-11-05", url:"https://en.sedaily.com/international/2026/11/05/google-turns-off-gemini-by-default-in-us-schools-but-not-ai"},
  {t:"클라우드플레어·IREN 실적이 AI 클라우드 반등을 촉발…NET +12.5~20%·IREN +20%·코어위브 +10%, 그러나 10월 고점 대비 세 종목 모두 -39%대", c:"산업", ci:"🤖", s:80, d:"11월 6일 장중. 11월 5일 급락은 데이터센터 규제·AI 자본지출이라는 매크로·정치 요인이었는데 11월 6일 반등은 개별 기업 실적이 트리거였다 — '실적이 가격을 되돌릴 수 있다'가 확인된 세션이다. 애널리스트는 전일 매도를 '반사적 반응이고 펀더멘털 리셋이 아니다'라고 평가했다. 다만 10월 최고 종가 대비 IREN -39.1%·네비우스 -38.7%·코어위브 -39.8%이고 IREN은 연초 대비 여전히 -50% 이상이어서, 하루 +20%는 추세 전환이 아니라 낙폭 과대 되돌림 범위로 보는 편이 안전하다. 상승폭은 출처별로 코어위브 +10%와 +3%, 클라우드플레어 +12.52%와 +19.61%로 갈려 스냅샷 시점이 정리되지 않았다.", fresh:"24/7 Wall St.·stocktitan·tikr", date:"2026-11-06", url:"https://247wallst.com/investing/2026/11/06/cloudflare-soars-20-iren-surges-15-as-earnings-beats-spark-ai-cloud-rebound-coreweave-jumps-10/"},
  {t:"앤트로픽, Claude Enterprise '보안센터' 베타 공개·추론 훅 정식출시…IP 허용목록 자가관리, 데스크톱 개인계정 차단, 기존 DLP·EDR 연결", c:"산업", ci:"🤖", s:80, d:"11월 5일 앤트로픽 공식 게시. 보안센터는 chat·Cowork·Claude Code 설정을 앤트로픽 권장 구성과 대조해 격차를 표시하고 각 항목의 현재값·권장값을 함께 보여주며 감사인용 리포트로 내보낸다(베타). 함께 추론 훅이 GA가 됐고, admin.claude.com 상위 조직 콘솔에서 SSO·SCIM·도메인 검증·컴플라이언스 API 키를 관리하며, 관리자가 앤트로픽을 거치지 않고 IP 허용목록을 직접 설정할 수 있다. 정책 재작성 없이 기존 DLP·EDR 스택을 연결하는 것이 조달 심사 단축의 핵심이다.", fresh:"Anthropic(claude.com)", date:"2026-11-05", url:"https://claude.com/resources/articles/claude-enterprise-security-updates"},
  {t:"앤트로픽, 클로드 엔터프라이즈에 보안센터(베타)·'추론 훅' 정식 출시…프롬프트와 툴 호출을 고객사 DLP로 사전 검사", c:"산업", ci:"🤖", s:80, d:"보안센터는 베타, 추론 훅은 정식 출시(GA)다. 추론 훅은 클로드를 고객사가 이미 쓰는 데이터 보안 도구에 연결해 DLP·보안 정책이 프롬프트와 툴 호출에 그대로 적용되게 한다. 프롬프트 훅은 프롬프트를 고객사 보안 도구로 보내 검사하고, 사전 툴 호출 훅은 툴이 실행되기 전에 호출을 검사한다. 중앙 관리와 추가 접근통제도 함께 추가됐다. 골드만삭스가 AI 코딩 도구를 제한하고 애플이 좌석당 AI 예산 상한을 내린 국면에서, 모델 제공자 쪽이 규제 대응 기능으로 엔터프라이즈 좌석을 지키려는 움직임으로 읽힌다.", fresh:"Anthropic", date:"2026-11-05", url:"https://claude.com/resources/articles/claude-enterprise-security-updates"},
  {t:"백악관 네트워크에서 주거용 프록시 출구 노드 탐지…AS2650에서 30일 중 26일간 236회, 28개 프록시 서비스가 경유", c:"산업", ci:"🤖", s:80, d:"보안업체 Layer3 Intel이 미 대통령실 전용 IP 대역에서 유료 주거용 프록시 출구 노드를 탐지했다. 연구자가 몇 달러어치 프록시 접근권을 사서 대통령실 등록 6개 주소로 트래픽이 나오는 것을 직접 재현했다. 상주 인원 기기의 프록시 SDK 감염이 원인으로 추정되며, 허술한 프록시 SDK가 내부망 접근과 측면이동을 허용한 전례가 있어 침해 가능성이 제기됐다.", fresh:"GeekNews", date:"2026-11-05", url:"https://news.hada.io/topic?id=36612"},
  {t:"마벨, 루멘텀 154조원에 인수…AI 데이터센터 광통신 강화", c:"산업", ci:"🤖", s:80, d:"마벨 테크놀로지가 광통신 부품업체 루멘텀을 1150억달러(약 154조원)에 인수해, AI 데이터센터 광통신 인프라 경쟁이 가속될 전망이다.", fresh:"AI타임스", date:"2026-11-03", url:"https://www.aitimes.com/news/articleView.html?idxno=216952"},
  {t:"리커시브, 65B 밀집형 오픈웨이트 'Ripple-65B Preview' 공개…TerminalBench 2.1 80.5%로 501B·816B·975B 앞섰다고 자기 보고", c:"기술", ci:"🤖", s:79, d:"구글 알파칩 개발에 참여한 애나 골디 CEO·아잘리아 미르호세이니 CTO가 창업한 리커시브 인텔리전스가 11월 4일 Ripple-65B Preview를 공개했다. 12조 토큰으로 처음부터 사전학습한 밀집형(MoE 아님) 모델이고 최대 100만 토큰 컨텍스트를 설계 목표로 한다. 자기 보고 성능은 TerminalBench 2.1 80.5%·SWE-Bench Pro v2.0-Hard 79.1%로, Muse Spark Open-816B·Beam-501B·Inkling-975B를 앞섰다는 주장이다. 개발비는 선두 모델의 약 10분의 1이라고 밝혔다. 제3자 재현은 없고, 공개된 DGX Spark 스크립트가 128K에서 멈춘다는 지적이 있다.", fresh:"AI타임스·Ricursive 공식 X·DEV Community", date:"2026-11-06", url:"https://www.aitimes.com/news/articleView.html?idxno=217107"},
  {t:"앤트로픽, 클로드 '퍼스널 파이낸스' 베타…플레이드 경유 읽기 전용으로 은행·카드·대출·투자 계좌 연결, 최대 2년 거래이력", c:"제품", ci:"🤖", s:79, d:"이번 주 미국 Pro·Max·Ultra 구독자에게 베타로 열렸다(미국 한정). 플레이드를 통해 계좌를 연결하고 클로드는 잔액·신용한도·최대 2년치 거래이력에 읽기 전용으로 접근한다. 인증은 사용자가 플레이드에서 직접 하므로 클로드는 은행 비밀번호를 받지 않는다. 자금 이체·계좌 관리·투자 실행은 불가하고 투자 조언 목적도 아니다. 퍼스널 파이낸스 허브 내 대화는 모델 학습에서 제외된다. 규제가 걸리는 두 지점(자금 이동·투자 자문)을 의도적으로 비워 둔 설계다.", fresh:"Anthropic·TechCrunch", date:"2026-11-05", url:"https://claude.com/resources/articles/introducing-personal-finance-in-claude"},
  {t:"Route Anything — 범용 AI 시스템의 모델·정책 라우팅 연구 (업보트 86, HF 데일리 1위)", c:"연구", ci:"🤖", s:78, d:"작업을 어떤 모델에 보낼지 결정하는 라우팅을 모델 선택과 정책 선택 두 층으로 나눠 연구했다. 추론 원가가 경쟁축이 된 국면에서 '가장 센 모델 하나'가 아니라 '작업별 배분'이 성능·비용을 가르는 변수임을 다루는 주제여서 HF 데일리 1위에 올랐다.", fresh:"Hugging Face Daily Papers", date:"2026-11-05", url:"https://huggingface.co/papers"},
  {t:"\"머스크, 중간선거 최대 패자\"…4억4,600만 달러 쏟고 전패, 텍사스 사업 환경도 역풍", c:"인물", ci:"🤖", s:78, d:"머스크가 비후보 개인 역대 최대액인 4억4,600만 달러를 중간선거에 쓰고도 지지 후보가 거의 전패했다. 2억 달러를 투입한 텍사스 상원도 패했고, 테슬라·스페이스X 본사가 있는 텍사스의 주지사 당선인은 신규 데이터센터 중단과 세제혜택 폐지를 주장해 왔다.", fresh:"AI타임스", date:"2026-11-05", url:"https://www.aitimes.com/news/articleList.html?view_type=sm"},
  {t:"오픈AI, 12월부터 챗GPT·코덱스 사용량 통합…기존 앱 1월 종료", c:"산업", ci:"🤖", s:78, d:"OpenAI가 ChatGPT와 Codex의 사용량 쿼터를 하나로 통합하고 기존 Codex 앱을 1월 중 종료하기로 해, 개발자·구독자 요금 전반에 큰 영향을 주는 정책 변화다.", fresh:"AI타임스", date:"2026-11-03", url:"https://www.aitimes.com/news/articleView.html?idxno=216934"},
  {t:"구글, 1년 만에 AI 성능평가 1위 탈환…'제미나이 4 카본' 출시", c:"산업", ci:"🤖", s:78, d:"구글이 벤치마크 1위를 1년 만에 재탈환한 '제미나이 4 카본'을 공개해, 오픈AI·앤트로픽과의 모델 성능 경쟁이 다시 뜨거워졌다.", fresh:"AI타임스", date:"2026-11-03", url:"https://www.aitimes.com/news/articleView.html?idxno=216768"},
  {t:"오라클·메타, AI 인프라 투자 위해 수백억달러 규모 신규 채권 발행 검토", c:"산업", ci:"🤖", s:78, d:"메타가 AI 인프라 확장을 위해 최소 200억달러 규모의 신규 채권 발행을 검토 중이며 다중 통화 채권 발행 논의도 진행 중이다. 고금리 부담 속에서도 오라클과 함께 대규모 자금조달에 나서 AI 투자 경쟁의 자금 조달 구조를 보여준다.", fresh:"AI타임스", date:"2026-11-03", url:"https://www.aitimes.com/news/articleView.html?idxno=216944"},
  {t:"구글, 학교 지급 크롬북의 제미나이로 13세가 자살 계획을 세웠다는 소송 피소…11월 4일 캘리포니아 주법원, 같은 주에 K-12 기본 차단 발표", c:"정책", ci:"🤖", s:76, d:"소장에 따르면 '엠마'로 지칭된 13세가 수개월간 수천 건의 메시지를 주고받으며 '심각한 심리적 위기'에 이르렀고, 3개월 뒤 자살 방법을 물었으며 챗봇이 가족에게 감정을 숨기도록 도왔다고 주장한다. 발견 경로는 AI가 아니라 학교의 제3자 모니터링 소프트웨어였다. 청구 구조가 '위해를 끼쳤다'가 아니라 '학생에게 밀어넣고 위험을 경고하지 않았다'는 경고 의무 위반 쪽이어서, 생성 결과물의 내용을 다투는 것보다 입증 부담이 낮은 경로로 보인다. 구글은 같은 주에 학생 계정 제미나이를 기본 차단했으나 검색 접근을 유지하려는 학교는 AI 생성 요약을 수용해야 해 노출이 완전히 선택 가능해진 것은 아니다. 2026년 3월 플로리다 남성 관련 별건 소송도 있어 반복 패턴이다.", fresh:"The Hill·TimesLIVE·AOL(원고 측 주장 단계)", date:"2026-11-06", url:"https://thehill.com/policy/technology/6202466-google-gemini-lawsuit-suicide-claim/"},
  {t:"\"AI 성능 높아도 실무는 별개\"…새 벤치마크서 최고 12%에 그쳐", c:"연구", ci:"🤖", s:75, d:"실제 비즈니스 업무를 측정하는 새 벤치마크에서 최상위 AI 모델조차 12%에 머물러, 벤치마크 점수와 실무 투입 성과 사이의 간극이 수치로 확인됐다.", fresh:"AI타임스", date:"2026-11-04", url:"https://www.aitimes.com/news/articleList.html?view_type=sm"},
  {t:"Ubuntu, 치명적 리눅스 커널 TCP 취약점 패치 배포 지연 논란", c:"엔지니어링", ci:"🤖", s:75, d:"리눅스 커널의 치명적 TCP 취약점을 해결하는 패치 배포가 우분투에서 지체되고 있다는 지적이 제기돼, 서버 운영 환경의 대응 공백이 쟁점이 됐다.", fresh:"GeekNews", date:"2026-11-03", url:"https://news.hada.io/"},
  {t:"OpenAI, 생물·신약개발 특화 'GPT-Rosalind-6' 시스템 카드 공개", c:"산업", ci:"🤖", s:75, d:"OpenAI가 GPT-6 Astra와 가중치를 공유하는 생물학·신약개발 특화 추론모델 'GPT-Rosalind-6'의 시스템 카드 애덴덤을 공개했으며, 생물무기 오용 방지 안전장치를 갖춘 채 자격을 갖춘 연구자에게만 제공된다.", fresh:"TLDR AI", date:"2026-11-02", url:"https://deploymentsafety.openai.com/gpt-rosalind-6"},
  {t:"FrontierPhysics: 종단간 물리 연구를 수행하는 에이전트 평가 벤치마크 (추천 23)", c:"연구", ci:"🤖", s:74, d:"문제 풀이가 아니라 가설 수립부터 실험·분석까지 물리 연구 전 과정을 자율 수행하는 에이전트 능력을 평가한다. '추론 성능'이 아니라 '연구 수행 능력'을 직접 측정하려는 벤치마크로, AI for Science 투자 논거의 검증 수단이 된다.", fresh:"Hugging Face Daily Papers", date:"2026-11-05", url:"https://huggingface.co/papers"},
  {t:"오픈AI, AI로 하드웨어 설계 일주일 만에 완료…실제 시제품 제작까지", c:"산업", ci:"🤖", s:74, d:"오픈AI가 자사 모델을 기계·전기 공학부터 시스템 설계·시제품 제작까지 하드웨어 개발 전 과정에 투입해 통상 수개월 걸리는 설계를 일주일로 단축했다고 밝혔다.", fresh:"AI타임스", date:"2026-11-04", url:"https://www.aitimes.com/news/articleView.html?idxno=216989"},
  {t:"Switch-SWE — 코딩 에이전트는 미완성 작업 사이를 오갈 때 집중을 유지하는가", c:"연구", ci:"🤖", s:73, d:"허깅페이스 데일리 페이퍼. 코딩 에이전트에게 아직 끝나지 않은 여러 작업을 번갈아 맡겼을 때 문맥 전환이 성능에 미치는 영향을 측정하는 벤치마크다. 단일 작업 완주 성능만 보고 에이전트를 평가해 온 기존 방식의 공백을 겨냥한다 — 실무에서 에이전트는 거의 항상 중단·재개를 겪는다.", fresh:"Hugging Face Daily Papers", date:"2026-11-06", url:"https://huggingface.co/papers"},
  {t:"From Pixels to Actions: 네이티브 비전-언어-행동(VLA) 정책 (추천 20)", c:"연구", ci:"🤖", s:73, d:"시각 인식과 언어 이해를 중간 표현 없이 로봇 제어 행동으로 직접 연결하는 접근이다. 휴머노이드·로보틱스 밸류체인에서 '데이터'와 '정책 모델' 중 후자 쪽 병목을 다룬다.", fresh:"Hugging Face Daily Papers", date:"2026-11-05", url:"https://huggingface.co/papers"},
  {t:"알파벳 아이소모픽랩스, 50억 달러 조달 협상…기업가치 400~500억 달러, 5개월 전 시리즈B는 21억 달러", c:"기업", ci:"🤖", s:73, d:"구글 딥마인드에서 분사한 AI 신약개발사가 약 50억 달러 조달을 협상 중이라고 블룸버그가 보도했다. 5개월 전 21억 달러 시리즈B 대비 급등한 밸류에이션인데, 보도 자체가 'AI 신약개발사 중 임상 진입 사례가 거의 없고 AI 설계 의약품의 시판 사례는 0건'이라는 유보를 함께 달았다.", fresh:"Bloomberg", date:"2026-11-04", url:"https://www.bloomberg.com/news/articles/2026-11-04/isomorphic-labs-in-talks-for-about-5-billion-in-funding"},
  {t:"앤트로픽, 비가시 텍스트 워터마크를 구형 Claude 모델로 확대…11월 3일 1차 적용으로 Mythos 5·Opus 4.7·Sonnet 4.6 출력에 표식", c:"정책", ci:"🤖", s:72, d:"앤트로픽이 기존에 신규 모델에만 적용했던 비가시 텍스트 워터마크를 구형 모델로 소급 확대하고 있다. 1차 적용이 11월 3일 시작돼 Claude Mythos 5, Opus 4.7, Sonnet 4.6의 텍스트 출력에 표식이 붙는다. 구형 모델까지 추적 가능성을 깔면 'AI 생성물 식별'이 기업·규제기관 요구사항에서 옵션이 아니라 기본값으로 바뀐다. 다만 근거가 2차 요약 한 건이고 앤트로픽 공식 공지로는 확인되지 않았다.", fresh:"dev.to AI Daily Digest", date:"2026-11-06", url:"https://dev.to/hiroki-ii-ai/ai-daily-digest-november-6-2026-openai-ships-gpt-6-cyber-meta-buys-conductor-anthropic-locks-1jij"},
  {t:"Adversarial Speculative Reasoning — 적대적 추측 추론으로 장기 지평 에이전트 성능 개선", c:"연구", ci:"🤖", s:72, d:"허깅페이스 데일리 페이퍼. 추측적 실행(speculative) 구조에 적대적 검증자를 붙여 긴 호흡의 에이전트 작업에서 누적 오류를 줄이는 방법을 제시한다. 장기 작업에서 중간 단계 오류가 끝까지 전파되는 문제를 겨냥한 계열이다.", fresh:"Hugging Face Daily Papers", date:"2026-11-06", url:"https://huggingface.co/papers"},

function lunarSuffix(dateStr){
  try {
    const parts = (dateStr || "").split(" ")[0].split("-").map(Number);
    if (parts.length < 3 || typeof Solar === "undefined") return "";
    const lunar = Solar.fromYmd(parts[0], parts[1], parts[2]).getLunar();
    const lm = lunar.getMonth();
    const leap = lm < 0 ? "윤" : "";
    return ` (음력 ${lunar.getYear()}년 ${leap}${Math.abs(lm)}월 ${lunar.getDay()}일)`;
  } catch(e) { return ""; }
}

fetch("./data.json?_=" + Date.now())
  .then(r => r.json())
  .then(data => {
    ITEMS = data.items || [];
    PREDICTIONS = data.predictions || [];
    document.getElementById("dateval").textContent = (data.generated_at || "-") + lunarSuffix(data.generated_at);
    const avg = ITEMS.length ? (ITEMS.reduce((a,b)=>a+b.s,0)/ITEMS.length).toFixed(1) : "0";
    document.getElementById("statline").textContent = `${ITEMS.length}건 수집 · 평균 ${avg}점 · 예측 ${PREDICTIONS.length}건`;
    renderNav();
    renderBoard();
  })
  .catch(e => {
    document.getElementById("listview").innerHTML = '<div class="empty">데이터 로드 실패: ' + e + '</div>';
  });
